<script>
    'use strict';
    // ===== グリッドレンダリング =====
    function renderWeekGrid(days) {
        var today = formatDateLocal(new Date());
        var grid = document.getElementById('weekGrid');
        var isEdit = STATE.editMode;
        grid.innerHTML = '';
        grid.className = 'week-grid' + (isEdit ? ' edit-mode' : '');

        // 土日の表示設定に応じて列数を変え、表示列がより広く使えるようにする
        var visibleCount = 0;
        days.forEach(function (day, i) { if (isDayVisible(i)) visibleCount++; });
        grid.style.gridTemplateColumns = '80px repeat(' + visibleCount + ', minmax(140px, 1fr))';
        grid.style.minWidth = (96 + visibleCount * 144) + 'px';

        var corner = document.createElement('div');
        corner.className = 'grid-header';
        grid.appendChild(corner);

        days.forEach(function (day, i) {
            if (!isDayVisible(i)) return;
            var h = document.createElement('div');
            var cls = 'grid-header';
            if (day.date === today) cls += ' today-col';
            else if (i === 5) cls += ' sat-col';
            else if (i === 6) cls += ' sun-col';
            if (day.holiday) cls += ' holiday-col';
            h.className = cls;
            var headerHtml = '<div>' + day.dayLabel + '</div><div style="font-size:0.7rem;color:inherit;opacity:0.8;font-weight:400;">' + day.date.slice(5) + '</div>';
            if (day.holiday) {
                headerHtml += '<div class="holiday-name" title="' + escAttr(day.holiday) + '">' + escHtml(day.holiday) + '</div>';
            }
            h.innerHTML = headerHtml;

            // 振り返り状態チップ（授業がある過去〜今日の日に表示。クリックで振り返りを開く）
            if (day.date <= today && dayHasLessons(day)) {
                var chip = document.createElement('button');
                chip.type = 'button';
                var st = day.reflectionStatus || '';
                if (st === '完了') {
                    chip.className = 'reflection-chip done';
                    chip.innerHTML = '<span class="material-symbols-outlined">check_circle</span>振り返り済';
                    chip.title = '振り返りを見る・編集する';
                } else if (st === '保留') {
                    chip.className = 'reflection-chip hold';
                    chip.innerHTML = '<span class="material-symbols-outlined">pause_circle</span>保留中';
                    chip.title = '保留中の振り返りに取り組む';
                } else {
                    chip.className = 'reflection-chip todo';
                    chip.innerHTML = '<span class="material-symbols-outlined">edit_note</span>未記入';
                    chip.title = 'この日の振り返りを書く';
                }
                (function (dateStr) {
                    chip.addEventListener('click', function (e) {
                        e.stopPropagation();
                        openReflectionWizard(dateStr, {});
                    });
                })(day.date);
                h.appendChild(chip);
            }
            grid.appendChild(h);
        });

        var rows = [
            { key: 'event', label: '行事', multi: false, section: true },
            { key: 'preclass', label: '登校前', multi: false },
            { key: 'morning', label: '朝学習', multi: false },
            { key: 'period0', label: '1校時', multi: true, section: true },
            { key: 'period1', label: '2校時', multi: true },
            { key: 'recess1', label: '中休み', multi: false, section: true },
            { key: 'period2', label: '3校時', multi: true, section: true },
            { key: 'period3', label: '4校時', multi: true },
            { key: 'recess2', label: '昼休み', multi: false, section: true },
            { key: 'period4', label: '5校時', multi: true, section: true },
            { key: 'period5', label: '6校時', multi: true },
            { key: 'afterschool', label: '放課後', multi: false, section: true },
            { key: 'homework', label: '宿題', multi: false, section: true },
            { key: 'items', label: '持ち物', multi: false },
        ];

        rows.forEach(function (rowDef, rowIdx) {
            var label = document.createElement('div');
            label.className = 'grid-label' + (rowDef.section ? ' section-top' : '');
            label.textContent = rowDef.label;
            grid.appendChild(label);

            days.forEach(function (day, i) {
                if (!isDayVisible(i)) return;
                var cell = document.createElement('div');
                var cls = 'grid-cell';
                if (day.date === today) cls += ' today-col';
                else if (i === 5) cls += ' sat-col';
                else if (i === 6) cls += ' sun-col';
                if (day.holiday) cls += ' holiday-col';
                if (rowDef.section) cls += ' section-top';
                if (rowDef.key === 'event') cls += ' event-row';

                // UX: セル識別用 data 属性
                cell.setAttribute('data-day', i);
                cell.setAttribute('data-row', rowIdx);
                cell.setAttribute('data-key', rowDef.key);

                // UX: セル選択ハイライト復元
                if (STATE.selectedCell && STATE.selectedCell.day === i && STATE.selectedCell.row === rowIdx) {
                    cls += ' selected';
                }

                cell.className = cls;

                if (rowDef.multi) {
                    var pIdx = parseInt(rowDef.key.replace('period', ''));
                    var p = day.periods[pIdx] || { subject: '', unit: '', content: '' };
                    cell.setAttribute('data-period', pIdx);
                    // UX: D&D（校時セルは閲覧・編集両モードで有効）
                    cell.setAttribute('draggable', 'true');
                    cell.addEventListener('dragstart', handleDragStart);
                    cell.addEventListener('dragover', handleDragOver);
                    cell.addEventListener('dragenter', handleDragEnter);
                    cell.addEventListener('dragleave', handleDragLeave);
                    cell.addEventListener('drop', handleDrop);
                    cell.addEventListener('dragend', handleDragEnd);
                    if (isEdit) {
                        cell.innerHTML = renderPeriodEdit(pIdx, i, p);
                    } else {
                        cell.innerHTML = renderPeriodView(p);
                    }
                } else {
                    var val = day[rowDef.key] || '';
                    if (isEdit) {
                        var ta = document.createElement('textarea');
                        ta.rows = (rowDef.key === 'homework' || rowDef.key === 'items') ? 3 : 1;
                        ta.value = val;
                        ta.setAttribute('data-field', rowDef.key);
                        ta.setAttribute('data-day', i);
                        ta.style.minHeight = (rowDef.key === 'homework' || rowDef.key === 'items') ? '54px' : '28px';
                        ta.style.height = 'auto';
                        ta.addEventListener('input', function () { autoResizeTextarea(this); });
                        cell.appendChild(ta);
                        // リンク挿入ボタン
                        var linkBtn = document.createElement('button');
                        linkBtn.type = 'button';
                        linkBtn.className = 'link-insert-btn';
                        linkBtn.title = 'リンクを挿入';
                        linkBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;">link</span>';
                        (function(textarea) {
                            linkBtn.addEventListener('click', function(e) { e.stopPropagation(); openLinkInsertDialog(textarea); });
                        })(ta);
                        cell.appendChild(linkBtn);
                        // タスク選択ボタン（朝学習・中休み・昼休み・放課後などの空き時間向け）
                        if (['preclass', 'morning', 'recess1', 'recess2', 'afterschool'].indexOf(rowDef.key) >= 0) {
                            var taskBtn = document.createElement('button');
                            taskBtn.type = 'button';
                            taskBtn.className = 'field-task-btn';
                            taskBtn.title = 'タスクから選択（複数選択可）';
                            taskBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;">checklist</span>';
                            (function(dayIndex, fieldKey) {
                                taskBtn.addEventListener('click', function(e) { e.stopPropagation(); openTaskPickerForField(dayIndex, fieldKey); });
                            })(i, rowDef.key);
                            cell.appendChild(taskBtn);
                        }
                    } else {
                        var escaped = escHtml(val);
                        var linked = linkify(escaped.replace(/\n/g, '<br>'));
                        cell.innerHTML = linked;
                    }
                }

                // UX: 閲覧モード — セル選択イベント（同一セルの2連タップ/クリックで編集開始）
                if (!isEdit) {
                    cell.addEventListener('click', function () {
                        var now = Date.now();
                        var isDoubleTap = (_lastCellTap.day === i && _lastCellTap.row === rowIdx
                            && (now - _lastCellTap.time) < DOUBLE_TAP_MS);
                        _lastCellTap = { day: i, row: rowIdx, time: isDoubleTap ? 0 : now };
                        selectCell(i, rowIdx, rowDef.key);
                        if (isDoubleTap) startEditAtSelectedCell();
                    });
                } else {
                    // UX: 編集モード — セルの余白をクリックしたら、そのセルの入力欄へ入る。
                    // 入力欄にフォーカスが移れば focusin 経由でセル選択も追従するので、
                    // コピー／ペーストの対象は常に「いま編集しているセル」になる。
                    cell.addEventListener('click', function (e) {
                        if (e.target !== cell) return;
                        var firstInput = cell.querySelector('input, textarea');
                        if (firstInput) firstInput.focus();
                        else selectCell(i, rowIdx, rowDef.key, { keepFocus: true });
                    });
                }
                // UX: 右クリックコンテキストメニュー（コピー / ペースト / クリア / 元に戻す）。
                // 閲覧モードだけでなく編集モードでも同じ操作を出す。ただし編集モードで
                // 文字を選択している時は、ブラウザ標準のテキストメニューを優先して邪魔しない。
                var ctxPeriod = rowDef.multi ? parseInt(rowDef.key.replace('period', '')) : null;
                cell.addEventListener('contextmenu', function (e) {
                    // セル内のリンクは「新しいタブで開く」等が必要なのでブラウザ標準に任せる
                    if (e.target.closest && e.target.closest('a')) return;
                    if (isEdit && hasTextSelection(e.target)) return;
                    e.preventDefault();
                    selectCell(i, rowIdx, rowDef.key, { keepFocus: isEdit });
                    showContextMenu(e, i, ctxPeriod);
                });
                // タッチ端末には右クリックが無いため、閲覧モードでは長押しを代替にする。
                // 編集モードの長押しは文字選択・標準の貼り付けに使うので奪わず、
                // 代わりに選択中セルへ出る「セル操作」ハンドル（⋮）を入口にする。
                if (rowDef.multi && !isEdit) {
                    attachTouchLongPress(cell, i, rowIdx, rowDef.key, ctxPeriod);
                }

                grid.appendChild(cell);
            });
        });

        // 編集モード時: 全textareaの高さを内容に合わせる
        if (isEdit) {
            grid.querySelectorAll('textarea').forEach(function (ta) { autoResizeTextarea(ta); });
            // 既存の教科セル値も検証して不正なら赤枠表示する
            grid.querySelectorAll('[data-field="subject"]').forEach(function (inp) { updateSubjectInputValidity(inp); });
        }

        // 閲覧モード時: グリッドにフォーカスを当ててキーボードショートカットを有効化
        if (!isEdit) {
            grid.focus({ preventScroll: true });
        }

        // 再描画でセルごと作り直されるため、選択中セルの「セル操作」ハンドルを付け直す
        refreshCellActionHandle();
    }

    // UX: textarea の自動リサイズ
    function autoResizeTextarea(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }

    function renderPeriodView(p) {
        if (!p.subject && !p.unit && !p.content) return '';
        var free = isFreeContent(p.content);
        var html = '';
        if (p.subject) {
            html += '<div class="period-subject">' + escHtml(p.subject)
                + (free ? '<span class="period-free-badge">空き</span>' : '') + '</div>';
        }
        if (p.unit) html += '<div class="period-unit">' + linkify(escHtml(p.unit)) + '</div>';
        if (p.content) {
            if (free) {
                // 空き時間: 授業内容とタスクを分割して表示
                var parts = splitFreeContent(p.content);
                if (parts.subjectPart.trim()) {
                    html += '<div class="period-content">' + linkify(escHtml(parts.subjectPart.trim()).replace(/\n/g, '<br>')) + '</div>';
                }
                html += '<div class="period-freetask"><span class="period-freetask-label">タスク</span>'
                    + (parts.taskPart.trim() ? linkify(escHtml(parts.taskPart.trim()).replace(/\n/g, '<br>')) : '') + '</div>';
            } else {
                html += '<div class="period-content">' + linkify(escHtml(p.content).replace(/\n/g, '<br>')) + '</div>';
            }
        }
        return html;
    }

    function renderPeriodEdit(pIdx, dayIdx, p) {
        return '<input type="text" class="period-subject-input" placeholder="教科" value="' + escAttr(p.subject) + '" '
            + 'data-field="subject" data-day="' + dayIdx + '" data-period="' + pIdx + '" '
            + 'oninput="onSubjectInput(this)" onfocus="showSuggest(this)" onblur="hideSuggest(this)">'
            + '<div style="display:flex;align-items:center;gap:2px;">'
            + '<input type="text" placeholder="単元名" value="' + escAttr(p.unit) + '" '
            + 'data-field="unit" data-day="' + dayIdx + '" data-period="' + pIdx + '" style="flex:1;min-width:0;">'
            + '<button type="button" class="unit-picker-btn" onclick="openUnitPicker(' + dayIdx + ',' + pIdx + ')" '
            + 'title="単元マスタから選択（教科名が空の時間・空き時間はタスクから選択）" style="flex-shrink:0;padding:1px 3px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);cursor:pointer;line-height:1;">'
            + '<span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;">list_alt</span></button>'
            + '<button type="button" class="free-slot-btn' + (isFreeContent(p.content) ? ' free-slot-active' : '') + '" onclick="toggleFreeSlot(' + dayIdx + ',' + pIdx + ',this)" '
            + 'title="空き時間（別教員担当）に設定。教科の内容とタスクを分けて入力できます" style="flex-shrink:0;padding:1px 3px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);cursor:pointer;line-height:1;font-size:0.62rem;">空</button></div>'
            + '<div style="position:relative;">'
            + '<textarea rows="2" placeholder="学習内容" style="font-size:0.72rem;min-height:36px;height:auto;" '
            + 'data-field="content" data-day="' + dayIdx + '" data-period="' + pIdx + '" '
            + 'id="content-' + dayIdx + '-' + pIdx + '" '
            + 'oninput="autoResizeTextarea(this)">' + escHtml(p.content) + '</textarea>'
            + '<button type="button" class="link-insert-btn period-link-btn" title="リンクを挿入" '
            + 'onclick="event.stopPropagation(); openLinkInsertDialog(document.getElementById(\'content-' + dayIdx + '-' + pIdx + '\'))">'
            + '<span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;">link</span></button>'
            + '</div>'
            + '<div class="suggest-box" id="suggest-' + dayIdx + '-' + pIdx + '" style="display:none;"></div>';
    }

    // ===== 教科セル入力の検証（サーバー側 validateSubjectCellValue_ と同一ロジック） =====
    /**
     * 教科セルの値を解析します。"国語" や "国語1/3行事2/3" に対応。
     * 返り値: { entries: [{subject, num, den, explicit}], unparsedText: string }
     */
    function parseSubjectCellEntries(value) {
        var result = { entries: [], unparsedText: '' };
        if (value === null || value === undefined) return result;
        var normalized = value.toString().trim().replace(/　/g, ' ');
        if (!normalized) return result;
        var regex = /([^\s\d\/\.]+)(?:[\s]*(\d+\/\d+|\d+\.\d+))?/g;
        var match, lastIndex = 0, unparsed = '';
        while ((match = regex.exec(normalized)) !== null) {
            if (match.index > lastIndex) unparsed += normalized.slice(lastIndex, match.index);
            lastIndex = regex.lastIndex;
            var subject = match[1].trim();
            if (!subject) continue;
            var num = 1, den = 1, explicit = false;
            if (match[2]) {
                explicit = true;
                if (match[2].indexOf('/') >= 0) {
                    var parts = match[2].split('/');
                    num = parseInt(parts[0], 10);
                    den = parseInt(parts[1], 10);
                } else {
                    var decParts = match[2].split('.');
                    den = Math.pow(10, decParts[1].length);
                    num = parseInt(decParts[0], 10) * den + parseInt(decParts[1], 10);
                }
            }
            result.entries.push({ subject: subject, num: num, den: den, explicit: explicit });
        }
        if (lastIndex < normalized.length) unparsed += normalized.slice(lastIndex);
        result.unparsedText = unparsed.replace(/\s/g, '');
        return result;
    }

    /**
     * 教科セルの入力値を検証します。
     * 「単一教科名」または「教科名+分数（合計が正確に1）」のみ有効。
     * 返り値: { valid: boolean, message?: string }
     */
    function validateSubjectCellValue(value) {
        var parsed = parseSubjectCellEntries(value);
        var entries = parsed.entries;
        if (parsed.unparsedText) {
            return { valid: false, message: '解釈できない文字「' + parsed.unparsedText + '」が含まれています。「国語」または「国語1/3行事2/3」の形式で入力してください。' };
        }
        if (entries.length === 0) return { valid: true };
        if (entries.length === 1 && !entries[0].explicit) return { valid: true };
        var noFraction = entries.filter(function (en) { return !en.explicit; }).map(function (en) { return en.subject; });
        if (noFraction.length > 0) {
            return { valid: false, message: '「' + noFraction.join('」「') + '」に分数がありません。複数教科を入力する場合は各教科に分数を付けてください（例: 国語1/3行事2/3）。' };
        }
        for (var i = 0; i < entries.length; i++) {
            if (entries[i].den === 0) return { valid: false, message: '分母が0の分数は入力できません。' };
        }
        // 有理数で正確に合計し、合計が1かどうかを判定（浮動小数点誤差を回避）
        var num = 0, den = 1;
        entries.forEach(function (en) {
            num = num * en.den + en.num * den;
            den = den * en.den;
        });
        if (num !== den) {
            var gcd = function (a, b) { return b === 0 ? a : gcd(b, a % b); };
            var g = gcd(Math.abs(num), Math.abs(den)) || 1;
            var sumStr = (den / g === 1) ? String(num / g) : (num / g) + '/' + (den / g);
            return { valid: false, message: '分数の合計が1になっていません（合計: ' + sumStr + '）。セル内の分数の合計は必ず1にしてください。' };
        }
        return { valid: true };
    }

    /** 入力欄の検証状態（赤枠+ツールチップ）を更新します。 */
    function updateSubjectInputValidity(input) {
        var check = validateSubjectCellValue(input.value);
        if (check.valid) {
            input.classList.remove('subject-input-invalid');
            input.removeAttribute('title');
        } else {
            input.classList.add('subject-input-invalid');
            input.title = check.message;
        }
        return check;
    }

    /** 週データ全体の教科セルを検証し、エラーメッセージ配列を返します。 */
    function validateDaysSubjects(days) {
        var errors = [];
        (days || []).forEach(function (day) {
            if (!day || !day.periods) return;
            day.periods.forEach(function (p, idx) {
                var value = p && p.subject;
                if (!value) return;
                var check = validateSubjectCellValue(value);
                if (!check.valid) {
                    errors.push((day.dayLabel || day.date || '') + ' ' + (idx + 1) + '校時「' + value + '」: ' + check.message);
                }
            });
        });
        return errors;
    }

    // ===== 教科名の正規化（サーバー側 normalizeSubjectName_ と同一ルール） =====
    // 「図工」と「図画工作」のような同一教科の表記ゆれを同じ教科として扱うためのマップ
    var SUBJECT_NAME_ALIASES = { '図工': '図画工作' };

    function normalizeSubjectName(name) {
        var s = (name === null || name === undefined) ? '' : String(name).trim();
        return SUBJECT_NAME_ALIASES[s] || s;
    }

    /** masterMap から、表記ゆれを同一視して該当教科の単元リストを取得します。 */
    function findMasterMapUnits(masterMap, subject) {
        if (!masterMap) return null;
        if (masterMap[subject]) return masterMap[subject];
        var canon = normalizeSubjectName(subject);
        if (masterMap[canon]) return masterMap[canon];
        for (var key in masterMap) {
            if (normalizeSubjectName(key) === canon) return masterMap[key];
        }
        return null;
    }

    // ===== 教科サジェスト =====
    function onSubjectInput(input) {
        updateSubjectInputValidity(input);
        if (!STATE.masterData) return;
        var val = input.value;
        var dayIdx = input.dataset.day;
        var pIdx = input.dataset.period;
        var box = document.getElementById('suggest-' + dayIdx + '-' + pIdx);
        if (!box) return;
        var subjects = STATE.masterData.subjects || [];
        var matches = val ? subjects.filter(function (s) {
            // 表記ゆれ（図工/図画工作）も候補に含める
            return s.indexOf(val) >= 0 || normalizeSubjectName(s).indexOf(normalizeSubjectName(val)) >= 0;
        }) : subjects.slice(0, 8);
        if (matches.length === 0) { box.style.display = 'none'; return; }
        box.innerHTML = matches.map(function (s) {
            return '<div class="suggest-item" onmousedown="selectSubject(this,\'' + escAttr(s) + '\',\'' + dayIdx + '\',\'' + pIdx + '\')">' + escHtml(s) + '</div>';
        }).join('');
        box.style.display = 'block';
    }

    function showSuggest(input) { onSubjectInput(input); }
    function hideSuggest(input) {
        setTimeout(function () {
            var dayIdx = input.dataset.day;
            var pIdx = input.dataset.period;
            var box = document.getElementById('suggest-' + dayIdx + '-' + pIdx);
            if (box) box.style.display = 'none';
        }, 200);
    }
    function selectSubject(el, subject, dayIdx, pIdx) {
        var cell = el.closest('.grid-cell');
        if (!cell) return;
        var inp = cell.querySelector('[data-field="subject"]');
        if (inp) { inp.value = subject; updateSubjectInputValidity(inp); }
        var box = document.getElementById('suggest-' + dayIdx + '-' + pIdx);
        if (box) box.style.display = 'none';
    }

    // ===== 単元マスタピッカー（進捗情報なしの基本版） =====
    // 進捗つきの openUnitPicker は App_Js_16_UnitProgress.html で定義され、
    // 進捗インデックスの取得に失敗したときはこの基本版にフォールバックする。
    function openUnitPickerBasic(dayIdx, pIdx) {
        // 対象スロットの教科名を取得
        var subjectEl = document.querySelector('[data-field="subject"][data-day="' + dayIdx + '"][data-period="' + pIdx + '"]');
        var subject = subjectEl ? subjectEl.value.trim() : '';
        var contentEl = document.querySelector('[data-field="content"][data-day="' + dayIdx + '"][data-period="' + pIdx + '"]');
        // 教科名が空の時間、または空き時間（別教員担当）は「タスクから選択」モーダルを開く
        if (!subject || (contentEl && isFreeContent(contentEl.value))) {
            openTaskPickerForContent(dayIdx, pIdx);
            return;
        }

        // masterMapから該当教科の単元リストを取得（図工/図画工作などの表記ゆれも同一視）
        var units = STATE.masterData ? findMasterMapUnits(STATE.masterData.masterMap, subject) : null;
        if (!units || units.length === 0) {
            showToast('warning', '「' + subject + '」の単元マスタデータが見つかりません。');
            return;
        }

        // 単元リストHTML生成（オブジェクト形式と旧文字列形式の両方に対応）
        var unitListHtml = units.map(function (u, i) {
            var name = typeof u === 'string' ? u : u.unitName;
            var hours = typeof u === 'string' ? '?' : u.totalHours;
            return '<div class="unit-picker-item" data-idx="' + i + '" '
                + 'style="padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s;" '
                + 'onmouseover="this.style.background=\'var(--bg-hover, var(--surface-hover))\'" onmouseout="this.style.background=\'transparent\'">'
                + '<strong>' + escHtml(name) + '</strong>'
                + '<span style="color:var(--text-sub);margin-left:8px;font-size:0.8rem;">（' + hours + '時間）</span>'
                + '</div>';
        }).join('');

        Swal.fire({
            title: '「' + subject + '」の単元を選択',
            html: '<div style="max-height:300px;overflow-y:auto;text-align:left;border:1px solid var(--border);border-radius:6px;">'
                + unitListHtml + '</div>',
            showConfirmButton: false,
            showCancelButton: true,
            cancelButtonText: '閉じる',
            didOpen: function () {
                var items = Swal.getHtmlContainer().querySelectorAll('.unit-picker-item');
                items.forEach(function (item) {
                    item.addEventListener('click', function () {
                        var idx = parseInt(item.dataset.idx, 10);
                        var u = units[idx];
                        var unitName = typeof u === 'string' ? u : u.unitName;
                        var totalHours = typeof u === 'string' ? 1 : u.totalHours;
                        Swal.close();
                        openHourPicker(dayIdx, pIdx, subject, unitName, totalHours);
                    });
                });
            }
        });
    }

    function openHourPicker(dayIdx, pIdx, subject, unitName, totalHours, nextHour) {
        // 指導済みの時数がマスタの総時数を超えている場合もあるため、選択肢は
        // 総時数と「次の時間目」の大きい方まで出す（既存の effectiveTotal と同じ考え方）。
        // ここで決めた maxHour は選択肢の表示にもセルに書く分母にも使う。
        // 表示と書き込みで分母が食い違うと「13/13 を選んだのに 13/10 と入る」ことになる。
        var maxHour = Math.max(parseInt(totalHours, 10) || 1, parseInt(nextHour, 10) || 1);
        var options = {};
        for (var h = 1; h <= maxHour; h++) {
            options[h] = h + '/' + maxHour + ' 時間目';
        }
        // 既定値は「次に指導する時間目」。未指定なら従来どおり1時間目。
        var defaultHour = Math.min(Math.max(parseInt(nextHour, 10) || 1, 1), maxHour);

        Swal.fire({
            title: unitName,
            text: '何時間目を入力しますか？',
            input: 'select',
            inputOptions: options,
            inputValue: String(defaultHour),
            showCancelButton: true,
            confirmButtonText: '入力する',
            cancelButtonText: 'キャンセル',
            inputValidator: function (value) {
                if (!value) return '時間目を選択してください。';
            }
        }).then(function (result) {
            if (!result.isConfirmed) return;
            var hourNum = parseInt(result.value, 10);

            // 単元名セルに入力
            var unitEl = document.querySelector('[data-field="unit"][data-day="' + dayIdx + '"][data-period="' + pIdx + '"]');
            if (unitEl) unitEl.value = unitName + ' ' + hourNum + '/' + maxHour;

            // サーバーから学習活動を取得してcontentに入力
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        var contentEl = document.querySelector('[data-field="content"][data-day="' + dayIdx + '"][data-period="' + pIdx + '"]');
                        if (contentEl) {
                            contentEl.value = res.activity || '';
                            autoResizeTextarea(contentEl);
                        }
                        showToast('success', unitName + ' ' + hourNum + '/' + maxHour + ' を入力しました。');
                    }
                })
                .withFailureHandler(function (e) {
                    showToast('error', '学習活動の取得に失敗: ' + e.message);
                })
                .getActivityFromMaster(subject, unitName, hourNum);
        });
    }

    // ===== 空き時間（別教員担当の時間）ヘルパー =====
    // 教科の内容とタスクを1つの内容欄内で分割するための区切りマーカー。
    // このマーカーが内容に含まれる時間を「空き時間」として扱う。
    var FREE_TASK_DIVIDER = '─── タスク ───';
    /** 内容テキストが空き時間（区切りマーカーを含む）かどうかを判定します。 */
    function isFreeContent(text) {
        return !!text && text.indexOf(FREE_TASK_DIVIDER) !== -1;
    }
    /** 空き時間の内容を「授業内容」と「タスク」に分割します。 */
    function splitFreeContent(text) {
        var t = String(text || '');
        var idx = t.indexOf(FREE_TASK_DIVIDER);
        if (idx === -1) return { subjectPart: t, taskPart: '' };
        return {
            subjectPart: t.slice(0, idx).replace(/\n+$/, ''),
            taskPart: t.slice(idx + FREE_TASK_DIVIDER.length).replace(/^\n+/, '')
        };
    }

    /**
     * 校時セルの「空き時間」設定をトグルします。
     * ONにすると内容欄に区切りマーカーを挿入し、教科内容とタスクを分割入力できるようにします。
     */
    function toggleFreeSlot(dayIdx, pIdx, btn) {
        var contentEl = document.querySelector('[data-field="content"][data-day="' + dayIdx + '"][data-period="' + pIdx + '"]');
        if (!contentEl) return;
        if (isFreeContent(contentEl.value)) {
            // 空き時間を解除：区切りマーカーを除去して授業内容とタスクを結合
            var parts = splitFreeContent(contentEl.value);
            contentEl.value = [parts.subjectPart, parts.taskPart].filter(function (s) { return s.trim(); }).join('\n');
            if (btn) btn.classList.remove('free-slot-active');
            showToast('info', '空き時間の設定を解除しました。');
        } else {
            // 空き時間に設定：末尾に区切りマーカーを追加
            var existing = contentEl.value.replace(/\s+$/, '');
            contentEl.value = (existing ? existing + '\n' : '') + FREE_TASK_DIVIDER + '\n';
            if (btn) btn.classList.add('free-slot-active');
            showToast('success', 'この時間を空き時間に設定しました。教科の内容とタスクを分けて入力できます。');
        }
        autoResizeTextarea(contentEl);
    }

    // ===== タスク選択（教科名が空の時間・空き時間の内容入力） =====
    /** タスクが未読込の場合はサーバーから取得し、その後にcbを実行します。 */
    function withTasksLoaded(cb) {
        if (STATE.taskDataLoaded && STATE.allTaskData) { cb(); return; }
        showToast('info', 'タスクを読み込んでいます...');
        google.script.run
            .withSuccessHandler(function (res) {
                if (res.success) {
                    STATE.allTaskData = res.tasks || [];
                    STATE.tasks = STATE.allTaskData;
                    STATE.taskDataLoaded = true;
                    cb();
                } else {
                    showToast('error', 'タスク取得エラー: ' + res.error);
                }
            })
            .withFailureHandler(function (e) { showToast('error', 'タスク取得に失敗: ' + e.message); })
            .getTasksFromWebApp();
    }

    /**
     * 校時セルの内容欄に、タスクから選択して転記します。
     * 教科名が空の時間、または空き時間（別教員担当）でのみ利用できます。
     * タスクは複数選択でき、選択した未着手タスクは自動的に「進行中」になります。
     */
    function openTaskPickerForContent(dayIdx, pIdx) {
        var contentEl = document.querySelector('[data-field="content"][data-day="' + dayIdx + '"][data-period="' + pIdx + '"]');
        if (!contentEl) return;
        var subjectEl = document.querySelector('[data-field="subject"][data-day="' + dayIdx + '"][data-period="' + pIdx + '"]');
        var subject = subjectEl ? subjectEl.value.trim() : '';
        // 教科名がある通常の時間は対象外（空き時間に設定されている場合は許可）
        if (subject && !isFreeContent(contentEl.value)) {
            showToast('warning', '教科名が入力されている時間です。タスクを入れる場合は「空き」ボタンで空き時間に設定してください。');
            return;
        }
        withTasksLoaded(function () { showTaskPickerModal(contentEl); });
    }

    /**
     * 日課レベルのセル（朝学習・中休み・昼休み・放課後）の入力欄にタスクを転記します。
     */
    function openTaskPickerForField(dayIdx, key) {
        var el = document.querySelector('[data-field="' + key + '"][data-day="' + dayIdx + '"]');
        if (!el) return;
        withTasksLoaded(function () { showTaskPickerModal(el); });
    }

    /**
     * タスク選択モーダル（複数選択チェックボックス）を表示し、確定時に対象要素へ転記します。
     * キーワード検索とステータス絞り込みで目的のタスクを素早く探せます。
     */
    function showTaskPickerModal(targetEl) {
        // 完了済みを除いた未完了タスクを対象にする
        var tasks = (STATE.allTaskData || []).filter(function (t) { return t.status !== '完了'; });
        if (tasks.length === 0) {
            showToast('warning', '選択できる未完了タスクがありません。');
            return;
        }

        // 期日が近い順（期日なしは最後）→ 同じ期日は優先度が高い順に並べる
        var prioOrder = { '高': 0, '中': 1, '低': 2 };
        tasks.sort(function (a, b) {
            if (!a.dueDate && b.dueDate) return 1;
            if (a.dueDate && !b.dueDate) return -1;
            if (a.dueDate !== b.dueDate) return String(a.dueDate).localeCompare(String(b.dueDate));
            return (prioOrder[a.priority] !== undefined ? prioOrder[a.priority] : 1)
                - (prioOrder[b.priority] !== undefined ? prioOrder[b.priority] : 1);
        });

        var listHtml = tasks.map(function (t, i) {
            var statusMeta = taskStatusMeta(t.status || '未着手');
            var due = t.dueDate ? t.dueDate.replace(/^\d{4}-/, '').replace('-', '/') : '期日なし';
            // 検索用テキスト（内容・準備物・メモ・出典を小文字で連結）
            var haystack = [t.content || '', t.resource || '', t.memo || '', t.source || ''].join(' ').toLowerCase();
            return '<label class="task-pick-item" data-status="' + escHtmlAttr(t.status || '未着手') + '" data-search="' + escHtmlAttr(haystack) + '" style="display:flex;align-items:flex-start;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;">'
                + '<input type="checkbox" class="task-pick-cb" value="' + i + '" style="margin-top:3px;flex-shrink:0;">'
                + '<span style="text-align:left;line-height:1.4;">'
                + '<span style="font-weight:600;">☐' + escHtml(t.content) + '</span>'
                + (t.resource ? '<br><span style="font-size:0.8rem;color:var(--text-sub);">・' + escHtml(t.resource) + '</span>' : '')
                + '<br><span style="font-size:0.72rem;color:var(--text-hint);">' + statusMeta.label + ' / ' + due + '</span>'
                + '</span></label>';
        }).join('');

        Swal.fire({
            title: 'タスクから選択',
            html: '<div style="font-size:0.8rem;color:var(--text-sub);margin-bottom:6px;text-align:left;">選択したタスクを内容欄に追加します（複数選択可）。未着手のタスクは自動的に「進行中」になります。</div>'
                + '<input id="taskPickSearch" type="search" class="form-control" placeholder="キーワードで絞り込み（内容・準備物・メモ）" style="font-family:inherit;font-size:0.85rem;margin-bottom:6px;">'
                + '<div class="task-filter-chips" style="margin-bottom:6px;">'
                + '<button type="button" class="task-filter-chip task-pick-filter active" data-status-filter="all">すべて</button>'
                + '<button type="button" class="task-filter-chip task-pick-filter" data-status-filter="未着手">未着手</button>'
                + '<button type="button" class="task-filter-chip task-pick-filter" data-status-filter="進行中">進行中</button>'
                + '<span id="taskPickCount" style="margin-left:auto;font-size:0.75rem;color:var(--text-sub);"></span>'
                + '</div>'
                + '<div style="max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;">' + listHtml
                + '<div id="taskPickEmpty" style="display:none;color:var(--text-hint);padding:16px;font-size:0.85rem;">条件に合うタスクがありません。</div>'
                + '</div>',
            showCancelButton: true,
            confirmButtonText: '追加する',
            cancelButtonText: 'キャンセル',
            focusConfirm: false,
            didOpen: function () {
                var container = Swal.getHtmlContainer();
                var searchEl = container.querySelector('#taskPickSearch');
                var chips = container.querySelectorAll('.task-pick-filter');
                var items = container.querySelectorAll('.task-pick-item');
                var emptyEl = container.querySelector('#taskPickEmpty');
                var countEl = container.querySelector('#taskPickCount');
                var statusFilter = 'all';

                // 検索キーワード・ステータスで行を絞り込み、選択件数と表示件数を更新する
                function updatePickerViews() {
                    var kw = (searchEl.value || '').trim().toLowerCase();
                    var visible = 0;
                    Array.prototype.forEach.call(items, function (item) {
                        var hit = (statusFilter === 'all' || item.dataset.status === statusFilter)
                            && (!kw || item.dataset.search.indexOf(kw) >= 0);
                        item.style.display = hit ? 'flex' : 'none';
                        if (hit) visible++;
                    });
                    if (emptyEl) emptyEl.style.display = visible === 0 ? 'block' : 'none';
                    var checked = container.querySelectorAll('.task-pick-cb:checked').length;
                    if (countEl) countEl.textContent = '選択中 ' + checked + ' 件 / 表示 ' + visible + ' 件';
                }

                searchEl.addEventListener('input', updatePickerViews);
                Array.prototype.forEach.call(chips, function (chip) {
                    chip.addEventListener('click', function () {
                        statusFilter = chip.dataset.statusFilter;
                        Array.prototype.forEach.call(chips, function (c) { c.classList.toggle('active', c === chip); });
                        updatePickerViews();
                    });
                });
                // チェック状態は絞り込みで隠れても保持される（選択中件数に含まれる）
                container.addEventListener('change', function (e) {
                    if (e.target && e.target.classList && e.target.classList.contains('task-pick-cb')) updatePickerViews();
                });
                updatePickerViews();
                searchEl.focus();
            },
            preConfirm: function () {
                var checked = Swal.getHtmlContainer().querySelectorAll('.task-pick-cb:checked');
                if (checked.length === 0) {
                    Swal.showValidationMessage('タスクを1つ以上選択してください。');
                    return false;
                }
                return Array.prototype.map.call(checked, function (cb) { return parseInt(cb.value, 10); });
            }
        }).then(function (result) {
            if (!result.isConfirmed) return;
            var selected = result.value.map(function (i) { return tasks[i]; });
            applySelectedTasksToTextarea(targetEl, selected);
        });
    }

    /**
     * 選択したタスクを対象の入力欄へ「☐タスク名 + 改行 + ・内容の詳細」形式で追記し、
     * 未着手タスクを「進行中」に自動更新します。
     * 空き時間の場合はタスクは区切りマーカーより後（タスク欄）に追記されます。
     */
    function applySelectedTasksToTextarea(targetEl, selectedTasks) {
        if (!targetEl) return;

        // 表示テキスト生成: ☐タスク名 で改行し ・内容の詳細
        var blocks = selectedTasks.map(function (t) {
            var line = '☐' + (t.content || '');
            if (t.resource) line += '\n・' + t.resource;
            return line;
        });
        var addText = blocks.join('\n');

        var existing = targetEl.value.replace(/\s+$/, '');
        targetEl.value = existing ? (existing + '\n' + addText) : addText;
        autoResizeTextarea(targetEl);

        // 未着手（未実施）のタスクを進行中（実施中）へ自動変更
        var toStart = selectedTasks.filter(function (t) { return (t.status || '未着手') === '未着手'; });
        toStart.forEach(function (t) {
            var prevStatus = t.status || '未着手';
            t.status = '進行中'; // 楽観的更新
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) {
                        showToast('error', 'ステータス更新失敗: ' + (res.error || '不明'));
                        t.status = prevStatus; // ロールバック
                        refreshTaskViews();
                    }
                })
                .withFailureHandler(function (e) {
                    showToast('error', 'ステータス更新失敗: ' + e.message);
                    t.status = prevStatus; // ロールバック
                    refreshTaskViews();
                })
                .updateTaskStatusFromWebApp(t.id, '進行中');
        });
        if (toStart.length > 0) refreshTaskViews();

        showToast('success', selectedTasks.length + '件のタスクを内容に追加しました。'
            + (toStart.length ? '（' + toStart.length + '件を進行中に変更）' : ''));
    }

    // ===== 編集モード制御 =====
    function toggleEditMode() {
        if (STATE.editMode) { exitEditMode(); return; }
        STATE.editMode = true;
        updateEditUI();
        renderWeekGrid(STATE.weekData.days);
        // 編集モードに入った時点で単元の進捗を先読みしておく（ピッカーを開いた時の待ちを消す）
        if (typeof prefetchUnitProgress === 'function') prefetchUnitProgress();
    }
    function cancelEdit() {
        exitEditMode();
    }

    /**
     * 編集モードを抜け、編集中の変更を破棄します。
     * 編集モードのコピー＆ペースト等のセル操作は STATE.weekData.days を直接書き換えるため、
     * 入力欄を捨てるだけでは元に戻りません。編集開始時のスナップショットへ明示的に戻します。
     */
    function exitEditMode() {
        var baseline = STATE.editBaseline; // updateEditUI() が捨てる前に受け取る
        if (baseline && STATE.weekData) {
            STATE.weekData.days = baseline;
            markWeekDaysMutated();
        }
        STATE.editMode = false;
        updateEditUI();
        if (STATE.weekData && STATE.weekData.days) renderWeekGrid(STATE.weekData.days);
    }

    /**
     * 編集開始時の週データのスナップショットを取り／捨てします。
     * updateEditUI() は編集モードの出入り全経路（切替・キャンセル・自動保存・競合処理）から
     * 呼ばれるため、ここに置くのがいちばん取りこぼしがありません。
     */
    function syncEditBaseline() {
        if (!STATE.editMode) { STATE.editBaseline = null; return; }
        if (!STATE.editBaseline && STATE.weekData && STATE.weekData.days) {
            STATE.editBaseline = JSON.parse(JSON.stringify(STATE.weekData.days));
        }
    }

    function updateEditUI() {
        syncEditBaseline();
        var dot = document.querySelector('.mode-dot');
        var label = document.getElementById('modeLabel');
        var editBtn = document.getElementById('editToggleBtn');
        var pdfBtn = document.getElementById('pdfBtn');
        var autoFillBtn = document.getElementById('autoFillBtn');
        var timetableBtn = document.getElementById('timetableApplyBtn');
        var batchAutoFillBtn = document.getElementById('batchAutoFillBtn');
        var shiftLessonBtn = document.getElementById('shiftLessonBtn');
        var saveBtn = document.getElementById('saveBtn');
        var cancelBtn = document.getElementById('cancelBtn');
        var hint = document.getElementById('modeHint');
        if (STATE.editMode) {
            dot.className = 'mode-dot edit-dot';
            label.textContent = '編集モード';
            if (hint) {
                hint.style.display = '';
                hint.textContent = '右クリック / ⋮ でコピー・ペースト';
            }
            editBtn.style.display = 'none';
            if (pdfBtn) pdfBtn.style.display = 'none';
            if (timetableBtn) timetableBtn.style.display = 'flex';
            if (autoFillBtn) autoFillBtn.style.display = 'flex';
            if (batchAutoFillBtn) batchAutoFillBtn.style.display = 'flex';
            if (shiftLessonBtn) shiftLessonBtn.style.display = 'flex';
            saveBtn.style.display = 'flex';
            cancelBtn.style.display = '';
        } else {
            dot.className = 'mode-dot view-dot';
            label.textContent = '閲覧モード';
            if (hint) hint.style.display = 'none';
            editBtn.style.display = '';
            if (pdfBtn) pdfBtn.style.display = '';
            if (timetableBtn) timetableBtn.style.display = 'none';
            if (autoFillBtn) autoFillBtn.style.display = 'none';
            if (batchAutoFillBtn) batchAutoFillBtn.style.display = 'flex';
            if (shiftLessonBtn) shiftLessonBtn.style.display = 'none';
            saveBtn.style.display = 'none';
            cancelBtn.style.display = 'none';
            // 閲覧モード切替時にグリッドへフォーカスを移してキーボードショートカットを有効化
            var grid = document.getElementById('weekGrid');
            if (grid) grid.focus({ preventScroll: true });
        }
    }

    // ===== 編集中の入力データを回収 =====
    function collectCurrentEditData() {
        if (!STATE.weekData) return null;
        return STATE.weekData.days.map(function (day, dayIdx) {
            var newDay = JSON.parse(JSON.stringify(day));
            ['event', 'preclass', 'morning', 'recess1', 'recess2', 'afterschool', 'homework', 'items'].forEach(function (field) {
                var el = document.querySelector('[data-field="' + field + '"][data-day="' + dayIdx + '"]');
                if (el) newDay[field] = el.value;
            });
            for (var pIdx = 0; pIdx < 6; pIdx++) {
                var subject = document.querySelector('[data-field="subject"][data-day="' + dayIdx + '"][data-period="' + pIdx + '"]');
                var unit = document.querySelector('[data-field="unit"][data-day="' + dayIdx + '"][data-period="' + pIdx + '"]');
                var content = document.querySelector('[data-field="content"][data-day="' + dayIdx + '"][data-period="' + pIdx + '"]');
                if (subject) {
                    newDay.periods[pIdx] = {
                        subject: subject.value || '',
                        unit: unit ? unit.value || '' : '',
                        content: content ? content.value || '' : '',
                    };
                }
            }
            return newDay;
        });
    }

    // ===== 未保存チェック =====
    // 編集モードのセル操作（ペースト・クリア・入れ替え・自動入力）は STATE.weekData.days を
    // 書き換えるので、比較相手は「編集を始めた時のスナップショット」でなければならない。
    // days と比べると、それらの操作の結果が“変更なし”に見えて保存されずに消える。
    function hasUnsavedChanges() {
        if (!STATE.editMode || !STATE.weekData) return false;
        var current = collectCurrentEditData();
        var baseline = STATE.editBaseline || STATE.weekData.days;
        return JSON.stringify(current) !== JSON.stringify(baseline);
    }

    /**
     * いま画面に出ているデータが、どの週のものかを返します。**保存先はこれを使うこと。**
     *
     * STATE.mondayStr は「これから表示したい週」で、週移動（navigateWeek / jumpToDate /
     * jumpToWeek / jumpToSearchResult）が読み込みより先に書き換えます。移動先の週が
     * 届くまでのあいだ、画面には移動元の週が出たままです。
     *
     * この期間に保存すると、送り先だけ移動先の週になり、中身は移動元の週のまま届きます。
     * サーバは「その週に含まれない日付が送られました」と正しく弾くため、保存できません。
     * しかも編集モードでは、移動時の自動保存がこれで失敗して読み込みまで止まるため、
     * 画面は移動元の週のまま・STATE.mondayStr は移動先、という食い違いが残り、
     * 再読み込みするまで保存できなくなります（実際にこの不具合が起きました）。
     *
     * 画面に出ているデータの週は、そのデータ自身（サーバ応答の mondayDateStr）が持っています。
     * @returns {string} 表示中のデータが属する週の月曜日（取れなければ STATE.mondayStr）
     */
    function displayedWeekMondayStr() {
        if (STATE.weekData && STATE.weekData.mondayDateStr) return STATE.weekData.mondayDateStr;
        return STATE.mondayStr;
    }

    // ===== 保存系の状態変数 =====
    // autoSaveAndThen / saveWeeklyPlan は App_Js_14_MultiClass(V2)で定義され、
    // App_Js_15_DataProtection_Overrides(保護版)が最終実装になる。
    // persistViewMutation(閲覧モードでのD&D等の自動保存)も同様。
    // 以下の変数はそれらの実装から参照されるため、宣言はここに残す。
    var _autoSaving = false;
    var _viewSaveTimer = null;
    // ディレイ待ちの保存処理。週移動・学級切替・画面切替の直前に前倒しで送るために持つ。
    var _viewSaveRunner = null;
    // 閲覧モードのセル操作をまとめるための待ち時間。
    var VIEW_SAVE_DELAY_MS = 450;

    /**
     * 閲覧モードの自動保存を仕掛け直します（同時に1本だけ）。
     * 続けて操作したときは最後の1回にまとまります。
     */
    function scheduleViewSave(run) {
        clearTimeout(_viewSaveTimer);
        _viewSaveRunner = run;
        _viewSaveTimer = setTimeout(function () {
            _viewSaveRunner = null;
            run();
        }, VIEW_SAVE_DELAY_MS);
    }

    /**
     * 待たせてある自動保存を今すぐ送ります。
     * 週移動・学級切替・画面切替の前に必ず通すこと。サーバ側の保存先は
     * 「いまアクティブな学級シート」で決まるため、切替後に届いた保存は
     * 別の学級のシートへ書かれてしまう。
     */
    function flushPendingViewSave() {
        var run = _viewSaveRunner;
        if (!run) return;
        clearTimeout(_viewSaveTimer);
        _viewSaveRunner = null;
        run();
    }

    /** 閲覧モードの変更が、まだサーバへ届いていない状態か（離脱警告に使う）。 */
    function hasPendingViewSave() {
        if (_viewSaveRunner) return true;
        if (_saveInFlight) return true;
        for (var key in _viewSaveQueue) {
            if (Object.prototype.hasOwnProperty.call(_viewSaveQueue, key)) return true;
        }
        return false;
    }

    // ===== 手元の週データを書き換えた回数 =====
    // 保存はGASの往復に数秒かかることがある。その間に次のセル操作をすると、
    // 先に飛ばした保存の応答（＝保存した時点の内容）が後から返ってくる。
    // その内容で手元を上書きすると、応答を待つ間に行った操作がまとめて巻き戻り、
    // 「月・火・水と消したのに木曜を消した頃に火・水が復活する」という壊れ方をする。
    // 保存要求を出した時点の回数を控えておき、応答時に変わっていたら取り込まない。
    var _weekDaysMutationSeq = 0;

    /** セル操作などで STATE.weekData.days を書き換えたことを記録します。 */
    function markWeekDaysMutated() {
        _weekDaysMutationSeq++;
    }

    /** いまの書き換え回数。保存要求を出す側が控え、応答時に見比べます。 */
    function weekDaysMutationSeq() {
        return _weekDaysMutationSeq;
    }

    // ===== 閲覧モードの自動保存の待ち行列 =====
    // 進行中の保存があるあいだの保存要求は、週ごとに最新の1件だけ待たせる。
    // 待っている1件は実行時に最新の days を読み直して送るため、待機中に増えた変更も
    // まとめて保存される。要求ごとに待たせると、同じ内容の保存がセル操作の回数だけ
    // 積み上がり、GASのロック待ちで保存全体が遅くなる。
    var _viewSaveQueue = {};

    /**
     * 進行中の保存の完了後に、その週の保存を1回だけ実行します。
     * @param {string} key 週の識別子（月曜日の日付文字列）
     * @param {Function} run 実行する保存処理
     */
    function queueViewSave(key, run) {
        var alreadyQueued = Object.prototype.hasOwnProperty.call(_viewSaveQueue, key);
        _viewSaveQueue[key] = run;
        if (alreadyQueued) return;
        whenSaveIdle(function () {
            var fn = _viewSaveQueue[key];
            delete _viewSaveQueue[key];
            if (fn) fn();
        });
    }

    // ===== 保存要求の直列化 =====
    // 手動保存・画面切替の自動保存・閲覧モードの自動保存が同時に飛ぶと、
    // 後から届いた方は「保存前のリビジョン」を持ったままサーバへ届くため、
    // 実際には自分の保存が反映されただけなのに競合と判定されてしまう。
    // 保存は必ずこのゲートを通し、1件ずつ順番に実行する。
    var _saveInFlight = false;
    var _afterSaveQueue = [];

    /** 保存要求を開始できるなら true。既に別の保存が飛んでいるなら false。 */
    function beginSaveRequest() {
        if (_saveInFlight) return false;
        _saveInFlight = true;
        return true;
    }

    /**
     * 保存要求の完了を通知し、待たせていた処理を実行する。
     * 待機処理は必ず次のタスクで実行する。応答ハンドラの途中で呼ばれても、
     * リビジョン反映などハンドラ内の後続処理が終わってから動くようにするため。
     */
    function endSaveRequest() {
        _saveInFlight = false;
        if (!_afterSaveQueue.length) return;
        setTimeout(function () {
            var queued = _afterSaveQueue;
            _afterSaveQueue = [];
            queued.forEach(function (fn) {
                try { fn(); } catch (e) { /* 後続処理の失敗で他の待機処理を止めない */ }
            });
        }, 0);
    }

    /** 保存が飛んでいなければ即時、飛んでいれば完了後に実行する。 */
    function whenSaveIdle(fn) {
        if (!_saveInFlight) { fn(); return; }
        _afterSaveQueue.push(fn);
    }

    /** 保存中かどうか（進行中の保存があるあいだの二重送信抑止に使う）。 */
    function isSaveInFlight() {
        return _saveInFlight;
    }

    // ===== 保存結果の取り込み =====
    // サーバは「シートに実際に入った値」を days で返す。スプレッドシートが
    // 入力を解釈し直した場合（"007"→7 など）に手元の値がずれ続けないよう、
    // 保存成功時は返ってきた値で手元のデータを揃える。
    // @param {number} [mutationSeq] 保存要求を出した時点の weekDaysMutationSeq()。
    //   応答が返るまでに手元を書き換えていたら、サーバの返した「保存時点の内容」で
    //   上書きしない（応答待ちのあいだに行ったセル操作がまとめて巻き戻るのを防ぐ）。
    //   取り込まなかった分は、後続の保存が最新の内容を送り直すことで揃う。
    function adoptSavedWeekDays(result, fallbackDays, weekData, mutationSeq) {
        var target = weekData || STATE.weekData;
        if (!target) return false;
        // 保存が通った時点で「編集を始めた時の内容」は保存済みの内容に置き換わる。
        // ここで捨てておかないと、直後の cancelEdit() が保存前の状態へ巻き戻してしまう。
        if (target === STATE.weekData) STATE.editBaseline = null;
        var stale = (mutationSeq !== undefined && mutationSeq !== null
            && mutationSeq !== weekDaysMutationSeq());
        if (stale) return false;
        var saved = (result && result.days && result.days.length) ? result.days : fallbackDays;
        var normalized = JSON.stringify(saved) !== JSON.stringify(target.days);
        target.days = saved;
        return normalized;
    }

    /**
     * 現在の編集内容を1回だけ保存し、成否を Promise で返します。
     * 「保存してから実行する」系の操作（一括自動入力・コマ移動）の前処理で使い、
     * 他の保存と重ならないよう保存ゲートを通します。
     */
    function saveCurrentWeekOnce(source) {
        return new Promise(function (resolve) {
            var days = collectCurrentEditData();
            if (!days) { resolve(false); return; }
            var run = function () {
                if (!beginSaveRequest()) { whenSaveIdle(run); return; }
                google.script.run
                    .withSuccessHandler(function (result) {
                        endSaveRequest();
                        if (result.success) {
                            adoptSavedWeekDays(result, days);
                            STATE.weekData.revision = result.revision;
                            if (typeof p2UpdateCurrentWeekCache === 'function') p2UpdateCurrentWeekCache();
                            cancelEdit();
                            showToast('success', result.message);
                            resolve(true);
                        } else if (result.conflict) {
                            handleSaveConflict(result, days);
                            resolve(false);
                        } else {
                            showToast('error', '保存失敗: ' + result.error);
                            resolve(false);
                        }
                    })
                    .withFailureHandler(function (e) {
                        endSaveRequest();
                        showToast('error', '通信エラー: ' + e.message);
                        resolve(false);
                    })
                    .saveWeeklyPlanDataProtected(displayedWeekMondayStr(), days, STATE.weekData.revision, source, expectedClassSheetName());
            };
            whenSaveIdle(run);
        });
    }

    /** 2つの週データを比較し、「月(3校時・行事)」形式の差分ラベル配列を返す。 */
    function summarizeWeekDiff(daysA, daysB) {
        var labels = {
            event: '行事', preclass: '登校前', morning: '朝学習', recess1: '中休み',
            recess2: '昼休み', afterschool: '放課後', homework: '宿題', items: '持ち物'
        };
        var byDate = {};
        (daysA || []).forEach(function (d) { if (d && d.date) byDate[d.date] = d; });
        var result = [];
        (daysB || []).forEach(function (b) {
            if (!b || !b.date) return;
            var a = byDate[b.date] || {};
            var fields = [];
            Object.keys(labels).forEach(function (key) {
                if (String(a[key] || '') !== String(b[key] || '')) fields.push(labels[key]);
            });
            for (var n = 0; n < 6; n++) {
                var pa = (a.periods && a.periods[n]) || {};
                var pb = (b.periods && b.periods[n]) || {};
                if (String(pa.subject || '') !== String(pb.subject || '')
                    || String(pa.unit || '') !== String(pb.unit || '')
                    || String(pa.content || '') !== String(pb.content || '')) {
                    fields.push((n + 1) + '校時');
                }
            }
            if (fields.length) result.push((b.dayLabel || b.date) + '（' + fields.join('・') + '）');
        });
        return result;
    }

    // ===== 保存競合（楽観ロック）時の処理 =====
    // サーバは「他者の変更を実際に上書きしてしまう保存」だけを競合として返す。
    // どこが食い違っているのかを示し、読み込み直し・編集継続・上書き保存を選ばせる。
    // @param {Object} [result] サーバの応答（result.current にシートの現在値）
    // @param {Object[]} [attemptedDays] 保存しようとした内容
    // @param {Function} [overwrite] 上書き再保存（サーバの最新リビジョンを受け取る）
    function handleSaveConflict(result, attemptedDays, overwrite) {
        _autoSaving = false;
        var current = result && result.current;
        if (typeof Swal === 'undefined') {
            showToast('error', 'この週は他で更新されています。最新を読み込み直してください。');
            return;
        }
        var diff = (current && attemptedDays) ? summarizeWeekDiff(current.days, attemptedDays) : [];
        var diffHtml = diff.length
            ? '<div style="text-align:left;font-size:0.82rem;margin-top:8px;padding:8px;'
              + 'background:var(--surface-hover);border-radius:6px;max-height:160px;overflow-y:auto;">'
              + '<strong>今の内容と違うところ</strong><br>' + escHtml(diff.join(' / ')) + '</div>'
            : '';
        var canOverwrite = !!(current && current.revision && typeof overwrite === 'function');
        Swal.fire({
            icon: 'warning',
            title: '保存の競合',
            html: '<div style="text-align:left;font-size:0.88rem;">'
                + 'この週の内容が、編集を始めた時点から変わっています。'
                + '別のタブ・端末での保存や、自動入力などが原因のことがあります。'
                + '</div>' + diffHtml,
            showDenyButton: canOverwrite,
            denyButtonText: 'この内容で上書き',
            showCancelButton: true,
            confirmButtonText: '最新を読み込む',
            cancelButtonText: '編集を続ける',
            confirmButtonColor: '#ea4335',
            denyButtonColor: '#f9ab00'
        }).then(function (r) {
            if (r.isConfirmed) {
                STATE.editMode = false;
                updateEditUI();
                doLoadWeeklyPlan();
            } else if (r.isDenied && canOverwrite) {
                overwrite(current.revision);
            }
        });
    }

    // ================================================================
    // ===== UX 強化機能 (Phase A〜G) =====
    // ================================================================

    // ===== タッチ操作対応 =====
    // キーボードのないタブレットでも、ダブルタップで編集開始・長押しでメニュー表示が
    // できるようにする（PCではダブルクリック・右クリックとして同じ経路が動く）。

    /**
     * 選択中のセルで編集モードを開始し、対応する入力欄へフォーカスを移します。
     * キーボードの Enter と、ダブルタップ（ダブルクリック）から共用されます。
     */
    function startEditAtSelectedCell() {
        if (!STATE.selectedCell || STATE.editMode) return;
        toggleEditMode();
        // 選択セルの入力欄にフォーカス
        setTimeout(function () {
            var s = STATE.selectedCell;
            if (!s) return;
            var field = GRID_ROWS[s.row].multi ? 'subject' : GRID_ROWS[s.row].key;
            var sel = GRID_ROWS[s.row].multi
                ? '[data-field="subject"][data-day="' + s.day + '"][data-period="' + GRID_ROWS[s.row].key.replace('period', '') + '"]'
                : '[data-field="' + field + '"][data-day="' + s.day + '"]';
            var el = document.querySelector(sel);
            if (el) el.focus();
        }, 50);
    }

    // ダブルタップ判定用: 直前にタップしたセルと時刻
    var _lastCellTap = { day: -1, row: -1, time: 0 };
    var DOUBLE_TAP_MS = 400;

    /**
     * 校時セルに「タッチ長押しでコンテキストメニュー」を取り付けます。
     * タッチ端末には右クリックがないため、長押しをその代替にします
     * （Androidの標準長押し contextmenu とも共存。閲覧モード専用）。
     */
    var LONG_PRESS_MS = 550;
    function attachTouchLongPress(cell, dayIdx, rowIdx, key, pIdx) {
        var timer = null;
        var fired = false;
        var sx = 0, sy = 0;
        cell.addEventListener('touchstart', function (e) {
            if (STATE.editMode || e.touches.length !== 1) return;
            fired = false;
            var t = e.touches[0];
            sx = t.clientX; sy = t.clientY;
            var px = t.pageX, py = t.pageY;
            timer = setTimeout(function () {
                timer = null;
                fired = true;
                selectCell(dayIdx, rowIdx, key);
                showContextMenu({ pageX: px, pageY: py }, dayIdx, pIdx);
            }, LONG_PRESS_MS);
        }, { passive: true });
        cell.addEventListener('touchmove', function (e) {
            if (!timer) return;
            var t = e.touches[0];
            // スクロール操作と区別: 指が動いたら長押しをキャンセル
            if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) {
                clearTimeout(timer);
                timer = null;
            }
        }, { passive: true });
        cell.addEventListener('touchend', function (e) {
            if (timer) { clearTimeout(timer); timer = null; }
            if (fired) {
                // メニュー表示直後の指離しで発生するクリックがメニューを閉じないよう抑止
                e.preventDefault();
                fired = false;
            }
        });
        cell.addEventListener('touchcancel', function () {
            if (timer) { clearTimeout(timer); timer = null; }
            fired = false;
        });
    }

    // ===== 編集モードでもセル操作を使えるようにするための土台 =====
    // 編集モードでは「本当の値」は STATE.weekData.days ではなく画面の入力欄にある。
    // そのままセル操作（コピー / ペースト / クリア / 入れ替え / Undo）を走らせると、
    //   1) 古い値をコピーしてしまう
    //   2) 再描画で入力途中の内容が丸ごと消える
    //   3) 入力中だったカーソル位置が飛ぶ
    // という3つの壊れ方をする。以下の3つの関数がそれぞれを塞ぐ。

    /**
     * 編集中の入力欄の内容を STATE.weekData.days へ取り込みます（編集モード時のみ）。
     * セル操作は必ずこれを通してから days を読み書きすること。
     * @returns {boolean} 取り込んだら true
     */
    function syncEditBufferToState() {
        if (!STATE.editMode || !STATE.weekData) return false;
        var current = collectCurrentEditData();
        if (!current) return false;
        STATE.weekData.days = current;
        markWeekDaysMutated();
        return true;
    }

    /** いまフォーカスしているグリッド入力欄の位置とカーソル位置を控えます。 */
    function captureGridFocus() {
        var el = document.activeElement;
        if (!isGridInput(el)) return null;
        var snap = {
            field: el.getAttribute('data-field'),
            day: el.getAttribute('data-day'),
            period: el.getAttribute('data-period'),
            start: 0,
            end: 0
        };
        if (!snap.field || snap.day === null) return null;
        try {
            snap.start = el.selectionStart;
            snap.end = el.selectionEnd;
        } catch (e) { /* 選択位置を取れない入力型はカーソル復元をあきらめる */ }
        return snap;
    }

    /** captureGridFocus() で控えた入力欄へフォーカスとカーソル位置を戻します。 */
    function restoreGridFocus(snap) {
        if (!snap) return;
        var sel = '#weekGrid [data-field="' + snap.field + '"][data-day="' + snap.day + '"]';
        if (snap.period !== null && snap.period !== undefined) sel += '[data-period="' + snap.period + '"]';
        var el = document.querySelector(sel);
        if (!el) return;
        el.focus({ preventScroll: true });
        try {
            var len = (el.value || '').length;
            el.setSelectionRange(Math.min(snap.start, len), Math.min(snap.end, len));
        } catch (e) { /* カーソル復元は失敗しても操作自体は成立している */ }
    }

    /** セル操作の後の再描画。編集モードでは入力位置を保ったまま描き直します。 */
    function rerenderGridPreservingFocus() {
        if (!STATE.weekData || !STATE.weekData.days) return;
        var snap = STATE.editMode ? captureGridFocus() : null;
        renderWeekGrid(STATE.weekData.days);
        restoreGridFocus(snap);
    }

    /** グリッド内の入力欄（input / textarea）かどうか。 */
    function isGridInput(el) {
        if (!el) return false;
        var tag = (el.tagName || '').toLowerCase();
        if (tag !== 'input' && tag !== 'textarea') return false;
        var grid = document.getElementById('weekGrid');
        return !!(grid && grid.contains(el));
    }

    /** input / textarea の中で文字が選択されているか（＝標準のコピー等が意味を持つ状態か）。 */
    function hasTextSelection(el) {
        if (!el) return false;
        var tag = (el.tagName || '').toLowerCase();
        if (tag !== 'input' && tag !== 'textarea') return false;
        try {
            return el.selectionStart !== el.selectionEnd;
        } catch (e) { return false; }
    }

    /**
     * 要素が属するグリッドセルを選択状態にします（編集モードではフォーカスを奪わない）。
     * @returns {boolean} 選択できたら true
     */
    function selectCellFromElement(el, opts) {
        var cell = (el && el.closest) ? el.closest('.grid-cell') : null;
        if (!cell || cell.dataset.row === undefined) return false;
        var day = parseInt(cell.dataset.day, 10);
        var row = parseInt(cell.dataset.row, 10);
        if (isNaN(day) || isNaN(row)) return false;
        var s = STATE.selectedCell;
        if (s && s.day === day && s.row === row) return true;
        selectCell(day, row, cell.dataset.key, opts || { keepFocus: true });
        return true;
    }

    // 編集モード: 入力欄にフォーカスが入ったら、そのセルを選択状態にする。
    // これでコピー / ペースト / クリアの対象が、いま編集しているセルと必ず一致する。
    document.addEventListener('focusin', function (e) {
        if (!STATE.editMode) return;
        if (!isGridInput(e.target)) return;
        selectCellFromElement(e.target, { keepFocus: true });
    });

    /**
     * 編集モードで選択中のセルに「セル操作」ハンドル（⋮）を1つだけ表示します。
     * 編集モードでは右クリック＝文字メニュー・長押し＝文字選択が本来の役割なので、
     * タッチ端末からでもコピー / ペースト / クリアへ確実にたどり着ける入口を用意する。
     * 選択中の1セルにしか出ないため、編集画面が散らからない。
     */
    function updateCellActionHandle(cell) {
        var existing = document.getElementById('cellActionHandle');
        if (existing) existing.remove();
        if (!STATE.editMode || !cell) return;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.id = 'cellActionHandle';
        btn.className = 'cell-action-handle';
        btn.tabIndex = -1;
        btn.title = 'このセルの操作（コピー / ペースト / クリア）';
        btn.setAttribute('aria-label', 'このセルの操作');
        btn.textContent = '⋮';
        // 日課・宿題などの行はセル右上に既存ボタン（リンク挿入・タスク選択）が並ぶ。
        // その数だけ左へ寄せて重ならないようにする（ボタン1つあたり 14px のアイコン＋余白で約24px）。
        var offset = 1;
        if (cell.querySelector(':scope > .link-insert-btn')) offset += 24;
        if (cell.querySelector(':scope > .field-task-btn')) offset += 24;
        btn.style.right = offset + 'px';
        // 入力中のフォーカスとカーソル位置を奪わない
        btn.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
        btn.addEventListener('click', function (ev) {
            ev.preventDefault();
            ev.stopPropagation();
            openCellMenuForSelection(btn);
        });
        cell.appendChild(btn);
    }

    /** 再描画などで消えたハンドルを、選択中セルへ付け直します。 */
    function refreshCellActionHandle() {
        updateCellActionHandle(document.querySelector('.grid-cell.selected'));
    }

    /** 「セル操作」ハンドルの位置に、選択中セル向けのメニューを開きます。 */
    function openCellMenuForSelection(anchor) {
        var s = STATE.selectedCell;
        if (!s) return;
        var rowDef = GRID_ROWS[s.row];
        var pIdx = (rowDef && rowDef.multi) ? parseInt(rowDef.key.replace('period', '')) : null;
        var r = anchor.getBoundingClientRect();
        showContextMenu({
            pageX: r.left + window.pageXOffset,
            pageY: r.bottom + window.pageYOffset
        }, s.day, pIdx);
    }

    // ===== Phase B: セル選択 =====
    /**
     * セルを選択状態にします。
     * @param {Object} [opts] opts.keepFocus=true で現在のフォーカスを奪わない
     *   （編集モードでは入力欄にフォーカスが必要なため、グリッドへ移してはいけない）
     */
    function selectCell(day, row, key, opts) {
        // 以前の選択を解除
        var prev = document.querySelector('.grid-cell.selected');
        if (prev) prev.classList.remove('selected');
        STATE.selectedCell = { day: day, row: row, key: key };
        // 新しいセルをハイライト
        var cell = document.querySelector('.grid-cell[data-day="' + day + '"][data-row="' + row + '"]');
        if (cell) cell.classList.add('selected');
        updateCellActionHandle(cell);
        // グリッドにフォーカスを当ててキーボードショートカットを確実に有効化
        if (!(opts && opts.keepFocus)) {
            var grid = document.getElementById('weekGrid');
            if (grid) grid.focus({ preventScroll: true });
        }
    }

    function clearSelection() {
        var prev = document.querySelector('.grid-cell.selected');
        if (prev) prev.classList.remove('selected');
        updateCellActionHandle(null);
        STATE.selectedCell = null;
    }

    function moveSelection(dDay, dRow) {
        if (!STATE.selectedCell) {
            selectCell(0, 0, GRID_ROWS[0].key);
            return;
        }
        // 横移動は非表示の土日列をスキップする
        var newDay = STATE.selectedCell.day;
        if (dDay !== 0) {
            var step = dDay > 0 ? 1 : -1;
            var cand = newDay + step;
            while (cand >= 0 && cand <= 6 && !isDayVisible(cand)) cand += step;
            if (cand >= 0 && cand <= 6) newDay = cand;
        }
        var newRow = Math.max(0, Math.min(GRID_ROWS.length - 1, STATE.selectedCell.row + dRow));
        selectCell(newDay, newRow, GRID_ROWS[newRow].key);
    }

    // ===== Phase E: Undo / Redo =====
    // 履歴の中身は days 配列そのもの。別の週・別の学級へ移ったあとに使うと、
    // 表示中の週がまるごと別の週・学級の内容に置き換わってしまう。
    // （同じ週の別学級なら日付が一致するため、そのまま保存されて上書きにもなる）
    // そのため履歴には「どの学級のどの週のものか」を持たせ、食い違ったら捨てる。

    /** 表示中の週・学級を表すキー。履歴の有効範囲の判定に使う。 */
    function currentHistoryScope() {
        var sheet = (STATE.multiClass && STATE.multiClass.activeSheet)
            ? STATE.multiClass.activeSheet : 'default';
        var monday = (STATE.weekData && STATE.weekData.mondayDateStr)
            ? STATE.weekData.mondayDateStr : (STATE.mondayStr || '');
        return sheet + '::' + monday;
    }

    /**
     * 表示中の週・学級の履歴でなければ捨てます。
     * 履歴を積む・使う・メニューの有効無効を決める、すべての入口から通すこと。
     * 週の読み込み側で捨て忘れても、ここで必ず食い止められる。
     */
    function ensureHistoryScope() {
        var scope = currentHistoryScope();
        if (STATE.historyScope === scope) return;
        STATE.historyScope = scope;
        STATE.undoStack = [];
        STATE.redoStack = [];
    }

    // 履歴を積む前に必ず入力欄の内容を取り込む。編集モードで取り込まずに積むと、
    // 入力途中の内容が履歴に入らず、元に戻した瞬間に消えてしまう。
    // 注意: syncEditBufferToState() は days を新しい配列に差し替えるため、
    // 呼び出し側は pushUndo() の「後」に days から day オブジェクトを取り直すこと。
    function pushUndo() {
        if (!STATE.weekData || !STATE.weekData.days) return;
        ensureHistoryScope();
        syncEditBufferToState();
        STATE.undoStack.push(JSON.parse(JSON.stringify(STATE.weekData.days)));
        if (STATE.undoStack.length > 30) STATE.undoStack.shift();
        STATE.redoStack = [];
    }

    function undo() {
        ensureHistoryScope();
        if (STATE.undoStack.length === 0) { showToast('info', '元に戻せる操作がありません'); return; }
        syncEditBufferToState();
        STATE.redoStack.push(JSON.parse(JSON.stringify(STATE.weekData.days)));
        STATE.weekData.days = STATE.undoStack.pop();
        markWeekDaysMutated();
        rerenderGridPreservingFocus();
        showToast('info', '↩ 元に戻しました');
        persistViewMutation();
    }

    function redo() {
        ensureHistoryScope();
        if (STATE.redoStack.length === 0) { showToast('info', 'やり直す操作がありません'); return; }
        syncEditBufferToState();
        STATE.undoStack.push(JSON.parse(JSON.stringify(STATE.weekData.days)));
        STATE.weekData.days = STATE.redoStack.pop();
        markWeekDaysMutated();
        rerenderGridPreservingFocus();
        showToast('info', '↪ やり直しました');
        persistViewMutation();
    }

    // ===== Phase D: コピー＆ペースト =====
    function copyCellData() {
        if (!STATE.selectedCell || !STATE.weekData) return;
        // 編集モードでは入力欄の値が最新。取り込まないと1つ前の内容をコピーしてしまう
        syncEditBufferToState();
        var s = STATE.selectedCell;
        var day = STATE.weekData.days[s.day];
        if (!day) return;
        var rowDef = GRID_ROWS[s.row];
        var plainText = '';
        if (rowDef.multi) {
            var pIdx = parseInt(rowDef.key.replace('period', ''));
            var p = day.periods[pIdx] || {};
            STATE.clipboard = { type: 'period', data: JSON.parse(JSON.stringify(p)) };
            plainText = [p.subject, p.unit, p.content].filter(Boolean).join('\n');
        } else {
            STATE.clipboard = { type: 'text', key: rowDef.key, data: day[rowDef.key] || '' };
            plainText = day[rowDef.key] || '';
        }
        // システムクリップボードにもプレーンテキストとして書き込む。
        // 同じ文字列が貼り付けられた時に「セルごとのペースト」と判定するため控えておく。
        STATE.clipboardText = plainText;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(plainText).catch(function () { });
        }
        showToast('info', rowDef.multi ? '📋 コマをコピーしました' : '📋 コピーしました');
    }

    /**
     * コピーしたセルを、選択中のセルへ貼り付けます。
     * @param {Object} [opts] opts.silent=true で、種類違いのときにエラーを出さず false を返す
     *   （Ctrl+V の自動判定から呼ぶとき、通常の文字貼り付けへ静かに引き返すため）
     * @returns {boolean} 貼り付けたら true
     */
    function pasteCellData(opts) {
        if (!STATE.clipboard || !STATE.selectedCell || !STATE.weekData) return false;
        var s = STATE.selectedCell;
        var rowDef = GRID_ROWS[s.row];
        var asPeriod = (STATE.clipboard.type === 'period' && rowDef.multi);
        var asText = (STATE.clipboard.type === 'text' && !rowDef.multi);
        if (!asPeriod && !asText) {
            if (!(opts && opts.silent)) showToast('error', '異なる種類のセルにはペーストできません');
            return false;
        }
        // pushUndo() が入力欄の内容を取り込み、days を差し替える。day はその後に取り直す
        pushUndo();
        var day = STATE.weekData.days[s.day];
        if (!day) return false;
        if (asPeriod) {
            var pIdx = parseInt(rowDef.key.replace('period', ''));
            day.periods[pIdx] = JSON.parse(JSON.stringify(STATE.clipboard.data));
        } else {
            day[rowDef.key] = STATE.clipboard.data;
        }
        markWeekDaysMutated();
        rerenderGridPreservingFocus();
        showToast('success', asPeriod ? '📋 コマをペーストしました' : '📋 ペーストしました');
        persistViewMutation();
        return true;
    }

    // ===== Phase B: セルクリア =====
    function clearCellData() {
        if (!STATE.selectedCell || !STATE.weekData) return;
        var s = STATE.selectedCell;
        var rowDef = GRID_ROWS[s.row];
        pushUndo();
        var day = STATE.weekData.days[s.day];
        if (!day) return;
        if (rowDef.multi) {
            var pIdx = parseInt(rowDef.key.replace('period', ''));
            day.periods[pIdx] = { subject: '', unit: '', content: '' };
        } else {
            day[rowDef.key] = '';
        }
        markWeekDaysMutated();
        rerenderGridPreservingFocus();
        showToast('info', '🗑 クリアしました');
        persistViewMutation();
    }

    // ===== Phase C: ドラッグ＆ドロップ =====
    function handleDragStart(e) {
        var cell = e.target.closest('.grid-cell');
        if (!cell) return;
        var day = parseInt(cell.dataset.day);
        var period = parseInt(cell.dataset.period);
        STATE.dragSource = { day: day, period: period };
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', day + ',' + period);
        setTimeout(function () { cell.classList.add('dragging'); }, 0);
    }

    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
    }

    function handleDragEnter(e) {
        var cell = e.target.closest('.grid-cell');
        if (cell && cell.dataset.period !== undefined) {
            cell.classList.add('drag-over');
        }
    }

    function handleDragLeave(e) {
        var cell = e.target.closest('.grid-cell');
        if (cell) cell.classList.remove('drag-over');
    }

    function handleDrop(e) {
        e.preventDefault();
        var cell = e.target.closest('.grid-cell');
        if (!cell || !STATE.dragSource || cell.dataset.period === undefined) return;
        cell.classList.remove('drag-over');

        var srcDay = STATE.dragSource.day;
        var srcPeriod = STATE.dragSource.period;
        var dstDay = parseInt(cell.dataset.day);
        var dstPeriod = parseInt(cell.dataset.period);

        if (srcDay === dstDay && srcPeriod === dstPeriod) return;

        // pushUndo() の中で編集中の入力データを取り込む
        pushUndo();

        // スワップ
        var src = STATE.weekData.days[srcDay].periods[srcPeriod];
        var dst = STATE.weekData.days[dstDay].periods[dstPeriod];
        STATE.weekData.days[srcDay].periods[srcPeriod] = dst || { subject: '', unit: '', content: '' };
        STATE.weekData.days[dstDay].periods[dstPeriod] = src || { subject: '', unit: '', content: '' };

        markWeekDaysMutated();
        rerenderGridPreservingFocus();
        showToast('success', '🔄 コマを入れ替えました');
        persistViewMutation();
    }

    function handleDragEnd(e) {
        STATE.dragSource = null;
        document.querySelectorAll('.grid-cell.dragging, .grid-cell.drag-over').forEach(function (el) {
            el.classList.remove('dragging', 'drag-over');
        });
    }

    // ===== Phase F: 右クリックコンテキストメニュー =====
    /** コンテキストメニューの1項目を組み立てます。icon が英字ならアイコンフォント、それ以外は文字をそのまま使う。 */
    function ctxItem(action, icon, label, disabled) {
        var iconClass = /^[a-z0-9_]+$/.test(icon) ? 'ctx-icon material-symbols-outlined' : 'ctx-icon';
        return '<div class="ctx-item' + (disabled ? ' disabled' : '') + '" data-action="' + action + '"'
            + (disabled ? ' aria-disabled="true"' : '') + '>'
            + '<span class="' + iconClass + '">' + icon + '</span>' + escHtml(label) + '</div>';
    }

    /**
     * セルのコンテキストメニューを表示します。
     * 閲覧モード・編集モードのどちらからでも同じ操作を出す（編集モードでは
     * 右クリックのほか、選択中セルの「⋮」ハンドルからも開ける）。
     * @param {number|null} pIdx 校時セルなら校時番号、それ以外の行なら null
     */
    function showContextMenu(e, dayIdx, pIdx) {
        hideContextMenu();
        // 別の週・学級から持ち越した履歴は、ここで捨ててから有効無効を決める
        ensureHistoryScope();
        var isPeriod = (pIdx !== null && pIdx !== undefined && !isNaN(pIdx));
        var menu = document.createElement('div');
        menu.className = 'context-menu';
        menu.id = 'uxContextMenu';
        var items = [
            ctxItem('copy', 'content_copy', isPeriod ? 'コマをコピー' : 'コピー', false),
            ctxItem('paste', 'content_paste', isPeriod ? 'コマをペースト' : 'ペースト', !STATE.clipboard),
            '<div class="ctx-sep"></div>',
            ctxItem('clear', 'delete', isPeriod ? 'このコマをクリア' : 'このセルをクリア', false)
        ];
        if (isPeriod) {
            items.push(ctxItem('clearDay', 'delete_sweep', 'この日の全コマをクリア', false));
            items.push(ctxItem('clearPeriod', 'playlist_remove', 'この校時を全曜日クリア', false));
        }
        // 編集モードでは Ctrl+Z が入力欄の文字取り消しに使われるため、
        // セル操作のやり直しはここから行えるようにしておく。
        items.push('<div class="ctx-sep"></div>');
        items.push(ctxItem('undo', '↩', '元に戻す', STATE.undoStack.length === 0));
        items.push(ctxItem('redo', '↪', 'やり直す', STATE.redoStack.length === 0));
        menu.innerHTML = items.join('');
        document.body.appendChild(menu);

        // 位置調整
        var x = e.pageX, y = e.pageY;
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
        // 画面はみ出し防止
        requestAnimationFrame(function () {
            var r = menu.getBoundingClientRect();
            if (r.right > window.innerWidth) menu.style.left = (x - r.width) + 'px';
            if (r.bottom > window.innerHeight) menu.style.top = (y - r.height) + 'px';
        });

        menu.addEventListener('click', function (ev) {
            var item = ev.target.closest('.ctx-item');
            if (!item || item.classList.contains('disabled')) return;
            var action = item.dataset.action;
            handleContextAction(action, dayIdx, pIdx);
            hideContextMenu();
        });

        // 外クリックで閉じる
        setTimeout(function () {
            document.addEventListener('click', hideContextMenu, { once: true });
        }, 10);
    }

    function hideContextMenu() {
        var m = document.getElementById('uxContextMenu');
        if (m) m.remove();
    }

    function handleContextAction(action, dayIdx, pIdx) {
        if (!STATE.weekData || !STATE.weekData.days) return;
        var isPeriod = (pIdx !== null && pIdx !== undefined && !isNaN(pIdx));
        switch (action) {
            case 'copy':
                copyCellData();
                break;
            case 'paste':
                pasteCellData();
                break;
            case 'clear':
                clearCellData();
                break;
            case 'undo':
                undo();
                break;
            case 'redo':
                redo();
                break;
            case 'clearDay':
                if (!isPeriod) break;
                // pushUndo() が編集中の入力欄を取り込んでから履歴を積む
                pushUndo();
                for (var p = 0; p < 6; p++) {
                    STATE.weekData.days[dayIdx].periods[p] = { subject: '', unit: '', content: '' };
                }
                markWeekDaysMutated();
                rerenderGridPreservingFocus();
                showToast('info', '🗑 ' + DAY_LABELS_JP[dayIdx] + '曜の全コマをクリアしました');
                persistViewMutation();
                break;
            case 'clearPeriod':
                if (!isPeriod) break;
                pushUndo();
                for (var d = 0; d < 7; d++) {
                    STATE.weekData.days[d].periods[pIdx] = { subject: '', unit: '', content: '' };
                }
                markWeekDaysMutated();
                rerenderGridPreservingFocus();
                showToast('info', '🗑 ' + (pIdx + 1) + '校時を全曜日クリアしました');
                persistViewMutation();
                break;
        }
    }

    // ===== Phase A: グローバルキーボードショートカット =====
    document.addEventListener('keydown', function handleGlobalKeydown(e) {
        // 週案ビュー以外では無視
        if (STATE.view !== 'plan') return;

        var tag = (e.target.tagName || '').toLowerCase();
        var isInput = (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable);

        // Ctrl+S: 保存
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
