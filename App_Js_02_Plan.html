            if (STATE.editMode) saveWeeklyPlan();
            return;
        }

        // Ctrl+Z: Undo（入力欄フォーカス中はブラウザ標準のテキストUndoを優先し、
        // 未保存の入力がグリッド再描画で失われるのを防ぐ）
        if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey && !isInput) {
            e.preventDefault();
            undo();
            return;
        }

        // Ctrl+Shift+Z / Ctrl+Y: Redo
        if ((e.ctrlKey || e.metaKey) && (e.key === 'Z' || e.key === 'y') && !isInput) {
            e.preventDefault();
            redo();
            return;
        }

        // Ctrl+P: 印刷
        if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
            e.preventDefault();
            printWeeklyPlan();
            return;
        }

        // Ctrl+C: セル（コマ）のコピー。
        // 編集モードでは入力欄にフォーカスがあるが、文字を選択していなければ標準のコピーは
        // 何も起こらない。その空振りをコマのコピーに充てることで、閲覧モードと同じキーが
        // そのまま使える。文字を選択している時はブラウザ標準のコピーを邪魔しない。
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'c' || e.key === 'C')) {
            if (!isInput) {
                e.preventDefault();
                copyCellData();
                return;
            }
            if (isGridInput(e.target) && !hasTextSelection(e.target)) {
                e.preventDefault();
                selectCellFromElement(e.target, { keepFocus: true });
                copyCellData();
                return;
            }
        }

        // Ctrl+V: ペースト。
        // 編集モードの入力欄内での Ctrl+V は paste イベント側で処理する
        // （貼り付ける文字がコピーしたコマと同じならセルごと、違えば通常の文字貼り付け）。
        if ((e.ctrlKey || e.metaKey) && e.key === 'v' && !isInput) {
            e.preventDefault();
            pasteCellData();
            return;
        }

        // Ctrl+←/→: 前週/翌週
        if ((e.ctrlKey || e.metaKey) && e.key === 'ArrowLeft') {
            e.preventDefault();
            navigateWeek(-1);
            return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'ArrowRight') {
            e.preventDefault();
            navigateWeek(1);
            return;
        }

        // input/textarea にフォーカスがある場合、以下は無視
        if (isInput) {
            // Tab / Shift+Tab: セル間フォーカス移動（編集モード中）
            if (e.key === 'Tab' && STATE.editMode) {
                e.preventDefault();
                var inputs = Array.from(document.querySelectorAll('#weekGrid input, #weekGrid textarea'));
                var idx = inputs.indexOf(e.target);
                if (idx < 0) return;
                var next = e.shiftKey ? idx - 1 : idx + 1;
                if (next >= 0 && next < inputs.length) inputs[next].focus();
            }
            // Escape: 入力欄のblur
            if (e.key === 'Escape') {
                e.target.blur();
            }
            return;
        }

        // 以下は input/textarea 非フォーカス時のみ

        // E: 編集モード切替
        if (e.key === 'e' || e.key === 'E') {
            e.preventDefault();
            toggleEditMode();
            return;
        }

        // Escape: 編集キャンセル or ヘルプ閉じ
        if (e.key === 'Escape') {
            if (STATE.editMode) { cancelEdit(); return; }
            hideContextMenu();
            return;
        }

        // ?: ショートカットヘルプ
        if (e.key === '?') {
            e.preventDefault();
            showShortcutHelp();
            return;
        }

        // 矢印キー: セル移動（閲覧モード）
        if (!STATE.editMode) {
            switch (e.key) {
                case 'ArrowUp': e.preventDefault(); moveSelection(0, -1); return;
                case 'ArrowDown': e.preventDefault(); moveSelection(0, 1); return;
                case 'ArrowLeft': e.preventDefault(); moveSelection(-1, 0); return;
                case 'ArrowRight': e.preventDefault(); moveSelection(1, 0); return;
            }
        }

        // Enter: インライン編集（セル選択時）
        if (e.key === 'Enter' && STATE.selectedCell && !STATE.editMode) {
            e.preventDefault();
            startEditAtSelectedCell();
            return;
        }

        // Delete / Backspace: セルクリア（閲覧モード＋セル選択時）
        if ((e.key === 'Delete' || e.key === 'Backspace') && STATE.selectedCell && !STATE.editMode) {
            e.preventDefault();
            clearCellData();
            return;
        }
    });

    // ===== Phase G: ショートカットヘルプモーダル =====
    function showShortcutHelp() {
        Swal.fire({
            title: '⌨ キーボードショートカット',

    /**
     * 貼り付けようとしている文字が「直前にコピーしたセルの中身そのもの」かどうか。
     * コピー時に控えた文字列と一致する時だけ true にすることで、
     * 他のアプリからコピーした文字の貼り付け（通常の文字入力）を巻き込まない。
     */
    function isCellClipboardText(text) {
        if (!STATE.clipboard) return false;
        if (!STATE.clipboardText) return false;
        return text === STATE.clipboardText;
    }

    // weekGrid内のinput/textareaへのペースト処理。
    //  1) コピーしたコマをそのまま貼る場合は、セルごと（教科・単元名・学習内容）を差し替える
    //  2) それ以外は HTML を除去してプレーンテキストだけをカーソル位置に挿入する
    document.addEventListener('paste', function (e) {
        var grid = document.getElementById('weekGrid');
        if (!grid || !grid.contains(e.target)) return;
        var tag = (e.target.tagName || '').toLowerCase();
        if (tag !== 'input' && tag !== 'textarea') return;
        e.preventDefault();
        var text = (e.clipboardData || window.clipboardData).getData('text/plain') || '';

        // コピーしたセルをそのまま貼る時は、セル単位のペーストに切り替える。
        // 種類の合わないセル（例: コマ→宿題）へは静かに文字の貼り付けへ引き返す。
        if (isCellClipboardText(text)) {
            selectCellFromElement(e.target, { keepFocus: true });
            if (pasteCellData({ silent: true })) return;
        }

        // カーソル位置にプレーンテキストを挿入
        var el = e.target;
        var start = el.selectionStart;
        var end = el.selectionEnd;
        var before = el.value.substring(0, start);
        var after = el.value.substring(end);
        el.value = before + text + after;
        el.selectionStart = el.selectionEnd = start + text.length;
        // input イベントを発火（サジェスト等の連動用）
        el.dispatchEvent(new Event('input', { bubbles: true }));
    });

    // モーダル用: 候補となる教科名を収集（単元マスタ + 表示中の週）
    // 表記ゆれ（図工/図画工作）は正規化名に統一して重複候補を避ける
    function collectShiftSubjects() {
        var set = {};
        try {
            if (STATE.masterData && Array.isArray(STATE.masterData.subjects)) {
                STATE.masterData.subjects.forEach(function (s) { if (s) set[normalizeSubjectName(s)] = true; });
            }
        } catch (e) {}
        try {
            ((STATE.weekData && STATE.weekData.days) || []).forEach(function (day) {
                (day.periods || []).forEach(function (p) {
                    if (p && p.subject && String(p.subject).trim() && String(p.subject).indexOf('行事') === -1) {
                        set[normalizeSubjectName(p.subject)] = true;
                    }
                });
            });
        } catch (e) {}
        return Object.keys(set).sort();
    }

    // "yyyy/MM/dd" 形式の文字列を <input type="date"> 用の "yyyy-MM-dd" に変換
    function toDateInputValue(dateStrSlash) {
        if (!dateStrSlash) return '';
        return String(dateStrSlash).replace(/\//g, '-');
    }

                    loadWeeklyPlan(); // 現在の週をリロード
                } else {
                    showToast('error', 'ずらし処理エラー: ' + (result ? result.error : '不明なエラー'));
                }
            })
            .withFailureHandler(function (e) {
                if (btn) { btn.disabled = false; btn.innerHTML = '<span class="material-symbols-outlined fs-6">move_down</span> 単元をずらす'; }
                showToast('error', '通信エラー: ' + (e && e.message ? e.message : e));
            })
            .shiftSubjectLessons(params.subject, params.start, params.end, params.direction, params.count, { renumber: params.renumber });
    }

</script>
