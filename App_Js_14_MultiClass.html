<script>
    'use strict';

    // ===================================================
    // ===== 複数学級モード（専科教員向け） =====
    // モード無効時（デフォルト）はUIに一切表示されず、既存動作に影響しません。
    // ===================================================

    STATE.multiClass = { enabled: false, activeSheet: '', classes: [] };

    function loadMultiClassState() {
        google.script.run
            .withSuccessHandler(function (res) {
                if (!res || !res.success) return;
                applyMultiClassState(res);
            })
            .withFailureHandler(function () { })
            .getMultiClassSettings();
    }

    function applyMultiClassState(res) {
        STATE.multiClass = {
            enabled: !!res.enabled,
            activeSheet: res.activeSheet || '',
            classes: res.classes || []
        };
        renderClassSwitcher();
        renderMultiClassSettingsUI();
    }

    function renderClassSwitcher() {
        var select = document.getElementById('classSwitcher');
        if (!select) return;
        var mc = STATE.multiClass;
        if (!mc.enabled || mc.classes.length === 0) {
            select.style.display = 'none';
            return;
        }
        select.innerHTML = '';
        mc.classes.forEach(function (c) {
            var opt = document.createElement('option');
            opt.value = c.sheetName;
            opt.textContent = c.name + '（' + c.grade + '年）';
            select.appendChild(opt);
        });
        select.value = mc.activeSheet;
        select.style.display = 'inline-block';
    }

    function renderMultiClassSettingsUI() {
        var checkbox = document.getElementById('sysMultiClassEnabled');
        var manager = document.getElementById('multiClassManager');
        var listEl = document.getElementById('multiClassList');
        if (!checkbox || !manager || !listEl) return;

        var mc = STATE.multiClass;
        checkbox.checked = mc.enabled;
        manager.style.display = mc.enabled ? 'block' : 'none';
        if (!mc.enabled) return;

        var html = '';
        mc.classes.forEach(function (c) {
            var isActive = c.sheetName === mc.activeSheet;
            html += '<div class="mc-class-row' + (isActive ? ' active' : '') + '">'
                + '<span class="mc-class-name">' + escHtml(c.name) + '</span>'
                + '<span class="mc-class-grade">' + escHtml(String(c.grade)) + '年生</span>'
                + '<span class="mc-class-sheet">シート: ' + escHtml(c.sheetName) + '</span>'
                + (isActive ? '<span class="mc-active-badge">表示中</span>' : '')
                + '<span class="mc-row-actions">'
                + (!isActive
                    ? '<button class="btn btn-outline btn-sm" onclick="switchMultiClass(\'' + escAttr(c.sheetName) + '\')">この学級を表示</button>'
                    : '')
                + '<button class="btn btn-outline btn-sm" onclick="renameMultiClass(\'' + escAttr(c.sheetName) + '\', \'' + escAttr(c.name) + '\')">名前変更</button>'
                + (!c.isDefault
                    ? '<button class="btn btn-outline btn-sm" style="color:var(--danger-text);border-color:var(--danger-text);" '
                    + 'onclick="deleteMultiClass(\'' + escAttr(c.sheetName) + '\', \'' + escAttr(c.name) + '\')">削除</button>'
                    : '')
                + '</span></div>';
        });
        listEl.innerHTML = html;
    }

    function afterClassContextChanged() {
        STATE.weekData = null;
        // 学級が変われば、前の学級のセル操作履歴は使えない（同じ週なら日付が一致するため、
        // 「元に戻す」でそのまま別学級の内容を書き込んでしまう）
        STATE.undoStack = [];
        STATE.redoStack = [];
        STATE.historyScope = null;
        STATE.hoursSummaryData = null;
        STATE.stdHoursLoaded = false;
        STATE.isSystemSettingsLoaded = false;
        p2InvalidateWeekCache();

        if (STATE.mondayStr) loadWeeklyPlan();
        else goToToday();
        if (STATE.view === 'hours') {
            loadAnnualHoursView();
            if (STATE.mondayStr) loadHoursSummary();
        }
        if (STATE.view === 'settings') {
            loadStandardHours();
            loadSystemSettings();
        }
        refreshReflectionBadge();
    }

    function onClassSwitcherChange(sheetName) {
        if (!sheetName || sheetName === STATE.multiClass.activeSheet) return;
        // 自動保存の失敗・競合で切替が中断された場合に、セレクトだけが
        // 新しい学級を指したままにならないよう、先に現在の学級へ表示を戻す。
        // 切替成功時は applyMultiClassState が改めて再描画する。
        renderClassSwitcher();
        autoSaveAndThen(function () { switchMultiClass(sheetName); });
    }

    function switchMultiClass(sheetName) {
        showToast('info', '学級を切り替えています...');
        google.script.run
            .withSuccessHandler(function (res) {
                if (!res.success) {
                    showToast('error', '切り替え失敗: ' + res.error);
                    renderClassSwitcher();
                    return;
                }
                applyMultiClassState(res);
                afterClassContextChanged();
                var cls = res.classes.filter(function (c) { return c.sheetName === res.activeSheet; })[0];
                showToast('success', (cls ? '「' + cls.name + '」' : '学級') + 'に切り替えました');
            })
            .withFailureHandler(function (e) {
                showToast('error', '通信エラー: ' + e.message);
                renderClassSwitcher();
            })
            .switchActiveClassFromWeb(sheetName);
    }

    async function toggleMultiClassMode(checkbox) {
        var enable = checkbox.checked;
        var res = await Swal.fire({
            icon: 'question',
            title: enable ? '複数学級モードを有効にしますか？' : '複数学級モードを無効にしますか？',
            html: enable
                ? '<div style="text-align:left;font-size:0.85rem;line-height:1.6;">現在の「データベース」シートが1つ目の学級として登録され、画面左上に学級切替メニューが表示されます。<br>学級はこの下の「学級を追加」からいつでも増やせます。</div>'
                : '<div style="text-align:left;font-size:0.85rem;line-height:1.6;">既定の「データベース」シートの表示に戻ります。<br>追加した学級のシートとデータは削除されず、再度有効にすればそのまま使えます。</div>',
            showCancelButton: true,
            confirmButtonText: enable ? '有効にする' : '無効にする',
            cancelButtonText: 'キャンセル',
            confirmButtonColor: '#1a73e8'
        });
        if (!res.isConfirmed) {
            checkbox.checked = !enable;
            return;
        }

        autoSaveAndThen(function () {
            showToast('info', enable ? '複数学級モードを有効にしています...' : '複数学級モードを無効にしています...');
            google.script.run
                .withSuccessHandler(function (r) {
                    if (!r.success) {
                        showToast('error', 'エラー: ' + r.error);
                        checkbox.checked = !enable;
                        return;
                    }
                    applyMultiClassState(r);
                    afterClassContextChanged();
                    showToast('success', enable ? '複数学級モードを有効にしました' : '複数学級モードを無効にしました');
                })
                .withFailureHandler(function (e) {
                    showToast('error', '通信エラー: ' + e.message);
                    checkbox.checked = !enable;
                })
                .setMultiClassEnabledFromWeb(enable);
        });
    }

    function addMultiClass() {
        var nameInput = document.getElementById('mcNewClassName');
        var gradeSelect = document.getElementById('mcNewClassGrade');
        var name = (nameInput.value || '').trim();
        if (!name) { showToast('error', '学級名を入力してください'); return; }

        showToast('info', '学級「' + name + '」を作成しています...（数秒かかります）');
        google.script.run
            .withSuccessHandler(function (res) {
                if (!res.success) { showToast('error', '追加失敗: ' + res.error); return; }
                nameInput.value = '';
                applyMultiClassState(res);
                showToast('success', '学級「' + name + '」を追加しました。切替メニューから表示できます');
            })
            .withFailureHandler(function (e) { showToast('error', '通信エラー: ' + e.message); })
            .addClassFromWeb(name, gradeSelect.value);
    }

    // deleteMultiClass はデータ保護モジュール(App_Js_15_DataProtection_Overrides)が定義する。
    // 削除の直前に完全バックアップを自動作成する。

    async function renameMultiClass(sheetName, currentName) {
        var res = await Swal.fire({
            title: '学級名の変更',
            input: 'text',
            inputValue: currentName,
            inputAttributes: { maxlength: 30 },
            showCancelButton: true,
            confirmButtonText: '変更する',
            cancelButtonText: 'キャンセル',
            confirmButtonColor: '#1a73e8',
            inputValidator: function (v) { if (!v || !v.trim()) return '学級名を入力してください'; }
        });
        if (!res.isConfirmed) return;

        google.script.run
            .withSuccessHandler(function (r) {
                if (!r.success) { showToast('error', '変更失敗: ' + r.error); return; }
                applyMultiClassState(r);
                showToast('success', '学級名を変更しました');
            })
            .withFailureHandler(function (e) { showToast('error', '通信エラー: ' + e.message); })
            .renameClassFromWeb(sheetName, res.value.trim());
    }
</script>

<script>
    'use strict';

    // ===================================================
    // ===== Phase 2: 起動・通信・表示性能レイヤー =====
    // ===================================================

    STATE.performance = {
        bootstrapStartedAt: 0,
        weekRequestSeq: 0,
        weekCache: {},
        masterLoading: false,
        deferredLoaded: false
    };

    /**
     * サーバが返した所要時間を開発者コンソールへ出します。画面には出しません。
     *
     * GAS の待ち時間は「Sheets API を何回叩いたか」でほぼ決まりますが、
     * それが本当に時間を食っているのかは実環境でしか分かりません。
     * fetches / fetchMs が API の往復、elapsedMs との差が GAS 側の処理時間です。
     * 体感との差はさらに、google.script.run の往復とスクリプトの読み込みになります。
     * @param {string} label どの操作か
     * @param {Object} result サーバの応答
     */
    function p2LogTiming(label, result) {
        var p = result && result.performance;
        if (!p || typeof console === 'undefined' || !console.log) return;
        console.log('[週案エディタ] ' + label
            + ': 全体 ' + p.elapsedMs + 'ms'
            + ' / Sheets API ' + (p.fetches || 0) + '回 ' + (p.fetchMs || 0) + 'ms'
            + ' / それ以外 ' + Math.max(0, (p.elapsedMs || 0) - (p.fetchMs || 0)) + 'ms');
    }

    function p2RunIdle(callback, delay) {
        var invoke = function () {
            if (typeof window.requestIdleCallback === 'function') {
                window.requestIdleCallback(callback, { timeout: 1800 });
            } else {
                setTimeout(callback, 0);
            }
        };
        setTimeout(invoke, delay || 0);
    }

    function p2WeekCacheKey(mondayStr) {
        var activeSheet = STATE.multiClass && STATE.multiClass.activeSheet ? STATE.multiClass.activeSheet : 'default';
        return activeSheet + '::' + mondayStr;
    }

    /**
     * いま表示している学級のシート名（複数学級モードが無効なら空文字）。
     * 保存要求に添えてサーバ側で照合し、学級を切り替えた直後に届いた保存が
     * 別の学級のシートへ書き込まれるのを防ぎます。
     */
    function expectedClassSheetName() {
        if (!STATE.multiClass || !STATE.multiClass.enabled) return '';
        return STATE.multiClass.activeSheet || '';
    }

    function p2CacheWeek(data) {
        if (!data || !data.success || !data.mondayDateStr) return;
        STATE.performance.weekCache[p2WeekCacheKey(data.mondayDateStr)] = {
            data: JSON.parse(JSON.stringify(data)),
            savedAt: Date.now()
        };
    }

    function p2GetCachedWeek(mondayStr) {
        var entry = STATE.performance.weekCache[p2WeekCacheKey(mondayStr)];
        if (!entry) return null;
        if (Date.now() - entry.savedAt > 5 * 60 * 1000) {
            delete STATE.performance.weekCache[p2WeekCacheKey(mondayStr)];
            return null;
        }
        return JSON.parse(JSON.stringify(entry.data));
    }

    /**
     * 読み込んだ週データを画面へ反映します。
     * @param {Object} [opts] opts.force=true で、編集中の未保存入力があっても置き換える
     *   （固定時間割の転記・復元・DBクリアのように、サーバ側を書き換えた直後の読み直し用）
     */
    function p2ApplyWeekData(data, opts) {
        if (!data || !data.success) return false;
        var force = !!(opts && opts.force);

        // 閲覧モードのセル操作（コマの移動・クリア・ペースト・元に戻す）は、保存が
        // サーバへ届くまで手元の STATE.weekData.days にしか無い。表示中の週について
        // その変更が未確定のあいだは、読み込み結果を当ててはいけない。
        // キャッシュ表示 → 数秒後にサーバ応答、という二段階で描くため、
        // 「週を開いてすぐコマを動かす」だけでこの重なりが起きる。当ててしまうと
        // 動かしたコマが消えるうえ、手元のリビジョンが保存前へ巻き戻り、
        // 以降の保存が毎回「保存の競合」で弾かれるようになる。
        // 未確定の変更は、進行中の保存が通った時点で解消される。
        if (!force && data.mondayDateStr
            && typeof hasDirtyViewWeek === 'function'
            && typeof displayedWeekMondayStr === 'function'
            && displayedWeekMondayStr() === data.mondayDateStr
            && hasDirtyViewWeek(p2WeekCacheKey(data.mondayDateStr))) {
            // キャッシュも書き換えない。保存前の内容で上書きすると、次にこの週を
            // 開いたときに変更が消えた状態が描かれてしまう。
            return true;
        }

        // キャッシュは常に最新にしておく。画面へ反映しない場合でも、次にこの週を
        // 開いたときに古い内容が出ないようにするため。
        p2CacheWeek(data);

        // 編集中の未保存入力を、あとから届いた読み込み結果で消さない。
        // キャッシュ表示 → 数秒後にサーバ応答、という二段階で描くため、
        // その間に編集を始めていると入力が丸ごと消えてしまう。
        if (!force && STATE.editMode && hasUnsavedChanges()) return true;

        STATE.weekData = data;
        // 別の週・学級を表示したら、セル操作の履歴は引き継がない
        if (typeof ensureHistoryScope === 'function') ensureHistoryScope();
        renderWeekGrid(data.days);
        updateWeekHeader(data.days, data.weekNum);
        renderWeeklyTaskPanel();
        p2RunIdle(function () {
            if (STATE.mondayStr === data.mondayDateStr && typeof loadHoursSummary === 'function') loadHoursSummary();
        }, 120);
        return true;
    }

    /**
     * 表示していない週の保存後に、その週のキャッシュだけを差し替えます。
     * 週を移動したあとに保存が届いた場合、これを行わないと移動元の週のキャッシュが
     * 保存前のまま残り、戻ったときに古い内容が描かれて競合の原因になる。
     * @param {string} cacheKey 保存要求を出した時点のキャッシュキー（学級切替後もずれない）
     */
    function p2CacheWeekByKey(cacheKey, mondayStr, weekData) {
        if (!cacheKey || !weekData || !weekData.days || !STATE.performance) return;
        var copy = JSON.parse(JSON.stringify(weekData));
        copy.success = true;
        copy.mondayDateStr = mondayStr;
        STATE.performance.weekCache[cacheKey] = { data: copy, savedAt: Date.now() };
    }

    function p2ShowWeekLoading() {
        var grid = document.getElementById('weekGrid');
        if (!grid) return;
        grid.style.minWidth = '';
        grid.style.gridTemplateColumns = '';
        grid.innerHTML = '<div class="loading-state"><div class="spinner-lg"></div><p>読み込み中...</p></div>';
        var label = document.getElementById('weekLabel');
        if (label) label.textContent = '読み込み中...';
    }

    function p2ShowDeferredRetryUI() {
        var list = document.getElementById('sidebarTaskList');
        if (!list) return;
        list.innerHTML = '<div class="st-empty">タスクを読み込めませんでした<br>'
            + '<button class="btn btn-outline btn-sm" style="margin-top:8px;" '
            + 'onclick="STATE.performance.deferredRetries = 0; p2LoadDeferredBootstrap();">再試行</button></div>';
    }

    function p2LoadDeferredBootstrap() {
        if (STATE.performance.deferredLoaded) return;
        STATE.performance.deferredLoaded = true;
        google.script.run
            .withSuccessHandler(function (res) {
                if (!res || !res.success) return;
                STATE.performance.deferredRetries = 0;

                if (res.tasks && res.tasks.success) {
                    STATE.allTaskData = res.tasks.tasks || [];
                    STATE.tasks = STATE.allTaskData;
                    STATE.taskDataLoaded = true;
                    STATE.taskLoading = false;
                    if (typeof refreshTaskViews === 'function') refreshTaskViews();
                    else {
                        if (typeof renderTaskList === 'function') renderTaskList();
                        if (typeof renderWeeklyTaskPanel === 'function') renderWeeklyTaskPanel();
                    }
                }

                if (res.reflection && res.reflection.success) {
                    updateReflectionBadge(res.reflection.pendingCount || 0);
                    var afterSchool = new Date().getHours() >= REFLECTION_AFTERSCHOOL_HOUR;
                    if (afterSchool && res.reflection.hasLessons && res.reflection.status === '') {
                        setTimeout(function () {
                            if (typeof Swal !== 'undefined' && Swal.isVisible()) return;
                            openReflectionWizard(res.reflection.today, { auto: true });
                        }, 250);
                    }
                }

                if (res.setup && res.setup.success && !res.setup.wizardDone
                    && !(res.setup.hasApiKey && res.setup.hasCalendar)) {
                    setTimeout(function () {
                        if (typeof Swal !== 'undefined' && Swal.isVisible()) return;
                        openSetupWizard({ auto: true, status: res.setup });
                    }, 1700);
                }
            })
            .withFailureHandler(function () {
                // 一時的な通信断でタスクパネルが空のままにならないよう自動リトライし、
                // 尽きたら手動の再試行ボタンを出す
                STATE.performance.deferredLoaded = false;
                STATE.performance.deferredRetries = (STATE.performance.deferredRetries || 0) + 1;
                if (STATE.performance.deferredRetries <= 3) {
                    setTimeout(p2LoadDeferredBootstrap, 4000);
                } else {
                    p2ShowDeferredRetryUI();
                }
            })
            .getDeferredBootstrapV2();
    }

    var p2LegacyOnload = window.onload;
    window.onload = function () {
        STATE.performance.bootstrapStartedAt = Date.now();
        initWeekendVisibility();
        restoreTaskSidebarState();
        initPdfImportUI();
        initAiTaskPdfUI();
        p2ShowWeekLoading();

        google.script.run
            .withSuccessHandler(function (res) {
                if (!res || !res.success) {
                    if (typeof p2LegacyOnload === 'function') p2LegacyOnload();
                    return;
                }
                if (res.linked === false || (res.tenant && res.tenant.linked === false)) {
                    showOnboardingChoice(res.tenant || res);
                    return;
                }

                p2LogTiming('起動', res);
                p2LogTiming('起動（週案の読み込み）', res.weeklyPlan);
                if (res.masterData && res.masterData.success) STATE.masterData = res.masterData;
                if (res.multiClass && res.multiClass.success) applyMultiClassState(res.multiClass);
                STATE.mondayStr = res.mondayStr;

                if (!p2ApplyWeekData(res.weeklyPlan)) {
                    doLoadWeeklyPlan();
                }
                p2RunIdle(p2LoadDeferredBootstrap, 80);
                // 学年・コース名・テナント情報をサーバーと同期する
                // (旧onloadのstartAppInitでのみ呼ばれていたため、V2起動では
                //  STATE.gradeが既定値3のままになる不具合があった)
                p2RunIdle(function () {
                    if (typeof loadSettingsView === 'function') loadSettingsView();
                }, 300);
            })
            .withFailureHandler(function () {
                if (typeof p2LegacyOnload === 'function') p2LegacyOnload();
            })
            .getAppBootstrapV2();
    };

    // 単元マスタの変更(編集・追加・削除・PDF取込・ごみ箱復元)後に呼ぶ。
    // loadMasterData は読込済みなら何もしないため、先にキャッシュを破棄しないと
    // 週案のサジェストに変更が反映されない。
    function invalidateMasterData() {
        STATE.masterData = null;
        STATE.performance.masterLoading = false;
        // 単元マスタが変わると単元の進捗も変わるので、進捗インデックスも捨てる
        STATE.unitProgress = null;
        STATE.unitProgressLoading = false;
        loadMasterData();
    }

    function loadMasterData() {
        if (STATE.masterData || STATE.performance.masterLoading) return;
        STATE.performance.masterLoading = true;
        google.script.run
            .withSuccessHandler(function (data) {
                STATE.performance.masterLoading = false;
                if (data && data.success) STATE.masterData = data;
            })
            .withFailureHandler(function (e) {
                STATE.performance.masterLoading = false;
                _onCommError(e);
            })
            .getUnitMasterForSuggest();
    }

    /**
     * 表示中の週を読み直します。
     * @param {Object} [opts] opts.force=true で、編集中の未保存入力があっても置き換える。
     *   サーバ側の週を書き換えた直後（転記・復元・DBクリア）はこちらを使う。
     */
    function doLoadWeeklyPlan(opts) {
        var mondayStr = STATE.mondayStr;
        if (!mondayStr) return;
        if (opts && opts.force) p2DiscardLocalEdits();
        var requestSeq = ++STATE.performance.weekRequestSeq;
        var cached = p2GetCachedWeek(mondayStr);
        if (cached) p2ApplyWeekData(cached, opts);
        else p2ShowWeekLoading();

        google.script.run
            .withSuccessHandler(function (data) {
                if (requestSeq !== STATE.performance.weekRequestSeq || STATE.mondayStr !== mondayStr) return;
                if (!data || !data.success) {
                    if (!cached) showToast('error', 'データ取得エラー: ' + (data && data.error ? data.error : '取得できませんでした'));
                    return;
                }
                p2LogTiming('週の読み込み', data);
                p2ApplyWeekData(data, opts);
            })
            .withFailureHandler(function (e) {
                if (requestSeq !== STATE.performance.weekRequestSeq || STATE.mondayStr !== mondayStr) return;
                if (isNoDbError_(e && e.message)) { handleNoDbError_(); return; }
                if (!cached) showToast('error', '通信エラー: ' + e.message);
            })
            .getWeeklyPlanDataV2(mondayStr);
    }

    /**
     * サーバー側で週データが書き換わったとき、クライアントの週キャッシュを捨てます。
     *
     * 画面を経由せずDBを直接書き換える操作（固定時間割の転記・一括自動入力・単元のずらし・
     * 行事PDFの反映・バックアップからの復元）の後は必ずこれを呼ぶこと。捨てずに読み直すと、
     * doLoadWeeklyPlan() がキャッシュにある「書き換え前の週」を先に描いてしまう。
     * その状態のまま保存すると、書き換えた内容を古い内容で上書きして消してしまう。
     *
     * @param {boolean} [reloadCurrentWeek] true なら表示中の週も読み直す
     */
    function p2InvalidateWeekCache(reloadCurrentWeek) {
        if (STATE.performance && STATE.performance.weekCache) STATE.performance.weekCache = {};
        // 週の内容が変われば単元の進捗も変わる（p2UpdateCurrentWeekCache と同じ理由）
        STATE.unitProgress = null;
        STATE.unitProgressLoading = false;
        // サーバ側を書き換えたあとの読み直しなので、手元の編集より読み直しを優先する
        if (reloadCurrentWeek && STATE.mondayStr) doLoadWeeklyPlan({ force: true });
    }

    /**
     * 手元の編集内容を捨てて閲覧モードへ戻します。
     * サーバ側の週を書き換えた直後（転記・復元・DBクリア）の読み直し専用。
     * 手元の内容はもうサーバの内容と関係がないため、残すと書き換えを巻き戻してしまう。
     */
    function p2DiscardLocalEdits() {
        STATE.editBaseline = null;
        STATE.undoStack = [];
        STATE.redoStack = [];
        // 閲覧モードのセル操作の未確定分も捨てる。残すと p2ApplyWeekData が
        // 読み直しを見送ってしまい、書き換えたはずのサーバ側の内容が画面に出ない。
        if (typeof clearViewDirtyWeeks === 'function') clearViewDirtyWeeks();
        if (STATE.editMode) {
            STATE.editMode = false;
            if (typeof updateEditUI === 'function') updateEditUI();
        }
    }

    function p2UpdateCurrentWeekCache() {
        if (!STATE.weekData) return;
        // 画面に出ているデータが属する週は、そのデータ自身が持っている。
        // STATE.mondayStr（＝これから表示したい週）で上書きしてはいけない。
        // 週を移動した直後は「移動先の週を読み込み中・画面は移動元」という時間があり、
        // そこで上書きすると移動元の内容が移動先の週としてキャッシュされる。
        // その状態で保存すると「その週に含まれない日付」としてサーバに弾かれ、
        // 読み込み直すまで保存できなくなる。
        if (!STATE.weekData.mondayDateStr) STATE.weekData.mondayDateStr = STATE.mondayStr;
        if (!STATE.weekData.mondayDateStr) return;
        p2CacheWeek(STATE.weekData);
        // 週案を保存すると単元の進捗も変わる。ここは全ての保存経路が通る合流点なので、
        // クライアント側にキャッシュした進捗インデックスもここで捨てる。
        // (捨てないと、保存した時数がピッカーに反映されず同じ時間を二重に入力してしまう)
        STATE.unitProgress = null;
        STATE.unitProgressLoading = false;
    }

    // 保存は beginSaveRequest/endSaveRequest で直列化する（App_Js_02_Plan で定義）。
    // 進行中の保存があるうちに別経路の保存を投げると、後着の要求が保存前のリビジョンを
    // 持ったまま届き、自分の保存が「競合」として弾かれてしまう。
    function autoSaveAndThen(callback) {
        // 週移動・学級切替・画面切替の直前は、待たせてある閲覧モードの保存を先に送る。
        // サーバ側の保存先は「いまアクティブな学級シート」で決まるため、切替後に届いた
        // 保存は別の学級のシートへ書かれてしまう。
        flushPendingViewSave();
        if (isSaveInFlight()) {
            whenSaveIdle(function () { autoSaveAndThen(callback); });
            return;
        }
        if (!STATE.editMode || !hasUnsavedChanges()) {
            if (STATE.editMode) { STATE.editMode = false; updateEditUI(); }
            callback();
            return;
        }
        if (_autoSaving) return;
        var days = collectCurrentEditData();
        if (!days) { callback(); return; }

        var subjectErrors = validateDaysSubjects(days);
        if (subjectErrors.length > 0) {
            showToast('error', '教科名の入力に誤りがあるため自動保存できません: ' + subjectErrors[0]
                + (subjectErrors.length > 1 ? '（他' + (subjectErrors.length - 1) + '件）' : ''));
            return;
        }

        if (!beginSaveRequest()) { whenSaveIdle(function () { autoSaveAndThen(callback); }); return; }
        _autoSaving = true;
        showToast('info', '自動保存中...');
        google.script.run
            .withSuccessHandler(function (result) {
                _autoSaving = false;
                endSaveRequest();
                if (result.success) {
                    adoptSavedWeekDays(result, days);
                    STATE.weekData.revision = result.revision;
                    STATE.editMode = false;
                    updateEditUI();
                    p2UpdateCurrentWeekCache();
                    showToast('success', '自動保存しました');
                    callback();
                } else if (result.conflict) {
                    handleSaveConflict(result, days, function (revision) {
                        STATE.weekData.revision = revision;
                        autoSaveAndThen(callback);
                    });
                } else {
                    showToast('error', '自動保存失敗: ' + result.error + ' 手動で保存してください。');
                }
            })
            .withFailureHandler(function (e) {
                _autoSaving = false;
                endSaveRequest();
                showToast('error', '自動保存エラー: ' + e.message + ' 手動で保存してください。');
            })
            .saveWeeklyPlanDataV2(displayedWeekMondayStr(), days, STATE.weekData.revision);
    }

    function saveWeeklyPlan() {
        var days = collectCurrentEditData();
        if (!days) return;
        var subjectErrors = validateDaysSubjects(days);
        if (subjectErrors.length > 0) {
            showToast('error', '教科名の入力に誤りがあります: ' + subjectErrors[0]
                + (subjectErrors.length > 1 ? '（他' + (subjectErrors.length - 1) + '件）' : ''));
            return;
        }

        if (!beginSaveRequest()) { showToast('info', '保存中です。完了までお待ちください。'); return; }
        var btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-outlined fs-6">hourglass_empty</span> 保存中...';
        showToast('info', '保存中...');
        // 保存中もグリッドは操作できる。応答を待つあいだの右クリックメニューのセル操作を
        // 保存済みの内容で消してしまわないよう、要求時点の書き換え回数を控えておく。
        var mutationSeq = weekDaysMutationSeq();

        google.script.run
            .withSuccessHandler(function (result) {
                endSaveRequest();
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined fs-6">save</span> 保存する';
                p2LogTiming('週案の保存', result);
                if (result.success) {
                    adoptSavedWeekDays(result, days, null, mutationSeq);
                    STATE.weekData.revision = result.revision;
                    p2UpdateCurrentWeekCache();
                    cancelEdit();
                    showToast('success', result.message);
                    // 保存に間に合わなかったセル操作は、閲覧モードへ戻ってから保存し直す
                    if (weekDaysMutationSeq() !== mutationSeq) persistViewMutation();
                } else if (result.conflict) {
                    handleSaveConflict(result, days, function (revision) {
                        STATE.weekData.revision = revision;
                        saveWeeklyPlan();
                    });
                } else {
                    showToast('error', '保存失敗: ' + result.error);
                }
            })
            .withFailureHandler(function (e) {
                endSaveRequest();
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined fs-6">save</span> 保存する';
                showToast('error', '通信エラー: ' + e.message);
            })
            .saveWeeklyPlanDataV2(displayedWeekMondayStr(), days, STATE.weekData.revision);
    }

    // 閲覧モードのセル操作（右クリックメニュー・D&D）の自動保存。
    // 保存はGASの往復に数秒かかるため、応答を待つあいだにも次の操作ができる。
    // その前提で次の3点を守ること。守らないと、応答が先行する古い内容を持ち込み、
    // 一度消したコマが復活してその状態のまま保存されてしまう。
    //   1) 送る内容は要求時点のスナップショットにする（送信後の書き換えを巻き込まない）
    //   2) 応答の取り込みは weekDaysMutationSeq が変わっていない時だけ行う
    //   3) 待たせる保存は週ごとに1件だけ（実行時に最新の days を読み直して送る）
    function persistViewMutation() {
        if (STATE.editMode || !STATE.weekData || !STATE.mondayStr) return;
        var weekData = STATE.weekData;
        // 送るのは画面に出ているデータなので、送り先もそのデータの週にする
        var mondayStr = displayedWeekMondayStr();
        // 学級を切り替えたあとでも「その週・その学級」のキャッシュを更新できるよう、
        // キーは要求を組み立てた時点のものを使う。
        var cacheKey = p2WeekCacheKey(mondayStr);
        var expectedSheet = expectedClassSheetName();
        // 保存がサーバへ届くまでは、この週の内容は手元にしか無い。
        // 読み込み応答で差し替えられないよう、未確定であることを記録しておく。
        markViewWeekDirty(cacheKey);
        scheduleViewSave(runViewSave);

        function runViewSave() {
            if (!weekData.days) return;
            if (!beginSaveRequest()) { queueViewSave(cacheKey, runViewSave); return; }
            var mutationSeq = weekDaysMutationSeq();
            var days = JSON.parse(JSON.stringify(weekData.days));
            google.script.run
                .withSuccessHandler(function (result) {
                    endSaveRequest();
                    if (result.success) {
                        weekData.revision = result.revision;
                        markViewWeekSaved(cacheKey, mutationSeq);
                        // 編集モードに入っていたら入力欄の方が新しいので取り込まない。
                        // 週を移動していたら、この応答はもう画面上の週のものではない。
                        var sameWeek = (STATE.weekData === weekData);
                        var normalized = (sameWeek && !STATE.editMode)
                            ? adoptSavedWeekDays(result, days, weekData, mutationSeq)
                            : false;
                        // 保存が通れば時数・単元進捗のキャッシュは作り直しが要る（編集中でも同じ）
                        if (sameWeek) p2UpdateCurrentWeekCache();
                        else p2CacheWeekByKey(cacheKey, mondayStr, weekData);
                        if (normalized) renderWeekGrid(weekData.days);
                    } else if (result.conflict) {
                        handleSaveConflict(result, days, function (revision) {
                            weekData.revision = revision;
                            runViewSave();
                        });
                    } else {
                        showToast('error', '変更の保存に失敗: ' + result.error);
                    }
                })
                .withFailureHandler(function (e) {
                    endSaveRequest();
                    showToast('error', '変更の保存に失敗（通信エラー）: ' + e.message);
                })
                .saveWeeklyPlanDataV2(mondayStr, days, weekData.revision, expectedSheet);
        }
    }
</script>
