<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>プライバシーポリシー | 週案エディタ</title>
  <meta name="description" content="週案エディタ（School Plan Note）のプライバシーポリシー。">
  <meta name="theme-color" content="#1a73e8">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <!-- 正典は privacy-policy.html。Google OAuth 審査に登録済みの URL がそちらなので、
       ファイル名は変えずに残し、ここは別名の入口として転送だけを担う。
       ポータル（giga-school.com）は全アプリを /privacy.html で束ねてリンクしており、
       このアプリだけ 404 になるのを防ぐためのもの。 -->
  <link rel="canonical" href="privacy-policy.html">
  <meta http-equiv="refresh" content="0; url=privacy-policy.html">
  <meta name="robots" content="noindex, follow">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #1b2430;
      --link: #0b4aa8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171b;
        --text: #e8ebef;
        --link: #9cc3fb;
      }
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
        "Yu Gothic UI", "Meiryo", -apple-system, "Segoe UI", sans-serif;
      font-size: 1.0625rem;
      line-height: 1.9;
      text-align: center;
    }

    a {
      color: var(--link);
    }
  </style>
</head>

<body>
  <!-- meta refresh が無効な環境でも行き止まりにならないよう、本文にもリンクを置く -->
  <p>プライバシーポリシーは<a href="privacy-policy.html">こちら</a>に移動しました。<br>
    自動で移動しない場合は、上のリンクをお使いください。</p>
</body>

</html>
