    NW.editSchedCell = function (id, rowType, dayIdx, periodIdx) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        var data = block.weekData || NW.scheduleData;
        if (!data || !data.days) return;
        var day = data.days[dayIdx];
        if (!day) return;
        var overrides = block.cellOverrides || {};

        if (rowType === 'closed') {
            // 休みの日（列ごと灰色）の名前。空にすると授業のある日として出す
            var closedKey = 'closed_' + dayIdx;
            var autoLabel = schedClosedLabel_(day);
            var curLabel = overrides.hasOwnProperty(closedKey) ? overrides[closedKey] : schedClosedText_(autoLabel, true);
            Swal.fire({
                title: schedHeadLabel_(day) + ' を休みの日にする',
                input: 'text',
                inputValue: curLabel,
                inputLabel: '列に縦に入れる名前（例: ふりかえきゅうじつ）。空にすると授業のある日として出します。',
                showCancelButton: true,
                showDenyButton: overrides.hasOwnProperty(closedKey),
                denyButtonText: '週案どおりに戻す',
                confirmButtonText: '決める',
                cancelButtonText: 'キャンセル'
            }).then(function (result) {
                if (result.isDismissed) return;
                NW.pushHistory();
                if (result.isDenied) delete block.cellOverrides[closedKey];
                else block.cellOverrides[closedKey] = String(result.value || '').trim();
                NW.refreshSchedule_(id);
            });
            return;
        }

        if (rowType === 'period') {
            // Period cell: subject, unit, content fields
            var per = (day.periods && day.periods[periodIdx]) || {};
            var overKey = 'period_' + periodIdx + '_' + dayIdx;
            var hasOverride = overrides.hasOwnProperty(overKey);
            Swal.fire({
                title: day.dayLabel + ' ' + (periodIdx + 1) + '校時',
                html: '<div style="text-align:left;">'
                    + '<label style="font-size:0.85rem;font-weight:600;">教科</label>'
                    + '<input id="swalSchedSubj" class="swal2-input" value="' + escHtml(per.subject || '') + '" style="margin-top:4px;">'
                    + '<label style="font-size:0.85rem;font-weight:600;margin-top:8px;display:block;">単元</label>'
                    + '<input id="swalSchedUnit" class="swal2-input" value="' + escHtml(per.unit || '') + '" style="margin-top:4px;">'
                    + '<label style="font-size:0.85rem;font-weight:600;margin-top:8px;display:block;">内容</label>'
                    + '<input id="swalSchedCont" class="swal2-input" value="' + escHtml(per.content || '') + '" style="margin-top:4px;">'
                    + (hasOverride ? '<label style="font-size:0.8rem;color:var(--text-hint);margin-top:8px;display:block;"><input type="checkbox" id="swalSchedFreeText" checked> 自由テキストで上書き</label>'
                        + '<input id="swalSchedOverride" class="swal2-input" value="' + escHtml(overrides[overKey] || '') + '" style="margin-top:4px;">'
                        : '<label style="font-size:0.8rem;color:var(--text-hint);margin-top:8px;display:block;"><input type="checkbox" id="swalSchedFreeText"> 自由テキストで上書き</label>'
                        + '<input id="swalSchedOverride" class="swal2-input" value="" style="margin-top:4px;display:none;">')
                    + '</div>',
                showCancelButton: true,
                confirmButtonText: '保存',
                cancelButtonText: 'キャンセル',
                didOpen: function () {
                    var cb = document.getElementById('swalSchedFreeText');
                    var ov = document.getElementById('swalSchedOverride');
                    var subj = document.getElementById('swalSchedSubj');
                    var unit = document.getElementById('swalSchedUnit');
                    var cont = document.getElementById('swalSchedCont');
                    function toggleMode() {
                        if (cb.checked) {
                            ov.style.display = ''; subj.disabled = true; unit.disabled = true; cont.disabled = true;
                            subj.style.opacity = '0.5'; unit.style.opacity = '0.5'; cont.style.opacity = '0.5';
                        } else {
                            ov.style.display = 'none'; subj.disabled = false; unit.disabled = false; cont.disabled = false;
                            subj.style.opacity = '1'; unit.style.opacity = '1'; cont.style.opacity = '1';
                        }
                    }
                    cb.addEventListener('change', toggleMode);
                    toggleMode();
                },
                preConfirm: function () {
                    return {
                        freeText: document.getElementById('swalSchedFreeText').checked,
                        override: document.getElementById('swalSchedOverride').value,
                        subject: document.getElementById('swalSchedSubj').value,
                        unit: document.getElementById('swalSchedUnit').value,
                        content: document.getElementById('swalSchedCont').value
                    };
                }
            }).then(function (result) {
                if (!result.isConfirmed) return;
                NW.pushHistory();
                var v = result.value;
                if (v.freeText) {
                    block.cellOverrides[overKey] = v.override;
                } else {
                    delete block.cellOverrides[overKey];
                    if (!day.periods) day.periods = [];
                    if (!day.periods[periodIdx]) day.periods[periodIdx] = {};
                    day.periods[periodIdx].subject = v.subject;
                    day.periods[periodIdx].unit = v.unit;
                    day.periods[periodIdx].content = v.content;
                }
                var el = document.querySelector('[data-block-id="' + id + '"] .nw-schedule-block');
                if (el) el.innerHTML = NW.renderScheduleHTML(block);
            });
        } else {
            // Simple text cell (event, recess1, recess2, afterschool, homework, items)
            var labels = { event: '行事', morning: '朝', recess1: '中休み', recess2: '昼休み', afterschool: '放課後', homework: '宿題', items: '持ち物' };
            var overKey = rowType + '_' + dayIdx;
            var origVal = day[rowType] || '';
            var curVal = overrides.hasOwnProperty(overKey) ? overrides[overKey] : origVal;
            // 宿題・持ち物は1件1行の箇条書きで出す。1行の <input> で編集させると、
            // 開いた時点で改行が落ちて箇条書きが1行に潰れるので、複数行で編集させる。
            var asList = SCHED_LIST_FIELDS.indexOf(rowType) >= 0;
            // 朝の欄も「学習」の下に「漢字テスト⑥」と2行で書くので、複数行で編集させる
            if (rowType === 'morning') asList = true;
            Swal.fire({
                title: day.dayLabel + ' - ' + (labels[rowType] || rowType),
                input: asList ? 'textarea' : 'text',
                inputValue: curVal,
                showCancelButton: true,
                confirmButtonText: '保存',
                cancelButtonText: 'キャンセル',
                inputPlaceholder: labels[rowType] + 'を入力...' + (asList ? '（1行に1つ）' : '')
            }).then(function (result) {
                if (!result.isConfirmed) return;
                NW.pushHistory();
                var newVal = result.value;
                if (newVal === origVal) {
                    delete block.cellOverrides[overKey];
                } else {
                    block.cellOverrides[overKey] = newVal;
                }
                var el = document.querySelector('[data-block-id="' + id + '"] .nw-schedule-block');
                if (el) el.innerHTML = NW.renderScheduleHTML(block);
            });
        }
    };

    // ---- Image upload (FileReader → base64) ----
    NW.uploadImage = function (blockId) {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function (e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (evt) {
                var block = NW.blocks.find(function (b) { return b.id === blockId; });
                if (block) {
                    NW.pushHistory();
                    block.src = evt.target.result;
                    delete block.srcStripped;
                    NW.render();
                }
            };
            reader.readAsDataURL(file);
        };
        input.click();
    };

    // ---- Gallery image management ----
    NW.addGalleryImage = function (blockId) {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.multiple = true;
        input.onchange = function (e) {
            var files = Array.from(e.target.files);
            var block = NW.blocks.find(function (b) { return b.id === blockId; });
            if (!block) return;
            var loaded = 0;
            files.forEach(function (file) {
                var reader = new FileReader();
                reader.onload = function (evt) {
                    block.images.push({ src: evt.target.result, caption: '' });
                    loaded++;
                    if (loaded === files.length) NW.render();
                };
                reader.readAsDataURL(file);
            });
        };
        input.click();
    };

    NW.removeGalleryImage = function (blockId, index) {
        var block = NW.blocks.find(function (b) { return b.id === blockId; });
        if (!block) return;
        block.images.splice(index, 1);
        NW.render();
    };

    NW.setGalleryColumns = function (id, cols) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        block.columns = parseInt(cols, 10);
        var el = document.querySelector('[data-block-id="' + id + '"] .nw-gallery-grid');
        if (el) el.style.gridTemplateColumns = 'repeat(' + block.columns + ', 1fr)';
    };

    // ---- Columns block management ----
    NW.setColumnsCount = function (id, count) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block || block.type !== 'columns') return;
        NW.saveEditable();
        NW.pushHistory();
        block.columns = parseInt(count, 10);
        while (block.colData.length < block.columns) {
            block.colData.push({ content: '', src: '', caption: '' });
        }
        if (block.columns < 3 && block.colRatio && block.colRatio !== 'equal') {
            // Keep ratio for 2 columns, reset for others
        }
        NW.render();
    };

    NW.setColRatio = function (id, ratio) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block || block.type !== 'columns') return;
        NW.saveEditable();
        block.colRatio = ratio;
        NW.render();
    };

    NW.uploadColumnImage = function (blockId, colIndex) {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function (e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (evt) {
                var block = NW.blocks.find(function (b) { return b.id === blockId; });
                if (block && block.colData[colIndex]) {
                    block.colData[colIndex].src = evt.target.result;
                    NW.render();
                }
            };
            reader.readAsDataURL(file);
        };
        input.click();
    };

    // ---- WordArt editor (エフェクト自由組み合わせ式) ----
    // エフェクト適用ヘルパー
    NW._applyWordArtFx = function (el, b) {
        var shadows = [];
        // グラデーション
        if (b.waGradient) {
            var grad = 'linear-gradient(' + (b.waGradAngle || 135) + 'deg,' + (b.waGradC1 || '#ff0000') + (b.waGradExtra || '') + ',' + (b.waGradC2 || '#0000ff') + ')';
            el.style.background = grad;
            el.style.webkitBackgroundClip = 'text';
            el.style.backgroundClip = 'text';
            el.style.webkitTextFillColor = 'transparent';
            el.style.color = 'transparent';
        } else if (b.waStroke && !b.waGradient) {
            // アウトラインのみの場合、塗りを透明に
            el.style.webkitTextFillColor = 'transparent';
            el.style.color = 'transparent';
        } else {
            el.style.color = b.waColor || '#202124';
        }
        // アウトライン
        if (b.waStroke) {
            el.style.webkitTextStroke = (b.waStrokeWidth || 3) + 'px ' + (b.waStrokeColor || '#1a73e8');
        }
        // 3D立体 (積み重ねtext-shadow)
        if (b.wa3d) {
            var d3c = b.wa3dColor || '#c0392b';
            for (var d = 1; d <= (b.wa3dDepth || 5); d++) {
                shadows.push(d + 'px ' + d + 'px 0 ' + d3c);
            }
            shadows.push((b.wa3dDepth || 5) + 1 + 'px ' + ((b.wa3dDepth || 5) + 1) + 'px 10px rgba(0,0,0,0.3)');
        }
        // 影
        if (b.waShadow) {
            shadows.push((b.waShadowX || 3) + 'px ' + (b.waShadowY || 3) + 'px ' + (b.waShadowBlur || 6) + 'px ' + (b.waShadowColor || '#888888'));
        }
        if (shadows.length) el.style.textShadow = shadows.join(',');
    };

    NW.saveAsTemplate = function () {
        NW.saveEditable();
        if (NW.blocks.length === 0) { showToast('error', 'ブロックがありません'); return; }
        Swal.fire({
            title: 'テンプレートとして保存',
            input: 'text',
            inputLabel: 'テンプレート名',
            inputPlaceholder: '例: 基本レイアウト',
            showCancelButton: true,
            confirmButtonText: '保存',
            cancelButtonText: 'キャンセル'
        }).then(function (result) {
            if (!result.isConfirmed || !result.value) return;
            // Strip content but keep structure
            var tplBlocks = JSON.parse(JSON.stringify(NW.blocks));
            tplBlocks.forEach(function (b) {
                if (b.type === 'heading') b.content = b.content.replace(/<[^>]*>/g, '').trim() ? b.content : '見出し';
                if (b.type === 'text') b.content = '';
                if (b.type === 'image') { b.src = ''; b.wrapText = ''; b.caption = ''; }
                if (b.type === 'gallery') { b.images = []; }
                if (b.type === 'schedule') { b.weekData = null; }
                if (b.type === 'qrcode') { b.url = ''; b.label = ''; }
                // 題字の文字・学校名は毎回同じなので残す。画像は端末に残さない
                if (b.type === 'masthead') { b.src = ''; b.dateAuto = true; b.dateText = ''; }
                if (b.type === 'article') { b.title = ''; b.content = ''; }
                if (b.type === 'columns') {
                    b.colData = b.colData.map(function () { return { content: '', src: '', caption: '' }; });
                }
            });
            var templates = JSON.parse(localStorage.getItem('nw_templates') || '[]');
            templates.push({ name: result.value, blocks: tplBlocks, createdAt: new Date().toISOString() });
            localStorage.setItem('nw_templates', JSON.stringify(templates));
            showToast('success', 'テンプレート「' + result.value + '」を保存しました');
        });
    };

    /**
     * AI が書いた記事を、通信の「お知らせ」の下へ入れる。
     * replace のときは、今ある記事（本文の入っていないものも）を取りのぞいてから入れる。
     * 「お知らせ」の見出しが無ければ、いちばん下に作る。
     * @param {Array} articles [{ title, body }]
     * @param {boolean} replace
     */
    NW.insertArticles_ = function (articles, replace) {
        NW.saveEditable();
        NW.pushHistory();
        NW._skipHistory = true;
        if (replace) NW.blocks = NW.blocks.filter(function (b) { return b.type !== 'article'; });
        var label = NW.blocks.find(function (b) { return b.role === 'notice-label'; });
        if (!label) {
            label = NW.addBlock('text', null, { content: 'お知らせ', fontSize: nwPtToPx_(10), role: 'notice-label' });
        }
        // 入れる位置: 既にある記事のうち最後のものの下。無ければ「お知らせ」の下
        var after = label.id;
        NW.blocks.forEach(function (b) { if (b.type === 'article') after = b.id; });
        articles.forEach(function (a) {
            var nb = NW.addBlock('article', after, {
                title: escHtml(a.title || ''),
                content: escHtml(a.body || '').replace(/\n/g, '<br>')
            });
            after = nb.id;
        });
        // お願いを含む記事があれば、見出しを「お知らせとお願い」にする（先生の通信と同じ書き分け）。
        // 描き直すと画面の字が中身に読み戻されるので、画面の字も同じに書き替えておく
        var plainLabel = String(label.content || '').replace(/<[^>]*>/g, '').trim();
        var asks = articles.some(function (a) { return /お願い/.test((a.title || '') + (a.body || '')); });
        if (plainLabel === 'お知らせ' || plainLabel === 'お知らせとお願い') {
            label.content = asks ? 'お知らせとお願い' : 'お知らせ';
            var labelEl = document.querySelector('[data-block-id="' + label.id + '"] [contenteditable]');
            if (labelEl) labelEl.innerHTML = label.content;
        }
        NW._skipHistory = false;
        NW.render();
        NW.pushHistory();
    };

    // ---- localStorage auto-save / restore ----

    /**
     * localStorage へ保存するために、画像そのものを落としたブロックを作る。
     *
     * 学級通信には児童の顔写真が入る。この下書きはブラウザに残るため、
     * 職員室の共用端末では次に同じブラウザを使う人が開ける状態になる
     * （docs/LEGAL_RISK_AUDIT_JP.md の B-2）。
     * 以前は容量が足りなくなったときだけ画像を落としていたが、
     * **写真は常に置かない**ことにした。落ちるのは画像だけで、
     * 文章・見出し・時間割はそのまま復元できる。
     */
    NW.stripImagesForLocalSave_ = function (blocks) {
        var copy = JSON.parse(JSON.stringify(blocks || []));
        copy.forEach(function (b) {
            // 題字の画像は、落としたことを覚えておく（復元したときに入れ直しを促すため）
            if (b.src) { b.src = ''; if (b.type === 'masthead') b.srcStripped = true; }
            if (b.images) b.images.forEach(function (img) { if (img.src) img.src = ''; });
            if (b.colData) b.colData.forEach(function (col) { if (col.src) col.src = ''; });
        });
        return copy;
    };

    NW.autoSave = function () {
        clearTimeout(NW._saveTimer);
        NW._saveTimer = setTimeout(function () {
            try {
                localStorage.setItem('nw_autosave', JSON.stringify({
                    blocks: NW.stripImagesForLocalSave_(NW.blocks),
                    nextId: NW.nextId, mondayStr: NW.mondayStr
                }));
            } catch (e) {
                try {
                    // 画像を落としてもなお入らない場合（文章が非常に長いなど）は、
                    // 古い下書きを残さないよう消す。中途半端な復元より分かりやすい。
                    localStorage.removeItem('nw_autosave');
                } catch (ignore) { }
            }
        }, 800);
    };

    NW.autoRestore = function () {
        try {
            var saved = localStorage.getItem('nw_autosave');
            if (!saved) return false;
            var data = JSON.parse(saved);
            if (data.blocks && data.blocks.length > 0) {
                NW.blocks = data.blocks;
                NW.nextId = data.nextId || 1;
                if (data.mondayStr) {
                    NW.mondayStr = data.mondayStr;
                    document.getElementById('nwWeekLabel').textContent = NW.mondayStr + '週';
                }
                NW.render();
                // 写真はブラウザに残していないので、復元しても空のままになる。
                // 黙っていると「消えた」と見えるため、入れ直しが要ることを伝える。
                var needsPhotos = data.blocks.some(function (b) {
                    return b.type === 'image' || b.type === 'gallery' || b.type === 'columns'
                        || (b.type === 'masthead' && b.srcStripped);
                });
                if (needsPhotos && typeof showToast === 'function') {
                    showToast('info', '編集中の内容を復元しました。写真は端末に残していないため、入れ直してください。');
                }
                return true;
            }
        } catch (e) { }
        return false;
    };

    NW._applyLoadedData = function (data) {
        NW.blocks = data.blocks || [];
        NW.nextId = data.nextId || 1;
        if (data.mondayStr) {
            NW.mondayStr = data.mondayStr;
            document.getElementById('nwWeekLabel').textContent = NW.mondayStr + '週';
        }
        if (data.scheduleData) NW.scheduleData = data.scheduleData;

    NW.doLoadFromSheet = function (fileId) {
        if (!fileId) { showToast('error', 'ファイルIDが見つかりません'); return; }
        showToast('info', '読み込み中...');
        google.script.run
            .withSuccessHandler(function (res) {
                if (!res) { showToast('error', '読込失敗: サーバーから応答がありません'); return; }
                if (!res.success) { showToast('error', '読込失敗: ' + (res.error || '不明なエラー')); return; }
                // サーバーが jsonString を返した場合（大きいデータ向け）
                if (res.jsonString) {
                    try {
                        NW._applyLoadedData(JSON.parse(res.jsonString));
                    } catch (pe) {
                        showToast('error', '読込失敗: JSONパースエラー');
                    }
                    return;
                }
                if (!res.data) { showToast('error', '読込失敗: データが空です'); return; }
                NW._applyLoadedData(res.data);
            })
            .withFailureHandler(_onCommError)
            .loadNewsletterData(fileId);
    };

    // ---- Load schedule data from backend ----
    NW.loadScheduleData = function () {
        var mondayStr = NW.mondayStr || STATE.mondayStr;
        if (!mondayStr) { showToast('error', '週を選択してください'); return; }
        showToast('info', '週案データを読み込み中...');
        google.script.run
            .withSuccessHandler(function (data) {
                if (!data.success) { showToast('error', 'データ取得失敗: ' + data.error); return; }
                NW.scheduleData = data;
                showToast('success', '週案データを読み込みました');
                var hasSchedule = NW.blocks.some(function (b) { return b.type === 'schedule'; });
                if (hasSchedule) {
                    // 週が変わると表の中身も変わるので、その週だけの書き替え（セルの上書き）は捨てる。
                    // 発行日（自動のもの）は描き直すときに新しい週から決まる
                    var weekChanged = false;
                    NW.blocks.forEach(function (b) {
                        if (b.type !== 'schedule') return;
                        var sameWeek = b.weekData && b.weekData.days && data.days
                            && b.weekData.days[0] && data.days[0] && b.weekData.days[0].date === data.days[0].date;
                        if (!sameWeek) { b.cellOverrides = {}; weekChanged = true; }
                        b.weekData = data;
                    });
                    // 前の週に手で直した発行日は、新しい週には持ちこまない
                    if (weekChanged) {
                        NW.blocks.forEach(function (b) {
                            if (b.type !== 'masthead') return;
                            b.dateAuto = true;
                            b.dateText = '';
                            var dEl = document.querySelector('[data-block-id="' + b.id + '"] .nw-masthead-date');
                            if (dEl) { dEl.textContent = NW.mastheadDate_(b); dEl.setAttribute('data-auto', dEl.textContent); }
                        });
                    }
                    NW.render();
                } else if (NW.blocks.length === 0) {
                    // 何も無いところへ読み込んだら「いつもの学級通信」の形で組む
                    NW.buildLetterLayout_(data);
                } else {
                    NW.render();
                }
            })
            .withFailureHandler(_onCommError)
            .getNewsletterData(mondayStr);
    };

    // ---- Print via iframe ----
    NW.printNewsletter = function () {
        if (NW.blocks.length === 0) { showToast('error', 'ブロックがありません'); return; }
        var html = NW.buildPrintHTML();
        // 画面の外(-10000px)へ飛ばすと、実装によってはスクロールできる範囲がそこまで広がり、
        // 印刷ダイアログを開いた拍子に画面が飛んで、ダイアログの下でアプリが切れて見える。
        // 大きさ0・overflow:hidden の入れ物に入れて画面の左上で切り落とす。
        // iframe の中のレイアウトは外側の切り落としに左右されないので、紙の組み方は変わらない。
        var host = document.createElement('div');
        host.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;overflow:hidden;'
            + 'border:0;pointer-events:none;z-index:-1;';
        var iframe = document.createElement('iframe');
        iframe.style.cssText = 'display:block;width:210mm;height:297mm;border:0;';
        host.appendChild(iframe);
        document.body.appendChild(host);
        var doc = iframe.contentDocument;
        doc.open();
        doc.write(html);
        doc.close();
        iframe.onload = function () {
            setTimeout(function () {
                iframe.contentWindow.print();
                setTimeout(function () { if (host.parentNode) host.parentNode.removeChild(host); }, 1000);
            }, 500);
        };
    };

    // ---- Google Docs互換HTML生成 (Classroom投稿用) ----
    // DOM cloneではなく、ブロックデータからシンプルなHTML構造を直接生成
    NW.buildClassroomHTML = function () {
        NW.saveEditable();
        var body = '';
        // A4 printable area ≈ 174mm ≈ 550px
        var pageW = 550;
        NW.blocks.forEach(function (block) {
            // ブロックデコレーション: 枠線・背景
            var bdrS = '';
            if (block.borderColor) bdrS += 'border:2px solid ' + block.borderColor + ';';
            if (block.blockBgColor) bdrS += 'background-color:' + block.blockBgColor + ';';
            if (block.borderRadius) bdrS += 'border-radius:' + block.borderRadius + 'px;';
            if (bdrS) bdrS += 'padding:4px;margin:2px 0;';
            var wrapOpen = bdrS ? '<div style="' + bdrS + '">' : '';
            var wrapClose = bdrS ? '</div>' : '';

            switch (block.type) {
                case 'heading':
                    var hs = 'font-size:' + block.fontSize + 'px;text-align:' + (block.align || 'center') + ';margin:4px 0;';
                    if (block.bold) hs += 'font-weight:bold;';
                    if (block.color) hs += 'color:' + block.color + ';';
                    if (block.bgColor) hs += 'background-color:' + block.bgColor + ';';
                    if (block.fontFamily) hs += 'font-family:' + block.fontFamily + ';';
                    body += wrapOpen + '<p style="' + hs + '">' + (block.content || '') + '</p>' + wrapClose;
                    break;
                case 'text':
                    var ts = 'font-size:' + block.fontSize + 'px;text-align:' + (block.align || 'left') + ';margin:2px 0;line-height:1.7;';
                    if (block.bold) ts += 'font-weight:bold;';
                    if (block.color) ts += 'color:' + block.color + ';';
                    if (block.bgColor) ts += 'background-color:' + block.bgColor + ';';
                    if (block.fontFamily) ts += 'font-family:' + block.fontFamily + ';';
                    body += wrapOpen + '<p style="' + ts + '">' + (block.content || '&nbsp;') + '</p>' + wrapClose;
                    break;
                case 'image':
                    if (!block.src) break;
                    var imgW = Math.round(pageW * (block.width || 50) / 100);
                    if (block.float !== 'none' && block.wrapText) {
                        // 回り込み → table化
                        var imgCell = '<td style="width:' + imgW + 'px;vertical-align:top;padding:4px;"><img src="' + block.src + '" width="' + imgW + '"></td>';
                        var wts = 'vertical-align:top;padding:4px;font-size:' + (block.wrapFontSize || 12) + 'px;line-height:1.7;';
                        if (block.wrapFontFamily) wts += 'font-family:' + block.wrapFontFamily + ';';
                        if (block.wrapBold) wts += 'font-weight:bold;';
                        if (block.wrapColor) wts += 'color:' + block.wrapColor + ';';
                        if (block.wrapAlign) wts += 'text-align:' + block.wrapAlign + ';';
                        var txtCell = '<td style="' + wts + '">' + (block.wrapText || '') + '</td>';
                        body += wrapOpen + '<table style="width:100%;border:none;"><tr>'
                            + (block.float === 'right' ? txtCell + imgCell : imgCell + txtCell)
                            + '</tr></table>' + wrapClose;
                    } else {
                        body += wrapOpen + '<p style="text-align:center;margin:4px 0;"><img src="' + block.src + '" width="' + imgW + '"></p>';
                        if (block.caption) body += '<p style="text-align:center;font-size:10px;color:#5f6368;margin:2px 0;">' + block.caption + '</p>';
                        body += wrapClose;
                    }
                    break;
                case 'columns':
                    var cCols = block.columns || 2;
                    body += wrapOpen + '<table style="width:100%;border:none;border-collapse:collapse;"><tr>';
                    for (var ci = 0; ci < cCols; ci++) {
                        var cd = (block.colData && block.colData[ci]) ? block.colData[ci] : {};
                        var cw = Math.round(100 / cCols);
                        if (block.colRatio && cCols === 2) {
                            var parts = block.colRatio.split(':');
                            if (parts.length === 2) {
                                var total = parseInt(parts[0]) + parseInt(parts[1]);
                                cw = Math.round((parseInt(parts[ci]) / total) * 100);
                            }
                        }
                        body += '<td style="width:' + cw + '%;vertical-align:top;padding:6px;border:none;">';
                        if (cd.src) {
                            body += '<img src="' + cd.src + '" style="width:100%;display:block;border-radius:4px;margin-bottom:4px;">';
                        }
                        if (cd.content) {
                            body += '<div style="font-size:12px;line-height:1.6;">' + cd.content + '</div>';
                        }
                        body += '</td>';
                    }
                    body += '</tr></table>' + wrapClose;
                    break;
                case 'gallery':
                    var cols = block.columns || 2;
                    var gw = Math.round((pageW - cols * 8) / cols);
                    body += wrapOpen + '<table style="width:100%;border:none;border-collapse:collapse;"><tr>';
                    (block.images || []).forEach(function (img, i) {
                        if (img.src) {
                            body += '<td style="width:' + Math.round(100 / cols) + '%;text-align:center;vertical-align:top;padding:4px;border:none;">'
                                + '<img src="' + img.src + '" width="' + gw + '" style="display:block;margin:0 auto;">'
                                + (img.caption ? '<p style="font-size:9px;text-align:center;margin:2px 0;">' + img.caption + '</p>' : '')
                                + '</td>';
                            if ((i + 1) % cols === 0 && i < block.images.length - 1) body += '</tr><tr>';
                        }
                    });
                    body += '</tr></table>' + wrapClose;
                    break;
                case 'schedule':
                    var schedHtml = NW.renderScheduleHTML(block);
                    // Remove options panel and onclick for export
                    schedHtml = schedHtml.replace(/<div class="nw-schedule-options">[\s\S]*$/, '');
                    schedHtml = schedHtml.replace(/ onclick="[^"]*"/g, '');
                    schedHtml = schedHtml.replace(/ class="nw-sched-cell"/g, '');
                    body += wrapOpen + schedHtml + wrapClose;
                    break;
                case 'qrcode':
                    // 画像ブロックと同じく data URI を埋める（Docs への変換はその形で実績がある）
                    var qrExportSrc = block.url ? NW.qrDataUrl_(block.url, block.qrSize || 200) : '';
                    if (qrExportSrc) {
                        body += wrapOpen + '<p style="text-align:center;margin:4px 0;"><img src="' + qrExportSrc
                            + '" width="' + (block.qrSize || 200) + '"></p>';
                        if (block.label) body += '<p style="text-align:center;font-size:10px;margin:2px 0;">' + block.label + '</p>';
                        body += wrapClose;
                    }
                    break;
                case 'divider':
                    body += '<hr style="border:none;border-top:1px solid #dadce0;margin:6px 0;">';
                    break;
                case 'masthead':
                    var mhFont = block.fontFamily ? 'font-family:' + block.fontFamily + ';' : '';
                    var mhLeftHtml = block.src
                        ? '<img src="' + block.src + '" width="' + Math.round(pageW * (block.logoWidth || 66) / 100) + '">'
                        : '<p style="margin:0;font-weight:bold;font-size:' + Math.round((block.titleSize || 37) * 0.45) + 'px;">' + (block.kicker || '') + '</p>'
                        + '<p style="margin:0;font-weight:bold;font-size:' + (block.titleSize || 37) + 'px;">' + (block.title || '') + '</p>';
                    body += wrapOpen + '<table style="width:100%;border:none;border-collapse:collapse;' + mhFont + '"><tr>'
                        + '<td style="width:' + (block.logoWidth || 66) + '%;border:none;text-align:left;vertical-align:middle;padding:0;">' + mhLeftHtml + '</td>'
                        + '<td style="border:none;text-align:right;vertical-align:middle;padding:0;line-height:1.5;font-size:' + (block.infoSize || 14.67) + 'px;">'
                        + escHtml(NW.mastheadDate_(block)) + '<br>' + (block.info || '') + '</td>'
                        + '</tr></table>'
                        + '<hr style="border:none;border-top:2px solid #888888;margin:4px 0 8px;">' + wrapClose;
                    break;
                case 'article':
                    var arFs = 'font-size:' + (block.fontSize || 13.33) + 'px;' + (block.fontFamily ? 'font-family:' + block.fontFamily + ';' : '');
                    body += wrapOpen + '<p style="' + arFs + 'margin:0;font-weight:bold;line-height:1.5;'
                        + (block.underline !== false ? 'text-decoration:underline;' : '') + '">'
                        + (block.numbered !== false ? NW.articleNumber_(block.id) : '') + (block.title || '') + '</p>'
                        + '<p style="' + arFs + 'margin:0 0 8px;line-height:1.5;">' + (block.content || '&nbsp;') + '</p>' + wrapClose;
                    break;
                case 'wordart':
                    // Google DocsはCSSグラデーション非対応 → 太字＋色で代替表現
                    var wc = block.waColor || '#202124';
                    if (block.waGradient) wc = block.waGradC1 || '#ff0000';
                    var ws = 'font-size:' + (block.fontSize || 48) + 'px;text-align:' + (block.align || 'center')
                        + ';font-weight:900;color:' + wc + ';margin:4px 0;';
                    if (block.fontFamily) ws += 'font-family:' + block.fontFamily + ';';
                    if (block.waSpacing) ws += 'letter-spacing:' + block.waSpacing + 'px;';
                    body += wrapOpen + '<p style="' + ws + '">' + escHtml(block.content || '') + '</p>' + wrapClose;
                    break;
            }
        });

        return '<!DOCTYPE html><html><head><meta charset="utf-8">'
            // Googleドキュメントにも同じ丸ゴシックの書体名を渡す（ドキュメント側で選べる書体）
            + '<style>body{font-family:"Kosugi Maru","Zen Maru Gothic",sans-serif;font-size:12px;color:#202124;margin:8px;padding:0;}'
            + 'p{margin:4px 0;}table{width:100%;border-collapse:collapse;}'
            + 'th{background-color:#1a73e8;color:#ffffff;padding:4px 6px;font-size:11px;text-align:center;}'
            + 'td{padding:3px 5px;border:1px solid #dadce0;text-align:center;font-size:11px;}'
            + 'img{max-width:100%;}</style></head>'
            + '<body>' + body + '</body></html>';
    };

    // ---- Classroom post (Google Docs互換HTMLで投稿) ----
    NW.postToClassroom = function () {
        if (NW.blocks.length === 0) { showToast('error', 'ブロックがありません'); return; }
        Swal.fire({
            title: 'Classroomに投稿',
            html: '<div style="text-align:left;">'
                + '<p style="font-size:0.85rem;color:var(--text-sub);margin-bottom:8px;">学級通信エディタの現在の内容をGoogleドキュメントに変換してClassroomに投稿します。</p>'
                + '<label style="font-size:0.85rem;font-weight:600;">付加メッセージ（任意）</label>'
                + '<textarea id="swalCrMsg" class="swal2-textarea" placeholder="Classroomへのメッセージ..." style="margin-top:6px;min-height:80px;"></textarea>'
                + '</div>',
            showCancelButton: true,
            confirmButtonText: '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:text-bottom;">rocket_launch</span> 投稿',
            cancelButtonText: 'キャンセル',
            preConfirm: function () {
                return document.getElementById('swalCrMsg').value;
            }
        }).then(function (result) {
            if (!result.isConfirmed) return;
            showToast('info', 'Googleドキュメントを作成してClassroomに投稿しています...');
            var htmlContent = NW.buildClassroomHTML();
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res) { showToast('error', '投稿失敗: サーバーから応答がありません'); return; }
                    // 共有できなかった場合は投稿自体は成功しているが、児童が開けない
                    // おそれがあるので、成功ではなく警告として見せる。
                    if (res.success) showToast(res.warning ? 'warning' : 'success', res.message);
                    else showToast('error', '投稿失敗: ' + res.error);
                })
                .withFailureHandler(_onCommError)
                .postNewsletterToClassroomFromWeb(result.value || '学級通信をお届けします。', htmlContent);
        });
    };

</script>
