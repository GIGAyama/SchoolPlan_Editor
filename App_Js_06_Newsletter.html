<script>
    'use strict';
    // ===== 学級通信ブロックエディタ (NW module) =====
    // 書体えらび。
    //
    // ⚠️ 自己ホストしているのは丸ゴシック（Zen Maru Gothic）だけである。
    //    ほかの 4 つは端末に入っている書体に当てる。以前は 5 つとも
    //    Google Fonts から読んでいたが、学校のフィルタが塞ぐと
    //    印刷プレビューが開かないまま止まる。
    //
    //    4 つとも埋めこむと 1 ページあたり gzip 577KB になる（実測）。
    //    しかも学級通信の本文は先生が打つものなので、どの字が来るかは
    //    先に分からず、収録しきれない。だから端末側に任せる。
    //
    //    総称名（serif / cursive）だけに落とすと、教科書体と手書き風が
    //    同じ見た目になってしまう。GIGA 端末に実際に入っている書体を
    //    名指ししておく（Windows の「UD デジタル 教科書体」、
    //    iPad の「ヒラギノ明朝」など）。
    var NW_FONTS = [
        { label: '丸ゴシック', value: "'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" },
        { label: 'ゴシック', value: "'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Meiryo', sans-serif" },
        { label: '明朝体', value: "'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif" },
        { label: '教科書体', value: "'UD デジタル 教科書体 NP-R', 'UD Digi Kyokasho NP-R', 'Klee One', 'Yu Kyokasho', serif" },
        { label: '手書き風', value: "'Yusei Magic', 'Klee One', 'Hiragino Maru Gothic ProN', cursive" }
    ];

    // 文字の大きさは Google ドキュメントと同じ pt で選ばせる。
    // 中身はこれまでどおり px で持つ（保存済みの通信・テンプレートが px で入っているため）。
    // 以前は px の飛び飛びの値（…12, 14, 16…）しか選べず、ドキュメントで
    // 10pt・10.5pt と詰めていた先生が同じ大きさにできなかった。
    var NW_PT_SIZES = [6, 7, 7.5, 8, 8.5, 9, 9.5, 10, 10.5, 11, 11.5, 12, 13, 14, 15, 16, 18, 20, 22, 24, 26, 28, 32, 36, 40, 48, 56, 64, 72];

    /** pt → px（1pt = 4/3px）。小数第2位まで持つ */
    function nwPtToPx_(pt) {
        var n = parseFloat(pt);
        if (!isFinite(n) || n <= 0) return 16;
        return Math.round(n * 4 / 3 * 100) / 100;
    }

    /** px → pt。0.5pt 刻みに丸める（12px は 9pt、13.33px は 10pt） */
    function nwPxToPt_(px) {
        var n = parseFloat(px);
        if (!isFinite(n) || n <= 0) return 12;
        return Math.round(n * 0.75 * 2) / 2;
    }

    // WordArt: エフェクト自由組み合わせ式のデフォルト色リスト
    var NW_WA_GRAD_PRESETS = [
        { c1: '#ff0000', c2: '#0000ff', label: '赤→青' },
        { c1: '#ff8c00', c2: '#ff006e', label: '橙→桃' },
        { c1: '#ffd700', c2: '#b8860b', label: 'ゴールド' },
        { c1: '#00c853', c2: '#0077b6', label: '緑→青' },
        { c1: '#ff2e7e', c2: '#ffcce0', label: '桜' },
        { c1: '#240046', c2: '#c77dff', label: '紫' },
        { c1: '#ff0000', c2: '#9c27b0', label: '虹', extra: ',#ff8c00,#ffd700,#00c853,#2196f3' }
    ];

    var NW = {
        blocks: [],
        nextId: 1,
        mondayStr: null,
        dragId: null,
        scheduleData: null,
        initialized: false,
        _saveTimer: null,
        // Undo/Redo
        _history: [],
        _historyIdx: -1,
        _historyMax: 50,
        _skipHistory: false
    };

    NW.init = function () {
        if (NW.initialized) return;
        NW.mondayStr = STATE.mondayStr;
        if (NW.mondayStr) {
            document.getElementById('nwWeekLabel').textContent = NW.mondayStr + '週';
        }
        // Event delegation: click to select/deselect blocks
        document.getElementById('nwEditorPage').addEventListener('click', function (e) {
            var blockEl = e.target.closest('.nw-block');
            document.querySelectorAll('.nw-block.nw-block-selected').forEach(function (el) {
                if (el !== blockEl) el.classList.remove('nw-block-selected');
            });
            if (blockEl) blockEl.classList.add('nw-block-selected');
        });
        // Keyboard shortcuts
        document.addEventListener('keydown', function (e) {
            if (STATE.view !== 'newsletter') return;
            var mod = e.ctrlKey || e.metaKey;
            if (!mod) return;
            var k = e.key.toLowerCase();
            // Ctrl+Z = undo, Ctrl+Shift+Z / Ctrl+Y = redo
            if (k === 'z' && !e.shiftKey) { e.preventDefault(); NW.undo(); return; }
            if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); NW.redo(); return; }
            if (k === 's') { e.preventDefault(); NW.saveToSheet(); return; }
            if (k === 'p') { e.preventDefault(); NW.printNewsletter(); return; }
        });
        // Restore from localStorage if available
        if (NW.blocks.length === 0) NW.autoRestore();
        NW.pushHistory(); // initial state
        NW.initialized = true;
    };

    // ---- Undo / Redo ----
    NW.pushHistory = function () {
        if (NW._skipHistory) return;
        NW.saveEditable();
        var snap = JSON.stringify({ blocks: NW.blocks, nextId: NW.nextId });
        // Don't push duplicate
        if (NW._historyIdx >= 0 && NW._history[NW._historyIdx] === snap) return;
        NW._history = NW._history.slice(0, NW._historyIdx + 1);
        NW._history.push(snap);
        if (NW._history.length > NW._historyMax) NW._history.shift();
        NW._historyIdx = NW._history.length - 1;
    };

    NW.undo = function () {
        if (NW._historyIdx <= 0) { showToast('info', '元に戻せません'); return; }
        NW.saveEditable();
        NW._historyIdx--;
        NW._restoreHistory();
    };

    NW.redo = function () {
        if (NW._historyIdx >= NW._history.length - 1) { showToast('info', 'やり直せません'); return; }
        NW.saveEditable(); // undoと対称に、編集中の内容を破棄しない
        NW._historyIdx++;
        NW._restoreHistory();
    };

    NW._restoreHistory = function () {
        var snap = JSON.parse(NW._history[NW._historyIdx]);
        NW._skipHistory = true;
        NW.blocks = snap.blocks;
        NW.nextId = snap.nextId;
        NW.render();
        NW._skipHistory = false;
    };

    NW.navWeek = function (delta) {
        var base = NW.mondayStr || STATE.mondayStr;
        if (!base) return;
        var parts = base.split('/');
        var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
        d.setDate(d.getDate() + delta * 7);
        NW.mondayStr = formatDateLocal(d);
        document.getElementById('nwWeekLabel').textContent = NW.mondayStr + '週';
    };

    NW.genId = function () { return 'nwb-' + (NW.nextId++); };

    // ---- Block CRUD ----
    NW.addBlock = function (type, afterId, data) {
        NW.pushHistory();
        var block = { id: NW.genId(), type: type };
        data = data || {};
        switch (type) {
            case 'heading':
                block.content = data.content || '見出し';
                block.fontSize = data.fontSize || 18;
                block.align = data.align || 'center';
                block.bold = data.bold !== undefined ? data.bold : true;
                block.fontFamily = data.fontFamily || '';
                block.color = data.color || '';
                block.bgColor = data.bgColor || '';
                break;
            case 'text':
                block.content = data.content || '';
                block.fontSize = data.fontSize || 12;
                block.align = data.align || 'left';
                block.bold = !!data.bold;
                block.fontFamily = data.fontFamily || '';
                block.color = data.color || '';
                block.bgColor = data.bgColor || '';
                break;
            case 'image':
                block.src = data.src || '';
                block.width = data.width || 50;
                block.float = data.float || 'none';
                block.wrapText = data.wrapText || '';
                block.wrapAlign = data.wrapAlign || 'left';
                block.wrapFontSize = data.wrapFontSize || 12;
                block.wrapFontFamily = data.wrapFontFamily || '';
                block.wrapBold = !!data.wrapBold;
                block.wrapColor = data.wrapColor || '';
                block.caption = data.caption || '';
                break;
            case 'gallery':
                block.images = data.images || [];
                block.columns = data.columns || 2;
                break;
            case 'schedule':
                block.weekData = data.weekData || null;
                block.cellOverrides = data.cellOverrides || {};
                block.options = {
                    showEvent: true,
                    showRecess: true,
                    showAfterSchool: true,
                    showHomework: true,
                    showItems: true,
                    showSaturday: false,
                    hiddenPeriods: [],
                    displayMode: 'subject',
                    // 日付の大きさ: s / m / l / xl。既に保存してある通信には無いので、
                    // 読み込み時はここの既定（m）が入る。
                    dateSize: 'm',
                    // 見出しの上段を日付にするか（既定は曜日が上＝これまでどおり）
                    dateFirst: false,
                    // 見出し帯の色。文字色は明るさから自動で決める
                    headerColor: SCHED_HEADER_COLOR_DEFAULT,
                    // ここから下は、保存済みの通信には無い。無いとき（undefined）は
                    // どれも「今までの見え方」になるように決めてある。
                    // 表の形: 'app'（今まで）/ 'letter'（紙の学級通信の形。schedLetterDefaults_ を見ること）
                    tableStyle: 'app',
                    // 朝の行（週案の「朝」の欄）
                    showMorning: false,
                    // 祝日・休みの日の列を灰色にして、名前を縦に1字ずつ入れる
                    closedDays: false,
                    // 学級通信の形のときの文字の大きさ（pt）と、校時の行の高さ（mm。0 は自動）
                    sizes: null,
                    rowHeight: 0,
                    // 左端の見出しの呼び名（例: 宿題 → 課題）。先生が一度変えたら次の表にも引きつぐ
                    rowLabels: NW.loadSchedLabels_()
                };
                if (data.options) {
                    for (var k in data.options) block.options[k] = data.options[k];
                }
                break;
            case 'qrcode':
                block.url = data.url || '';
                block.qrSize = data.qrSize || 200;
                block.label = data.label || '';
                break;
            case 'divider':
                break;
            case 'columns':
                block.columns = data.columns || 2;
                block.colData = data.colData || [];
                // Initialize columns with empty data
                while (block.colData.length < block.columns) {
                    block.colData.push({ content: '', src: '', caption: '' });
                }
                block.colRatio = data.colRatio || 'equal';
                break;
            case 'masthead':
                // 通信のいちばん上（題字＋発行日・学校名・担任名）。
                // 文字は前回の入力を引きつぐ（題字の画像は端末に残さないので引きつがない）
                var mem = NW.loadMastheadMemory_();
                block.src = data.src || '';
                block.logoWidth = data.logoWidth || mem.logoWidth || 66;
                block.kicker = data.kicker !== undefined ? data.kicker : (mem.kicker || '');
                block.title = data.title !== undefined ? data.title : (mem.title || '');
                block.titleSize = data.titleSize || mem.titleSize || nwPtToPx_(28);
                block.info = data.info !== undefined ? data.info : (mem.info || '');
                block.infoSize = data.infoSize || mem.infoSize || nwPtToPx_(11);
                // 発行日は週から決める（対象週の前の金曜日）。先生が書き替えたらその字を使う
                block.dateAuto = data.dateAuto !== undefined ? data.dateAuto : true;
                block.dateText = data.dateText || '';
                block.fontFamily = data.fontFamily || '';
                break;
            case 'article':
                // お知らせの記事 1 本。「１．見出し」（太字・下線）＋本文。番号は並び順で振る
                block.title = data.title || '';
                block.content = data.content || '';
                block.fontSize = data.fontSize || nwPtToPx_(10);
                block.fontFamily = data.fontFamily || '';
                block.underline = data.underline !== undefined ? data.underline : true;
                block.numbered = data.numbered !== undefined ? data.numbered : true;
                break;
            case 'wordart':
                block.content = data.content || 'ワードアート';
                block.fontSize = data.fontSize || 48;
                block.align = data.align || 'center';
                block.fontFamily = data.fontFamily || '';
                block.waColor = data.waColor || '#202124';
                block.waGradient = data.waGradient || false;
                block.waGradC1 = data.waGradC1 || '#ff0000';
                block.waGradC2 = data.waGradC2 || '#0000ff';
                block.waGradAngle = data.waGradAngle || 135;
                block.waGradExtra = data.waGradExtra || '';
                block.waStroke = data.waStroke || false;
                block.waStrokeColor = data.waStrokeColor || '#1a73e8';
                block.waStrokeWidth = data.waStrokeWidth || 3;
                block.waShadow = data.waShadow || false;
                block.waShadowColor = data.waShadowColor || '#888888';
                block.waShadowX = data.waShadowX || 3;
                block.waShadowY = data.waShadowY || 3;
                block.waShadowBlur = data.waShadowBlur || 6;
                block.wa3d = data.wa3d || false;
                block.wa3dColor = data.wa3dColor || '#c0392b';
                block.wa3dDepth = data.wa3dDepth || 5;
                block.waBgDark = data.waBgDark || false;
                block.waSpacing = data.waSpacing || 2;
                break;
        }
        // 決まった役目を持つブロックの印（いまは「お知らせ」の見出し 'notice-label' だけ）。
        // AI がまとめて書いた記事を差しこむ位置を探すのに使う
        if (data.role) block.role = data.role;
        // Block decoration (all block types)
        block.borderColor = data.borderColor || '';
        block.borderRadius = data.borderRadius || 0;
        block.blockBgColor = data.blockBgColor || '';
        if (afterId) {
            var idx = NW.blocks.findIndex(function (b) { return b.id === afterId; });
            NW.blocks.splice(idx + 1, 0, block);
        } else {
            NW.blocks.push(block);
        }
        NW.render();
        return block;
    };

    NW.removeBlock = function (id) {
        NW.pushHistory();
        NW.blocks = NW.blocks.filter(function (b) { return b.id !== id; });
        NW.render();
    };

    NW.moveBlock = function (id, dir) {
        var idx = NW.blocks.findIndex(function (b) { return b.id === id; });
        if (idx < 0) return;
        var newIdx = idx + dir;
        if (newIdx < 0 || newIdx >= NW.blocks.length) return;
        NW.pushHistory();
        NW.saveEditable();
        var tmp = NW.blocks[idx];
        NW.blocks[idx] = NW.blocks[newIdx];
        NW.blocks[newIdx] = tmp;
        NW.render();
    };

    NW.duplicateBlock = function (id) {
        var orig = NW.blocks.find(function (b) { return b.id === id; });
        if (!orig) return;
        NW.pushHistory();
        NW.saveEditable();
        var clone = JSON.parse(JSON.stringify(orig));
        clone.id = NW.genId();
        var idx = NW.blocks.findIndex(function (b) { return b.id === id; });
        NW.blocks.splice(idx + 1, 0, clone);
        NW.render();
    };

    // ---- Save contenteditable before re-render ----
    NW.saveEditable = function () {
        NW.blocks.forEach(function (block) {
            if (block.type === 'heading' || block.type === 'text') {
                var el = document.querySelector('[data-block-id="' + block.id + '"] [contenteditable]');
                if (el) block.content = el.innerHTML;
            }
            if (block.type === 'image' && block.float !== 'none') {
                var wt = document.querySelector('[data-block-id="' + block.id + '"] .nw-float-text-side');
                if (wt) block.wrapText = wt.innerHTML;
            }
            if (block.type === 'gallery') {
                var cells = document.querySelectorAll('[data-block-id="' + block.id + '"] .nw-gallery-caption');
                cells.forEach(function (cap, i) {
                    if (block.images[i]) block.images[i].caption = cap.innerHTML;
                });
            }
            if (block.type === 'qrcode') {
                var ql = document.querySelector('[data-block-id="' + block.id + '"] .nw-qrcode-label');
                if (ql) block.label = ql.innerHTML;
            }
            if (block.type === 'image') {
                var capEl = document.querySelector('[data-block-id="' + block.id + '"] .nw-image-caption');
                if (capEl) block.caption = capEl.innerHTML;
            }
            if (block.type === 'columns') {
                var colCells = document.querySelectorAll('[data-block-id="' + block.id + '"] .nw-col-text');
                colCells.forEach(function (cell, i) {
                    if (block.colData[i]) block.colData[i].content = cell.innerHTML;
                });
            }
            if (block.type === 'article') {
                var at = document.querySelector('[data-block-id="' + block.id + '"] .nw-article-title');
                if (at) block.title = at.innerHTML;
                var ab = document.querySelector('[data-block-id="' + block.id + '"] .nw-article-body');
                if (ab) block.content = ab.innerHTML;
            }
            if (block.type === 'masthead') {
                var mk = document.querySelector('[data-block-id="' + block.id + '"] .nw-masthead-kicker');
                if (mk) block.kicker = mk.innerHTML;
                var mn = document.querySelector('[data-block-id="' + block.id + '"] .nw-masthead-name');
                if (mn) block.title = mn.innerHTML;
                var ml = document.querySelector('[data-block-id="' + block.id + '"] .nw-masthead-lines');
                if (ml) block.info = ml.innerHTML;
                var md = document.querySelector('[data-block-id="' + block.id + '"] .nw-masthead-date');
                if (md) NW.setMastheadDate_(block, md.textContent, md.getAttribute('data-auto'));
                if (mk || mn || ml) NW.saveMastheadMemory_(block);
            }
        });
    };

    // ---- Rendering ----
    NW.render = function () {
        NW.saveEditable();
        var page = document.getElementById('nwEditorPage');
        if (NW.blocks.length === 0) {
            page.innerHTML = '<div class="nw-empty-editor" id="nwEmptyState">'
                + '<span class="material-symbols-outlined" style="font-size:48px;opacity:0.3;display:block;margin-bottom:12px;">newspaper</span>'
                + '<p style="margin-bottom:16px;">ブロックを追加して学級通信を作成しましょう</p>'
                + '<div class="nw-quickstart">'
                + '<button class="nw-quickstart-btn nw-quickstart-letter" onclick="NW.quickStart(\'letter\')">'
                + '<span class="material-symbols-outlined">newspaper</span><span>いつもの学級通信</span>'
                + '<small>題字+週予定の表+お知らせ（A4 1枚）</small></button>'
                + '<button class="nw-quickstart-btn" onclick="NW.quickStart(\'basic\')">'
                + '<span class="material-symbols-outlined">article</span><span>基本レイアウト</span>'
                + '<small>見出し+テキスト+区切り線</small></button>'
                + '<button class="nw-quickstart-btn" onclick="NW.quickStart(\'schedule\')">'
                + '<span class="material-symbols-outlined">calendar_month</span><span>時間割付き</span>'
                + '<small>見出し+時間割+テキスト</small></button>'
                + '<button class="nw-quickstart-btn" onclick="NW.quickStart(\'photo\')">'
                + '<span class="material-symbols-outlined">photo_library</span><span>写真レイアウト</span>'
                + '<small>見出し+段組み+ギャラリー</small></button>'
                + '<button class="nw-quickstart-btn nw-quickstart-ai" onclick="NW.generateFullNewsletter()">'
                + '<span class="material-symbols-outlined">auto_awesome</span><span>AIでお知らせまで</span>'
                + '<small>いつもの形＋お知らせ記事をAIが下書き</small></button>'
                + '</div></div>';
            NW.autoSave();
            return;
        }
        page.innerHTML = '';
        // Insert button at the top
        page.appendChild(NW._createInsertBtn(null));
        NW.blocks.forEach(function (block) {
            page.appendChild(NW.renderBlock(block));
            // Insert button after each block
            page.appendChild(NW._createInsertBtn(block.id));
        });
        NW.autoSave();
    };

    // ---- Insert button between blocks ----
    NW._createInsertBtn = function (afterId) {
        var wrapper = document.createElement('div');
        wrapper.className = 'nw-insert-row';
        var btn = document.createElement('button');
        btn.className = 'nw-insert-btn';
        btn.innerHTML = '<span class="material-symbols-outlined">add</span>';
        btn.title = 'ブロックを挿入';
        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            NW._showInsertMenu(afterId, btn);
        });
        wrapper.appendChild(btn);
        return wrapper;
    };

    NW._showInsertMenu = function (afterId, anchorEl) {
        var items = [
            { type: 'article', icon: 'article', label: 'お知らせ記事' },
            { type: 'heading', icon: 'title', label: '見出し' },
            { type: 'text', icon: 'notes', label: 'テキスト' },
            { type: 'image', icon: 'image', label: '画像' },
            { type: 'columns', icon: 'view_column', label: '段組み' },
            { type: 'gallery', icon: 'auto_awesome_mosaic', label: 'ギャラリー' },
            { type: 'schedule', icon: 'calendar_month', label: '時間割' },
            { type: 'divider', icon: 'horizontal_rule', label: '区切り線' },
            { type: 'qrcode', icon: 'qr_code_2', label: 'QRコード' },
            { type: 'wordart', icon: 'title', label: 'ワードアート' },
            { type: 'masthead', icon: 'newspaper', label: '題字・発行日' }
        ];
        var html = '<div class="nw-insert-menu-grid">';
        items.forEach(function (it) {
            html += '<button class="nw-insert-menu-item" data-type="' + it.type + '">'
                + '<span class="material-symbols-outlined">' + it.icon + '</span>' + it.label + '</button>';
        });
        html += '</div>';
        Swal.fire({
            html: html,
            showConfirmButton: false,
            showCloseButton: true,
            width: 340,
            customClass: { popup: 'nw-insert-popup' },
            didOpen: function (popup) {
                popup.querySelectorAll('.nw-insert-menu-item').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        Swal.close();
                        NW.addBlock(btn.getAttribute('data-type'), afterId);
                    });
                });
            }
        });
    };

    // ---- Quick-start layouts ----
    NW.quickStart = function (preset) {
        NW.blocks = [];
        NW.nextId = 1;
        switch (preset) {
            case 'letter':
                NW.buildLetterLayout_(NW.scheduleData);
                // 週案がまだ読めていなければ読みにいく（表と発行日がその週で埋まる）
                if (!NW.scheduleData) NW.loadScheduleData();
                break;
            case 'basic':
                NW.addBlock('heading', null, { content: '学級通信', fontSize: 20, align: 'center' });
                NW.addBlock('text', null, { content: '', fontSize: 11, align: 'center' });
                NW.addBlock('divider');
                NW.addBlock('text', null, { content: '', fontSize: 12 });
                NW.addBlock('divider');
                NW.addBlock('text', null, { content: '', fontSize: 12 });
                break;
            case 'schedule':
                NW.addBlock('heading', null, { content: '学級通信', fontSize: 20, align: 'center' });
                NW.addBlock('text', null, { content: '', fontSize: 11, align: 'center' });
                NW.addBlock('divider');
                NW.addBlock('text', null, { content: '', fontSize: 12 });

    NW.renderBlock = function (block) {
        var wrapper = document.createElement('div');
        wrapper.className = 'nw-block';
        wrapper.setAttribute('data-block-id', block.id);
        wrapper.setAttribute('draggable', 'true');

        // Drag handle
        var handle = document.createElement('span');
        handle.className = 'nw-block-handle material-symbols-outlined';
        handle.textContent = 'drag_indicator';
        wrapper.appendChild(handle);

        // Action bar
        var actions = document.createElement('div');
        actions.className = 'nw-block-actions';

        // ブロック種別ごとの書式ツールバー（純粋関数で生成・該当種別のみ非空）
        var toolbarHtml = NW.buildBlockToolbar_(block);
        if (toolbarHtml) actions.insertAdjacentHTML('beforeend', toolbarHtml);

        // Common action buttons: decoration, up, down, duplicate, delete
        actions.insertAdjacentHTML('beforeend',
            '<button title="装飾" onclick="NW.openDecoration(\'' + block.id + '\')"><span class="material-symbols-outlined">palette</span></button>'
            + '<div class="nw-act-sep"></div>'
            + '<button title="上へ" onclick="NW.moveBlock(\'' + block.id + '\',-1)"><span class="material-symbols-outlined">arrow_upward</span></button>'
            + '<button title="下へ" onclick="NW.moveBlock(\'' + block.id + '\',1)"><span class="material-symbols-outlined">arrow_downward</span></button>'
            + '<button title="複製" onclick="NW.duplicateBlock(\'' + block.id + '\')"><span class="material-symbols-outlined">content_copy</span></button>'
            + '<button title="削除" onclick="NW.removeBlock(\'' + block.id + '\')"><span class="material-symbols-outlined">delete</span></button>');
        wrapper.appendChild(actions);

        // Apply block decoration via CSS custom properties (to avoid overriding hover/selected)
        if (block.blockBgColor) wrapper.style.background = block.blockBgColor;
        if (block.borderColor) {
            wrapper.setAttribute('data-deco-border', block.borderColor);
            wrapper.style.setProperty('--deco-border', block.borderColor);
        }
        if (block.borderRadius) wrapper.style.borderRadius = block.borderRadius + 'px';

        // Content area
        wrapper.appendChild(NW.renderContent(block));

        // Drag & drop events
        wrapper.addEventListener('dragstart', function (e) {
            NW.dragId = block.id;
            e.dataTransfer.effectAllowed = 'move';
            wrapper.style.opacity = '0.4';
        });
        wrapper.addEventListener('dragend', function () {
            wrapper.style.opacity = '1';
            NW.dragId = null;
            document.querySelectorAll('.nw-drag-over').forEach(function (el) { el.classList.remove('nw-drag-over'); });
        });
        wrapper.addEventListener('dragover', function (e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            wrapper.classList.add('nw-drag-over');
        });
        wrapper.addEventListener('dragleave', function () {
            wrapper.classList.remove('nw-drag-over');
        });
        wrapper.addEventListener('drop', function (e) {
            e.preventDefault();
            wrapper.classList.remove('nw-drag-over');
            if (!NW.dragId || NW.dragId === block.id) return;
            NW.pushHistory();
            NW.saveEditable();
            var fromIdx = NW.blocks.findIndex(function (b) { return b.id === NW.dragId; });
            var toIdx = NW.blocks.findIndex(function (b) { return b.id === block.id; });
            if (fromIdx < 0 || toIdx < 0) return;
            var moved = NW.blocks.splice(fromIdx, 1)[0];
            NW.blocks.splice(toIdx, 0, moved);
            NW._skipHistory = true;
            NW.render();
            NW._skipHistory = false;
        });

        return wrapper;
    };

    /**
     * QRコードを、この端末の中だけで作って data URI で返す。
     *
     * 以前は先生が入れたURLを外部サービス（api.qrserver.com）へ送って画像を作らせていた。
     * QRに貼るのは保護者アンケートのフォームや写真フォルダなど、URL自体が鍵になっている
     * ものが多いため、送信そのものをやめた（docs/LEGAL_RISK_AUDIT_JP.md の A-2）。
     * 学校のフィルタリングで外部が塞がれても出るようになる、という副次的な利点もある。
     *
     * 同期で返すこと。renderContent が同期関数なので、非同期にすると描画順が崩れる。
     * 生成できなかったときは空文字を返し、呼び出し側でプレースホルダに落とす
     * （ここで例外を投げると学級通信の編集画面ごと描画できなくなる）。
     * @param {string} url QRに埋め込むURL
     * @param {number} sizePx 表示したい一辺のピクセル数
     * @returns {string} data URI（失敗時は空文字）
     */
    NW.qrDataUrl_ = function (url, sizePx) {
        try {
            if (!url || typeof qrcode !== 'function') return '';
            var size = parseInt(sizePx, 10) || 200;
            var qr = qrcode(0, 'M');   // 0 = 型番はデータ量に応じて自動
            qr.addData(String(url));   // 既定の Byte モード。日本語URLもUTF-8で入る
            qr.make();
            // 静粛域（quiet zone）は規格どおり4モジュール分あける。
            // セルの大きさは「出来上がりが指定サイズ以上」になるよう切り上げる。
            // 拡大されてぼやけるより、縮小されるほうが読み取りやすい。
            var margin = 4;
            var modules = qr.getModuleCount() + margin * 2;
            var cell = Math.max(1, Math.ceil(size / modules));
            return qr.createDataURL(cell, margin);
        } catch (e) {
            return '';
        }
    };

    NW.renderContent = function (block) {
        var div = document.createElement('div');
        switch (block.type) {
            case 'heading':
                div.className = 'nw-heading-content';
                div.contentEditable = 'true';
                div.innerHTML = block.content;
                div.style.fontSize = block.fontSize + 'px';
                div.style.textAlign = block.align;
                if (block.bold) div.style.fontWeight = '700';
                if (block.fontFamily) div.style.fontFamily = block.fontFamily;
                if (block.color) div.style.color = block.color;
                if (block.bgColor) div.style.backgroundColor = block.bgColor;
                div.setAttribute('data-placeholder', '見出しを入力...');
                div.addEventListener('blur', function () { block.content = div.innerHTML; });
                break;

            case 'text':
                div.className = 'nw-text-content';
                div.contentEditable = 'true';
                div.innerHTML = block.content;
                div.style.fontSize = block.fontSize + 'px';
                div.style.textAlign = block.align;
                if (block.bold) div.style.fontWeight = '700';
                if (block.fontFamily) div.style.fontFamily = block.fontFamily;
                if (block.color) div.style.color = block.color;
                if (block.bgColor) div.style.backgroundColor = block.bgColor;
                div.setAttribute('data-placeholder', 'テキストを入力...');
                div.addEventListener('blur', function () { block.content = div.innerHTML; });
                // Enter key → new text block below
                div.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        block.content = div.innerHTML;
                        var newBlock = NW.addBlock('text', block.id);
                        setTimeout(function () {
                            var newEl = document.querySelector('[data-block-id="' + newBlock.id + '"] [contenteditable]');
                            if (newEl) newEl.focus();
                        }, 50);
                    }
                    // Backspace on empty → delete block
                    if (e.key === 'Backspace' && !div.textContent.trim() && !div.innerHTML.includes('<img')) {
                        e.preventDefault();
                        NW.removeBlock(block.id);
                    }
                });
                break;

            case 'image':
                div.className = 'nw-image-block';
                if (block.src) {
                    if (block.float !== 'none') {

                        var floatDiv = document.createElement('div');

                        if (block.wrapBold) textSide.style.fontWeight = '700';
                        if (block.wrapColor) textSide.style.color = block.wrapColor;

                        textSide.addEventListener('blur', function () { block.wrapText = textSide.innerHTML; });

                        floatDiv.appendChild(textSide);

                    } else {
                        // Centered image, no wrapping

                var mhRight = document.createElement('div');

                mhLines.addEventListener('blur', function () { block.info = mhLines.innerHTML; NW.saveMastheadMemory_(block); });
                mhRight.appendChild(mhDate);

            case 'article':

                div.className = 'nw-article';
                div.style.fontSize = (block.fontSize || 13.33) + 'px';
                if (block.fontFamily) div.style.fontFamily = block.fontFamily;
                var arHead = document.createElement('div');
                arHead.className = 'nw-article-head';
                if (block.underline !== false) arHead.style.textDecoration = 'underline';

                arTitle.className = 'nw-article-title';

                var arBody = document.createElement('div');

                });
                arHead.appendChild(arTitle);
                div.appendChild(arHead);
                div.appendChild(arBody);
                break;
        }
        return div;
    };

    // ---- 1年生用: 教科名ひらがな変換マップ ----
    // ⚠️ 時数画面の既定教科（App_Js_05_Hours.html の defaultSubjects）と、
    //    集約ルール（07_WebApp.gs の SUBJECT_AGGREGATION_RULES_）に出てくる名前を
    //    ひととおり載せてある。ここに無い教科名は漢字のまま出るので、
    //    1年生の通信で読めない行が混ざる。教科を増やしたらここにも足すこと。
    //    中体育・外体育は体育館（なか）と校庭（そと）の体育。先生が書き分けた
    //    区別を潰さないよう、合算せず字のとおりに読みを当てている。
    var SUBJECT_HIRAGANA_MAP = {
        '国語': 'こくご',
        '社会': 'しゃかい',
        '算数': 'さんすう',
        '理科': 'りか',
        '生活': 'せいかつ',
        '音楽': 'おんがく',
        '図画工作': 'ずがこうさく',
        '家庭': 'かてい',
        '体育': 'たいいく',
        '中体育': 'なかたいいく',
        '外体育': 'そとたいいく',
        '外国語': 'がいこくご',
        '外国語活動': 'がいこくごかつどう',
        '道徳': 'どうとく',
        '総合': 'そうごう',
        '特活': 'とっかつ',
        '学活': 'がっかつ',
        '学級活動': 'がっきゅうかつどう',
        '図工': 'ずこう',
        '図書': 'としょ',
        '書写': 'しょしゃ',
        '行事': 'ぎょうじ',
        '給食': 'きゅうしょく',
        '掃除': 'そうじ',
        '委員会': 'いいんかい'
    };

    /**
     * いま「ひらがな表記」で出す学年かどうか。
     * 教科名も表の見出しもこの1か所で判断する。別々に見ていると、
     * 教科だけひらがなで見出しは漢字、というちぐはぐな表になる。
     */
    function schedUsesHiragana_() {
        try { return STATE.grade === 1; } catch (e) { return false; }
    }
    NW.schedUsesHiragana_ = schedUsesHiragana_;

    /**
     * 学年が1年の場合、教科名をひらがなに変換します。
     * 分数付き複数教科（例: "国語1/3　音楽2/3"）は分数を除去し
     * 各教科をひらがなに変換して"／"で結合します（例: "こくご／おんがく"）。
     * マップにない教科名はそのまま返します。
     */
    function subjectToHiragana(name) {
        if (!schedUsesHiragana_() || !name) return name;
        // 直接マッチする場合はそのまま返す
        if (SUBJECT_HIRAGANA_MAP[name]) return SUBJECT_HIRAGANA_MAP[name];
        // 分数付き複数教科の解析（例: "国語1/3　音楽2/3"）
        var normalized = name.toString().trim().replace(/　/g, ' ');
        var regex = /([^\s\d\/\.]+)(?:\s*(?:\d+\/\d+|\d+\.\d+))?/g;
        var match;
        var subjects = [];
        while ((match = regex.exec(normalized)) !== null) {
            var subj = match[1].trim();
            if (subj) subjects.push(SUBJECT_HIRAGANA_MAP[subj] || subj);
        }
        if (subjects.length > 0) return subjects.join('／');
        return name;
    }

    /**
     * 週案の日付 "2026/09/14" を、通信の見出し用に "9/14" へ直す。
     * 月日の頭の 0 を落とすだけ。想定外の形（空・区切りが足りない）は素通しする。
     */
    function schedDateLabel_(dateStr) {
        var raw = String(dateStr == null ? '' : dateStr);
        var p = raw.split('/');
        if (p.length < 3) return raw;
        var m = parseInt(p[1], 10);
        var d = parseInt(p[2], 10);
        if (!isFinite(m) || !isFinite(d)) return raw.slice(5);
        return m + '/' + d;
    }
    NW.schedDateLabel_ = schedDateLabel_;

    /**
     * 宿題・持ち物のセルを、1件1行の箇条書きにして返す。
     *
     * 週案の入力欄は3行のテキストエリアで、先生は持ち物を1件ずつ改行して書く。
     * これまでは escHtml しただけだったので改行が潰れ、「れんらくちょううわばきぞうきん」の
     * ように1行につながって出ていた。
     *
     * 中黒とぶら下げインデント・左詰めは inline style で入れる。CSS を連れていけない
     * Classroom への書き出しでも、箇条書きの形を保つため。
     *
     * @param {string} val セルの中身（改行区切り）
     * @return {string} 箇条書きのHTML。中身が無いときは空文字
     */
    function schedListCell_(val) {
        var lines = String(val == null ? '' : val).split(/\r\n|\r|\n/);
        var out = '';
        for (var i = 0; i < lines.length; i++) {
            // 先生がすでに「・」や「-」を付けている行は、中黒を二重にしない
            var body = lines[i].trim().replace(/^[・･·\-‐−–—●○◎※*＊]+\s*/, '').trim();
            if (!body) continue;
            out += '<div style="padding-left:0.9em;text-indent:-0.9em;">・' + escHtml(body) + '</div>';
        }
        return out;
    }
    NW.schedListCell_ = schedListCell_;

    // 箇条書きにして左詰めで出す行。ここに無い行はこれまでどおり中央ぞろえの1行
    var SCHED_LIST_FIELDS = ['homework', 'items'];

    // 表の左端の見出し。ひらがな表記の学年ではこちらを使う。
    // 教科名だけひらがなにして「1校時」「持ち物」が漢字のままだと、
    // 子どもには読めない行が混ざったままになる。
    var SCHED_LABEL_HIRAGANA = {
        '行事': 'ぎょうじ',
        '朝': 'あさ',
        '中休み': 'なかやすみ',
        '昼休み': 'ひるやすみ',
        '放課後': 'ほうかご',
        '宿題': 'しゅくだい',
        '持ち物': 'もちもの'
    };

    /**
     * 表の左端の見出しを、学年に応じた表記で返す。
     * 先生が名前を決めてあれば（custom。例: 宿題 → かだい）その字をそのまま使う。
     */
    function schedRowLabel_(kanji, custom) {
        if (custom && String(custom).trim()) return String(custom).trim();
        if (!schedUsesHiragana_()) return kanji;
        return SCHED_LABEL_HIRAGANA[kanji] || kanji;
    }
    NW.schedRowLabel_ = schedRowLabel_;

    /**
     * 校時の見出し。ひらがな表記の学年では「校時」ではなく、
     * 子どもが使う言い方の「1じかんめ」にする。
     * short（学級通信の形）のときは数字だけ。紙の通信は「1」「2」と書いている。
     */
    function schedPeriodLabel_(n, short) {
        if (short) return String(n);
        return schedUsesHiragana_() ? (n + 'じかんめ') : (n + '校時');
    }
    NW.schedPeriodLabel_ = schedPeriodLabel_;

    // 左端の列の幅。ひらがなは字数が増える（「なかやすみ」「1じかんめ」で5字）ので、
    // 漢字のときの 52px では溢れる。見出しは折り返さない（white-space:nowrap）ため、
    // 幅が足りないと列からはみ出したまま出る。
    // セルの左右余白 4px ずつを引いた中身の幅で、いちばん長い見出しが収まること。
    // tests/newsletter-schedule-block.test.mjs が実ブラウザで測って見張っている。
    var SCHED_LABEL_COL_W = { kanji: 52, hiragana: 76 };

    // 見出し帯の既定色（画面CSSの var(--primary) と同じ）。
    // ここは読み込み時の既定として使うだけなので、宣言がブロック生成より
    // 後ろにあっても（同じスクリプトスコープの var なので）先に評価済みになる。
    var SCHED_HEADER_COLOR_DEFAULT = '#1a73e8';

    /**
     * 見出し帯の上に載せる文字色を、帯の明るさから決める。
     * 白と濃い灰のうち、コントラスト比の高いほうを返す（WCAG の相対輝度で計算）。
     * 先生が選べる色は自由なので、白固定にすると薄い色を選んだ瞬間に読めなくなる。
     */
    function schedHeaderTextColor_(hex) {
        var m = /^#?([0-9a-fA-F]{6})$/.exec(String(hex == null ? '' : hex).trim());
        if (!m) return '#ffffff';
        var n = parseInt(m[1], 16);
        var lin = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) {
            var c = v / 255;
            return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        });
        var L = 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
        var vsWhite = 1.05 / (L + 0.05);
        var vsDark = (L + 0.05) / (0.0115 + 0.05); // #202124 の相対輝度
        return vsWhite >= vsDark ? '#ffffff' : '#202124';
    }
    NW.schedHeaderTextColor_ = schedHeaderTextColor_;

    // 日付の大きさの選択肢。px は span の inline style に入れる。
    // クラスだけにすると、CSS を連れていけない Classroom 書き出しで効かない。
    var SCHED_DATE_SIZES = [
        { key: 's', label: '小', px: 10 },
        { key: 'm', label: '中', px: 13 },
        { key: 'l', label: '大', px: 16 },
        { key: 'xl', label: '特大', px: 20 }
    ];

    function schedDateStyle_(key) {
        var hit = null;
        for (var i = 0; i < SCHED_DATE_SIZES.length; i++) {
            if (SCHED_DATE_SIZES[i].key === key) { hit = SCHED_DATE_SIZES[i]; break; }
        }
        // 知らない値（古い保存データ・手で書き替えたもの）は既定の「中」に落とす
        if (!hit) {
            for (var j = 0; j < SCHED_DATE_SIZES.length; j++) {
                if (SCHED_DATE_SIZES[j].key === 'm') { hit = SCHED_DATE_SIZES[j]; break; }
            }
        }
        return 'font-size:' + hit.px + 'px;' + (hit.px >= 16 ? 'font-weight:600;' : '');
    }

    // ---- 学級通信の形の表（tableStyle: 'letter'） ----
    // 先生が Google ドキュメントで作ってきた週予定の表を測った値。
    //   見出し帯は薄い青灰で1行（「10/19(げつ)」）、罫線は黒の細線、しま模様なし。
    //   左の見出しは数字だけ（1〜5）、教科 14pt・単元 8pt・宿題と持ち物 7.5pt。
    //   祝日や休みの日は列ごと灰色にし、名前を1字ずつ縦に入れる。
    //   空いているところは「−」。
    var SCHED_LETTER_HEADER_COLOR = '#d0e0e3';
    var SCHED_CLOSED_BG = '#b7b7b7';
    var SCHED_LETTER_SIZES = { subject: 14, sub: 8, list: 7.5, label: 14 };
    var SCHED_EMPTY_MARK = '−';

    /** 学級通信の形に切り替えるときに入れる設定（ほかの設定はそのまま残す） */
    function schedLetterDefaults_() {
        return {
            tableStyle: 'letter',
            showEvent: false,
            showRecess: false,
            showAfterSchool: false,
            showHomework: true,
            showItems: true,
            showMorning: true,
            closedDays: true,
            displayMode: 'subjectUnit',
            dateSize: 'l',
            headerColor: SCHED_LETTER_HEADER_COLOR,
            sizes: { subject: SCHED_LETTER_SIZES.subject, sub: SCHED_LETTER_SIZES.sub, list: SCHED_LETTER_SIZES.list, label: SCHED_LETTER_SIZES.label },
            rowHeight: 16
        };
    }
    NW.schedLetterDefaults_ = schedLetterDefaults_;

    /** 学級通信の形の文字の大きさを px で返す（設定は pt で持っている） */
    function schedLetterSizesPx_(opts) {
        var s = (opts && opts.sizes) || {};
        var out = {};
        for (var k in SCHED_LETTER_SIZES) {
            out[k] = nwPtToPx_(s[k] || SCHED_LETTER_SIZES[k]);
        }
        return out;
    }

    // 1年生の見出しの曜日。通信では「10/19(げつ)」のように書く
    var SCHED_DAY_HIRAGANA = { '月': 'げつ', '火': 'か', '水': 'すい', '木': 'もく', '金': 'きん', '土': 'ど', '日': 'にち' };

    /** 1行の見出し「10/19(げつ)」。ひらがな表記でない学年は「10/19(月)」 */
    function schedHeadLabel_(day) {
        var dl = String((day && day.dayLabel) || '');
        if (schedUsesHiragana_()) dl = SCHED_DAY_HIRAGANA[dl] || dl;
        return schedDateLabel_(day && day.date) + (dl ? '(' + dl + ')' : '');
    }
    NW.schedHeadLabel_ = schedHeadLabel_;

    /** その日に授業や行事が入っているか（土曜を表に入れるかの判断に使う） */
    function schedDayHasSchool_(day) {
        if (!day) return false;
        if (String(day.event || '').trim() || String(day.morning || '').trim()) return true;
        return (day.periods || []).some(function (p) { return p && String(p.subject || '').trim(); });
    }

    // 祝日の読み。内閣府の祝日一覧（07_WebApp.gs の fetchAndStoreHolidays）が使う名前。
    // 振替休日と国民の休日は、一覧では「休日」になっている。
    var SCHED_HOLIDAY_HIRAGANA = {
        '元日': 'がんじつ',
        '成人の日': 'せいじんのひ',
        '建国記念の日': 'けんこくきねんのひ',
        '天皇誕生日': 'てんのうたんじょうび',
        '春分の日': 'しゅんぶんのひ',
        '昭和の日': 'しょうわのひ',
        '憲法記念日': 'けんぽうきねんび',
        'みどりの日': 'みどりのひ',
        'こどもの日': 'こどものひ',
        '海の日': 'うみのひ',
        '山の日': 'やまのひ',
        '敬老の日': 'けいろうのひ',
        '秋分の日': 'しゅうぶんのひ',
        'スポーツの日': 'スポーツのひ',
        '文化の日': 'ぶんかのひ',
        '勤労感謝の日': 'きんろうかんしゃのひ',
        '休日': 'おやすみ'
    };

    /**
     * その日を「休みの日」として灰色にするなら、列に入れる名前を返す。休みでなければ空文字。
     *
     * 先生が決めた名前（override）があればそれを使う。空文字を決めてあれば休みにしない。
     * 決めていなければ、祝日の名前、または「授業が1つも無く行事だけ書いてある日」の行事名
     * （例: 振替休業日・都民の日）を使う。
     * @param {Object} day 週案の1日
     * @param {string=} override 先生が決めた名前（未設定は undefined）
     * @return {string}
     */
    function schedClosedLabel_(day, override) {
        if (override !== undefined && override !== null) return String(override).trim();
        if (!day) return '';
        if (String(day.holiday || '').trim()) return String(day.holiday).trim();
        var hasClass = (day.periods || []).some(function (p) { return p && String(p.subject || '').trim(); });
        if (!hasClass && !String(day.morning || '').trim() && String(day.event || '').trim()) {
            return String(day.event).replace(/\s+/g, '').trim();
        }
        return '';
    }
    NW.schedClosedLabel_ = schedClosedLabel_;

    /** 休みの名前を学年に合わせて書く。先生が書いた名前（auto でない）はそのまま */
    function schedClosedText_(label, auto) {
        if (!auto || !schedUsesHiragana_()) return label;
        return SCHED_HOLIDAY_HIRAGANA[label] || String(label).replace(/の日$/, 'のひ');
    }

    /**
     * 休みの名前を、表の行の数に合わせて1字ずつ縦に配る。
     * 字が少なければ上下のまん中に寄せ、多ければ1行に2字以上を入れる。
     * @param {string} label
     * @param {number} rows 表の行の数（見出しの行は除く）
     * @return {string[]} 行ごとの字（長さは rows）
     */
    function schedSpreadChars_(label, rows) {
        var n = Math.max(0, parseInt(rows, 10) || 0);
        var out = [];
        for (var i = 0; i < n; i++) out.push('');
        var chars = Array.from(String(label == null ? '' : label).replace(/\s+/g, ''));
        if (!chars.length || !n) return out;
        if (chars.length <= n) {
            var start = Math.floor((n - chars.length) / 2);
            chars.forEach(function (c, j) { out[start + j] = c; });
        } else {
            var per = Math.ceil(chars.length / n);
            for (var r = 0; r < n; r++) out[r] = chars.slice(r * per, (r + 1) * per).join('');
        }
        return out;
    }
    NW.schedSpreadChars_ = schedSpreadChars_;

    /**
     * 改行で区切った中身を、1行目は大きく・2行目からは小さく出す。
     * 朝の行（「学習」の下に「漢字テスト⑥」）や、自由テキストで書き替えた校時に使う。
     * 大きさは inline style で入れる（Classroom への書き出しは CSS を連れていけない）。
     */
    function schedLinesCell_(val, mainPx, subPx) {
        var lines = String(val == null ? '' : val).split(/\r\n|\r|\n/)
            .map(function (l) { return l.trim(); })
            .filter(function (l) { return l; });
        return lines.map(function (l, i) {
            var px = i === 0 ? mainPx : subPx;
            return px ? '<span style="font-size:' + px + 'px;">' + escHtml(l) + '</span>' : escHtml(l);
        }).join('<br>');
    }
    NW.schedLinesCell_ = schedLinesCell_;

    /** 左の見出しの列の幅（学級通信の形）。いちばん長い見出しが1行で収まる幅にする */
    function schedLetterLabelWidth_(labels, labelPx) {
        var longest = 1;
        (labels || []).forEach(function (l) {
            longest = Math.max(longest, Array.from(String(l || '')).length);
        });
        return Math.max(40, Math.ceil(longest * labelPx + 12));
    }

    // ---- Schedule table rendering (transposed: days=columns, periods=rows) ----
    NW.renderScheduleHTML = function (block) {
        var data = block.weekData || NW.scheduleData;
        if (!data || !data.days) {
            return '<div style="color:var(--text-hint);text-align:center;padding:16px;">'
                + '「予定を読込」をクリックして週案データを読み込んでください</div>';
        }
        var opts = block.options;
        var letter = opts.tableStyle === 'letter';
        // 学級通信の形では、授業や行事の入っている土曜（運動会など）は自動で列に入れる
        var showSat = opts.showSaturday || (letter && schedDayHasSchool_(data.days[5]));
        var days = data.days.slice(0, showSat ? 6 : 5);
        var bid = block.id;
        var rowLabels = opts.rowLabels || {};
        var sz = schedLetterSizesPx_(opts);
        // 学級通信の形のセル。罫線・地の色・中央寄せは inline で入れる
        // （画面CSSのしま模様と灰色の罫線に勝たせ、Classroom 書き出しでも同じ形にする）
        var letterTd = 'border:1px solid #000;background:#fff;vertical-align:middle;line-height:1.25;padding:2px 3px;';
        var rowH = (letter && opts.rowHeight) ? ' style="height:' + opts.rowHeight + 'mm;"' : '';

        var overrides = block.cellOverrides || {};
        // Helper: get cell content with override support
        function getCellVal(key, original) {
            return overrides.hasOwnProperty(key) ? overrides[key] : original;
        }

        // Helper: render cell content based on displayMode
        function cellContent(per) {
            if (!per || !per.subject) return '';
            var c = escHtml(subjectToHiragana(per.subject));
            if (opts.displayMode === 'subjectUnit' && per.unit) {
                c += '<br><span class="nw-sched-sub">' + escHtml(per.unit) + '</span>';
            } else if (opts.displayMode === 'full') {
                if (per.unit) c += '<br><span class="nw-sched-sub">' + escHtml(per.unit) + '</span>';
                if (per.content) c += '<br><span class="nw-sched-detail">' + escHtml(per.content) + '</span>';
            }
            return c;
        }

        // 学級通信の形の校時。教科を大きく、単元（と内容）を小さく下に添える
        function letterCellContent(per) {
            if (!per || !per.subject) return '';
            var c = '<span style="font-size:' + sz.subject + 'px;">' + escHtml(subjectToHiragana(per.subject)) + '</span>';
            var subs = [];
            if ((opts.displayMode === 'subjectUnit' || opts.displayMode === 'full') && per.unit) subs.push(per.unit);
            if (opts.displayMode === 'full' && per.content) subs.push(per.content);
            subs.forEach(function (s) {
                c += '<br><span class="nw-sched-sub" style="font-size:' + sz.sub + 'px;color:#202124;">' + escHtml(s) + '</span>';
            });
            return c;
        }

        // 休みの日（列ごと灰色）。名前が空なら休みにしない
        var closed = days.map(function (day, di) {
            if (!opts.closedDays) return '';
            var key = 'closed_' + di;
            var has = overrides.hasOwnProperty(key);
            var label = schedClosedLabel_(day, has ? overrides[key] : undefined);
            return label ? schedClosedText_(label, !has) : '';
        });

        // 行の並びは週案の時程どおりにする。
        // 行事／朝／1／2／中休み／3／4／昼休み／5／6／放課後／宿題／持ち物。
        // 以前は校時をまとめて出したあとに休み時間を並べていたので、
        // 中休みと昼休みが表のいちばん下に来てしまい、時程として読めなかった。
        // 休み時間は「校時が隠れていても本来の位置」に置く（時程は変わらないため）。
        var hiddenP = opts.hiddenPeriods || [];

        // 学級通信の形では、どの日にも授業の無い校時（1年生の6校時など）は出さない。
        // 週案がまだ空の週は、隠していない校時をそのまま出す（表が消えて見えないように）
        var periodShown = [0, 1, 2, 3, 4, 5].map(function (pp) {
            if (hiddenP.indexOf(pp + 1) >= 0) return false;
            if (!letter) return true;
            return days.some(function (day, di) {
                if (closed[di]) return false;
                var per = (day.periods || [])[pp];
                return overrides.hasOwnProperty('period_' + pp + '_' + di) || !!(per && per.subject);
            });
        });
        if (letter && !periodShown.some(Boolean)) {
            periodShown = [0, 1, 2, 3, 4, 5].map(function (pp) { return hiddenP.indexOf(pp + 1) < 0; });
        }

        // 休みの名前を縦に配るため、先に行の数を数えておく
        var rowCount = (opts.showEvent !== false ? 1 : 0) + (opts.showMorning ? 1 : 0)
            + periodShown.filter(Boolean).length
            + (opts.showRecess ? 2 : 0) + (opts.showAfterSchool ? 1 : 0)
            + (opts.showHomework ? 1 : 0) + (opts.showItems ? 1 : 0);
        var spread = closed.map(function (c) { return c ? schedSpreadChars_(c, rowCount) : null; });
        var rowIdx = 0;
        var closedPx = letter ? Math.round(sz.subject * 1.4) : 18;
        function closedTd(di) {
            return '<td class="nw-sched-closed" onclick="NW.editSchedCell(\'' + bid + '\',\'closed\',' + di + ')"'
                + ' style="background:' + SCHED_CLOSED_BG + ';color:#202124;text-align:center;vertical-align:middle;'
                + 'font-size:' + closedPx + 'px;font-weight:600;' + (letter ? 'border:1px solid #000;' : '')
                + '-webkit-print-color-adjust:exact;print-color-adjust:exact;">'
                + escHtml((spread[di] && spread[di][rowIdx]) || '') + '</td>';
        }

        // Header row: blank + day columns
        // 帯の色は inline style で入れる。CSS を連れていけない Classroom 書き出しでも
        // 効かせるため。print-color-adjust は、紙で「背景のグラフィック」を切っていても
        // 帯の色を出すため（色を選べる機能なのに紙で白くなると意味が無い）。
        var dateStyle = schedDateStyle_(opts.dateSize || 'm');
        var headBg = opts.headerColor || SCHED_HEADER_COLOR_DEFAULT;
        var headStyle = 'background:' + headBg + ';color:' + schedHeaderTextColor_(headBg)
            + ';-webkit-print-color-adjust:exact;print-color-adjust:exact;'
            + (letter ? 'border:1px solid #000;font-weight:400;' : '');
        var dateHtml = function (day) {
            return '<span class="nw-sched-date" style="' + dateStyle + '">'
                + escHtml(schedDateLabel_(day.date)) + '</span>';
        };
        // 幅は inline style で入れる。CSS を連れていけない Classroom 書き出しでも、
        // ひらがなの見出しが列から溢れないようにするため
        var labelColW = SCHED_LABEL_COL_W[schedUsesHiragana_() ? 'hiragana' : 'kanji'];
        if (letter) {
            var shownLabels = ['1'];
            if (opts.showEvent !== false) shownLabels.push(schedRowLabel_('行事', rowLabels.event));
            if (opts.showMorning) shownLabels.push(schedRowLabel_('朝', rowLabels.morning));
            if (opts.showRecess) shownLabels.push(schedRowLabel_('中休み', rowLabels.recess1), schedRowLabel_('昼休み', rowLabels.recess2));
            if (opts.showAfterSchool) shownLabels.push(schedRowLabel_('放課後', rowLabels.afterschool));
            if (opts.showHomework) shownLabels.push(schedRowLabel_('宿題', rowLabels.homework));
            if (opts.showItems) shownLabels.push(schedRowLabel_('持ち物', rowLabels.items));
            labelColW = schedLetterLabelWidth_(shownLabels, sz.label);
        }
        // 学級通信の形は列の幅をそろえる（Googleドキュメントへの書き出しでも同じ幅になるよう inline で）
        var html = '<table' + (letter ? ' style="width:100%;border-collapse:collapse;table-layout:fixed;"' : '')
            + '><thead><tr><th class="nw-sched-label-col" style="width:' + labelColW + 'px;'
            + headStyle + '"></th>';
        days.forEach(function (day, di) {
            // 見出しを押すと、その日を休みにする／やめるを選べる
            var thAttr = (opts.closedDays ? ' onclick="NW.editSchedCell(\'' + bid + '\',\'closed\',' + di + ')"' : '')
                + ' style="' + headStyle + (closed[di] ? 'background:' + SCHED_CLOSED_BG + ';color:#202124;' : '') + '"';
            if (letter) {
                html += '<th' + thAttr + '><span class="nw-sched-date" style="' + dateStyle + '">'
                    + escHtml(schedHeadLabel_(day)) + '</span></th>';
                return;
            }
            // 「日付を上に」を選ぶと日付と曜日が入れ替わる
            var top = opts.dateFirst ? dateHtml(day) : escHtml(day.dayLabel);
            var bottom = opts.dateFirst ? escHtml(day.dayLabel) : dateHtml(day);
            html += '<th' + thAttr + '>' + top + '<br>' + bottom + '</th>';
        });
        html += '</tr></thead><tbody>';

        // 1行ぶんの小さな行（休み時間・放課後・宿題・持ち物）
        function simpleRow(label, field) {
            var asList = SCHED_LIST_FIELDS.indexOf(field) >= 0;
            var row = '<tr><td class="nw-sched-label">' + escHtml(schedRowLabel_(label, rowLabels[field])) + '</td>';
            days.forEach(function (day, di) {
                if (closed[di]) { row += closedTd(di); return; }
                var val = getCellVal(field + '_' + di, day[field] || '');
                var click = ' onclick="NW.editSchedCell(\'' + bid + '\',\'' + field + '\',' + di + ')"';
                if (letter) {
                    // 紙の通信では、宿題も持ち物も1件1行を中央にそろえて小さく並べる
                    row += '<td class="nw-sched-small nw-sched-cell" style="' + letterTd + 'font-size:' + sz.list + 'px;"' + click + '>'
                        + (String(val).trim() ? schedLinesCell_(val) : SCHED_EMPTY_MARK) + '</td>';
                    return;
                }
                row += '<td class="nw-sched-small nw-sched-cell"' + (asList ? ' style="text-align:left;"' : '')
                    + click + '>' + (asList ? schedListCell_(val) : escHtml(val)) + '</td>';
            });
            rowIdx++;
            return row + '</tr>';
        }

        // 朝の行。1行目（読書・学習など）を大きく、2行目から（漢字テスト⑥など）を小さく
        function morningRow() {
            var row = '<tr' + rowH + '><td class="nw-sched-label">' + escHtml(schedRowLabel_('朝', rowLabels.morning)) + '</td>';
            days.forEach(function (day, di) {
                if (closed[di]) { row += closedTd(di); return; }
                var val = getCellVal('morning_' + di, day.morning || '');
                var body = String(val).trim()
                    ? (letter ? schedLinesCell_(val, sz.subject, sz.sub) : schedLinesCell_(val))
                    : (letter ? SCHED_EMPTY_MARK : '');
                row += '<td class="nw-sched-cell"' + (letter ? ' style="' + letterTd + '"' : '')
                    + ' onclick="NW.editSchedCell(\'' + bid + '\',\'morning\',' + di + ')">' + body + '</td>';
            });
            rowIdx++;
            return row + '</tr>';
        }

        // 校時の行。隠されている校時は出さない
        function periodRow(pp) {
            if (hiddenP.indexOf(pp + 1) >= 0) return '';
            if (!periodShown[pp]) return '';
            var row = '<tr' + rowH + '><td class="nw-sched-label">' + escHtml(schedPeriodLabel_(pp + 1, letter)) + '</td>';
            days.forEach(function (day, di) {
                if (closed[di]) { row += closedTd(di); return; }
                var per = (day.periods || [])[pp];
                var key = 'period_' + pp + '_' + di;
                var body;
                if (letter) {
                    body = overrides.hasOwnProperty(key) ? schedLinesCell_(overrides[key], sz.subject, sz.sub) : letterCellContent(per);
                    if (!body) body = SCHED_EMPTY_MARK;
                } else {
                    body = overrides.hasOwnProperty(key) ? escHtml(overrides[key]) : cellContent(per);
                }
                row += '<td class="nw-sched-cell"' + (letter ? ' style="' + letterTd + '"' : '')
                    + ' onclick="NW.editSchedCell(\'' + bid + '\',\'period\',' + di + ',' + pp + ')">'
                    + body + '</td>';
            });
            rowIdx++;
            return row + '</tr>';
        }

        if (opts.showEvent !== false) {
            html += '<tr><td class="nw-sched-label">' + escHtml(schedRowLabel_('行事', rowLabels.event)) + '</td>';
            days.forEach(function (day, di) {
                if (closed[di]) { html += closedTd(di); return; }
                var val = getCellVal('event_' + di, day.event || '');
                var ev = val ? '<span class="nw-sched-event">' + escHtml(val) + '</span>' : '';
                html += '<td class="nw-sched-cell"' + (letter ? ' style="' + letterTd + '"' : '')
                    + ' onclick="NW.editSchedCell(\'' + bid + '\',\'event\',' + di + ')">' + ev + '</td>';
            });
            html += '</tr>';
            rowIdx++;
        }
        if (opts.showMorning) html += morningRow();
        html += periodRow(0) + periodRow(1);
        if (opts.showRecess) html += simpleRow('中休み', 'recess1');
        html += periodRow(2) + periodRow(3);
        if (opts.showRecess) html += simpleRow('昼休み', 'recess2');
        html += periodRow(4) + periodRow(5);
        if (opts.showAfterSchool) html += simpleRow('放課後', 'afterschool');
        if (opts.showHomework) html += simpleRow('宿題', 'homework');
        if (opts.showItems) html += simpleRow('持ち物', 'items');

        html += '</tbody></table>';

        // 左の見出しのセルは、学級通信の形のときだけ白地・黒罫線・大きめの字にする。
        // 見出しのセルはどれも同じ書き出し（<td class="nw-sched-label">）なので、ここでまとめて足す。
        if (letter) {
            html = html.split('<td class="nw-sched-label">').join('<td class="nw-sched-label" style="'
                + 'background:#fff;color:#202124;font-weight:400;vertical-align:middle;border:1px solid #000;'
                + 'font-size:' + sz.label + 'px;">');
        }

        // Options panel
        html += '<div class="nw-schedule-options">';
        html += '<label>表の形: <select onchange="NW.setSchedStyle(\'' + bid + '\',this.value)">'
            + '<option value="app"' + (letter ? '' : ' selected') + '>アプリの形</option>'
            + '<option value="letter"' + (letter ? ' selected' : '') + '>学級通信の形（紙）</option>'
            + '</select></label>'
            + '<span style="color:var(--border);">|</span>';
        // Period visibility
        html += '<span style="font-size:0.72rem;font-weight:600;color:var(--text-sub);">校時:</span>';
        for (var pi = 1; pi <= 6; pi++) {
            var checked = hiddenP.indexOf(pi) < 0;
            html += '<label><input type="checkbox"' + (checked ? ' checked' : '') + ' onchange="NW.toggleSchedPeriod(\'' + bid + '\',' + pi + ',this.checked)"> ' + pi + '</label>';
        }
        html += '<span style="color:var(--border);">|</span>'
            + '<label><input type="checkbox"' + (opts.showEvent !== false ? ' checked' : '') + ' onchange="NW.toggleSchedOpt(\'' + bid + '\',\'showEvent\',this.checked)"> 行事</label>'
            + '<label><input type="checkbox"' + (opts.showMorning ? ' checked' : '') + ' onchange="NW.toggleSchedOpt(\'' + bid + '\',\'showMorning\',this.checked)"> 朝</label>'
            + '<label><input type="checkbox"' + (opts.showRecess ? ' checked' : '') + ' onchange="NW.toggleSchedOpt(\'' + bid + '\',\'showRecess\',this.checked)"> 休み時間</label>'
            + '<label><input type="checkbox"' + (opts.showAfterSchool ? ' checked' : '') + ' onchange="NW.toggleSchedOpt(\'' + bid + '\',\'showAfterSchool\',this.checked)"> 放課後</label>'
            + '<label><input type="checkbox"' + (opts.showHomework ? ' checked' : '') + ' onchange="NW.toggleSchedOpt(\'' + bid + '\',\'showHomework\',this.checked)"> 宿題</label>'
            + '<label><input type="checkbox"' + (opts.showItems ? ' checked' : '') + ' onchange="NW.toggleSchedOpt(\'' + bid + '\',\'showItems\',this.checked)"> 持ち物</label>'
            + '<label><input type="checkbox"' + (opts.showSaturday ? ' checked' : '') + ' onchange="NW.toggleSchedOpt(\'' + bid + '\',\'showSaturday\',this.checked)"> 土曜日</label>'
            + '<label><input type="checkbox"' + (opts.closedDays ? ' checked' : '') + ' onchange="NW.toggleSchedOpt(\'' + bid + '\',\'closedDays\',this.checked)"> 休みの日を灰色に</label>'
            + '<button type="button" class="nw-sched-color-reset" onclick="NW.editSchedLabels(\'' + bid + '\')">見出しの名前</button>'
            + '<span style="color:var(--border);">|</span>'
            + '<label>日付の大きさ: <select onchange="NW.setSchedDateSize(\'' + bid + '\',this.value)">'
            + SCHED_DATE_SIZES.map(function (sz) {
                return '<option value="' + sz.key + '"' + ((opts.dateSize || 'm') === sz.key ? ' selected' : '') + '>' + sz.label + '</option>';
            }).join('')
            + '</select></label>'
            + (letter ? '' : '<label><input type="checkbox"' + (opts.dateFirst ? ' checked' : '') + ' onchange="NW.toggleSchedOpt(\'' + bid + '\',\'dateFirst\',this.checked)"> 日付を上に</label>')
            + '<label>見出しの色: <input type="color" class="nw-sched-color" value="' + headBg + '" onchange="NW.setSchedHeaderColor(\'' + bid + '\',this.value)"></label>'
            + '<button type="button" class="nw-sched-color-reset" onclick="NW.setSchedHeaderColor(\'' + bid + '\',null)">既定の色</button>'
            + '<span style="color:var(--border);">|</span>'
            + '<label><input type="radio" name="sm_' + bid + '" value="subject"' + (opts.displayMode === 'subject' ? ' checked' : '') + ' onchange="NW.setSchedMode(\'' + bid + '\',\'subject\')"> 教科のみ</label>'
            + '<label><input type="radio" name="sm_' + bid + '" value="subjectUnit"' + (opts.displayMode === 'subjectUnit' ? ' checked' : '') + ' onchange="NW.setSchedMode(\'' + bid + '\',\'subjectUnit\')"> 教科+単元</label>'
            + '<label><input type="radio" name="sm_' + bid + '" value="full"' + (opts.displayMode === 'full' ? ' checked' : '') + ' onchange="NW.setSchedMode(\'' + bid + '\',\'full\')"> 詳細</label>';
        if (letter) {
            // 文字の大きさは pt で選ぶ（Googleドキュメントと同じ単位）
            var ptChoices = [6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10, 10.5, 11, 12, 13, 14, 15, 16, 18, 20];
            var cur = (opts.sizes || {});
            html += '<span style="color:var(--border);">|</span>'
                + '<span style="font-size:0.72rem;font-weight:600;color:var(--text-sub);">文字(pt):</span>';
            [['subject', '教科'], ['sub', '単元'], ['list', '宿題・持ち物'], ['label', '左の見出し']].forEach(function (kv) {
                var v = cur[kv[0]] || SCHED_LETTER_SIZES[kv[0]];
                var list = ptChoices.indexOf(v) < 0 ? ptChoices.concat([v]).sort(function (a, b) { return a - b; }) : ptChoices;
                html += '<label>' + kv[1] + ' <select onchange="NW.setSchedSize(\'' + bid + '\',\'' + kv[0] + '\',this.value)">'
                    + list.map(function (p) { return '<option value="' + p + '"' + (p === v ? ' selected' : '') + '>' + p + '</option>'; }).join('')
                    + '</select></label>';
            });
            html += '<label>行の高さ <select onchange="NW.setSchedRowHeight(\'' + bid + '\',this.value)">'
                + [0, 10, 12, 14, 16, 18, 20].map(function (mm) {
                    return '<option value="' + mm + '"' + ((opts.rowHeight || 0) === mm ? ' selected' : '') + '>' + (mm ? mm + 'mm' : '自動') + '</option>';
                }).join('')
                + '</select></label>';
        }
        html += '</div>';
        return html;
    };

    // ---- Block property setters ----
    /** 描き直したあとも、そのブロックを選んだまま（ツールバーを出したまま）にする */
    NW._rerenderKeep_ = function (id) {
        NW.render();
        var el = document.querySelector('[data-block-id="' + id + '"]');
        if (el) el.classList.add('nw-block-selected');
    };

    /** ブロックの欄を1つ変えて描き直す（題字の幅・書体など） */
    NW.setBlockProp = function (id, prop, value) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        NW.pushHistory();
        NW.saveEditable();
        block[prop] = value;
        NW._rerenderKeep_(id);
    };

    /** 既定が「入」の切り替え（記事の下線・番号）を反転する */
    NW.toggleBlockFlag = function (id, prop) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        NW.setBlockProp(id, prop, block[prop] === false);
    };

    /** 文字の大きさを pt で決める。中身は px で持つ */
    NW.setSizePt = function (id, prop, pt) {
        NW.setBlockProp(id, prop, nwPtToPx_(pt));
    };

    /** 文字の大きさを一覧の1つ上（dir=1）／下（dir=-1）へ */
    NW.stepSizePt = function (id, prop, dir) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        var cur = nwPxToPt_(block[prop]);
        var next = cur;
        if (dir > 0) {
            for (var i = 0; i < NW_PT_SIZES.length; i++) { if (NW_PT_SIZES[i] > cur) { next = NW_PT_SIZES[i]; break; } }
        } else {
            for (var j = NW_PT_SIZES.length - 1; j >= 0; j--) { if (NW_PT_SIZES[j] < cur) { next = NW_PT_SIZES[j]; break; } }
        }
        if (next !== cur) NW.setSizePt(id, prop, next);
    };

    /** 数字を全角にする（通信の日付・番号は全角で書いている） */
    function nwZenkakuDigits_(v) {
        return String(v).replace(/[0-9]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 0xFEE0); });
    }

    /**
     * 発行日の既定。対象週の月曜（"YYYY/MM/DD"）の前の金曜日。
     * 通信は前の週の金曜に出し、翌週の予定を知らせているため。
     * @return {Date|null}
     */
    function nwIssueDate_(mondayStr) {
        var p = String(mondayStr == null ? '' : mondayStr).split('/');
        if (p.length < 3) return null;
        var d = new Date(+p[0], +p[1] - 1, +p[2]);
        if (isNaN(d.getTime())) return null;
        d.setDate(d.getDate() - 3);
        return d;
    }

    /** 「令和８年１０月１７日」の形（数字は全角）。令和より前の日付は西暦で書く */
    function nwWarekiDate_(d) {
        if (!(d instanceof Date) || isNaN(d.getTime())) return '';
        var y = d.getFullYear();
        var m = d.getMonth() + 1;
        var day = d.getDate();
        if (y < 2019 || (y === 2019 && m < 5)) {
            return nwZenkakuDigits_(y) + '年' + nwZenkakuDigits_(m) + '月' + nwZenkakuDigits_(day) + '日';
        }
        var ry = y - 2018;
        return '令和' + (ry === 1 ? '元' : nwZenkakuDigits_(ry)) + '年' + nwZenkakuDigits_(m) + '月' + nwZenkakuDigits_(day) + '日';
    }
    NW.nwWarekiDate_ = nwWarekiDate_;
    NW.nwIssueDate_ = nwIssueDate_;

    /** 題字ブロックの発行日。先生が書き替えていなければ週から決める */
    NW.mastheadDate_ = function (block) {
        if (block.dateAuto === false && block.dateText) return block.dateText;
        return nwWarekiDate_(nwIssueDate_(NW.mondayStr || (typeof STATE !== 'undefined' ? STATE.mondayStr : '')));
    };

    /**
     * 発行日の欄が書き替えられたら覚える。空にするか自動の日付と同じなら、自動にもどす。
     * renderedAuto は描いたときの自動の日付。字がそのままなら書き替えていないので何もしない
     * （週を切り替えると自動の日付が変わるため、今の自動の日付とは比べられない）。
     */
    NW.setMastheadDate_ = function (block, text, renderedAuto) {
        var t = String(text == null ? '' : text).trim();
        if (renderedAuto && t === renderedAuto) return;
        var auto = nwWarekiDate_(nwIssueDate_(NW.mondayStr || (typeof STATE !== 'undefined' ? STATE.mondayStr : '')));
        if (!t || t === auto) { block.dateAuto = true; block.dateText = ''; }
        else { block.dateAuto = false; block.dateText = t; }
    };

    /**
     * 題字ブロックの文字を覚えておく（次の通信を作るときに入れ直さずに済むように）。
     * 画像は入れない。端末に写真を残さない約束（stripImagesForLocalSave_）と同じ扱い。
     */
    NW.saveMastheadMemory_ = function (b) {
        try {
            localStorage.setItem('nw_masthead_v1', JSON.stringify({
                kicker: b.kicker || '', title: b.title || '', info: b.info || '',
                titleSize: b.titleSize, infoSize: b.infoSize, logoWidth: b.logoWidth
            }));
        } catch (e) { }
    };

    NW.loadMastheadMemory_ = function () {
        try {
            var v = JSON.parse(localStorage.getItem('nw_masthead_v1') || '{}');
            return (v && typeof v === 'object') ? v : {};
        } catch (e) { return {}; }
    };

    /** 記事の番号「１．」。番号を付ける記事だけを上から数える */
    NW.articleNumber_ = function (id) {
        var n = 0;
        for (var i = 0; i < NW.blocks.length; i++) {
            var b = NW.blocks[i];
            if (b.type === 'article' && b.numbered !== false) n++;
            if (b.id === id) break;
        }
        return nwZenkakuDigits_(n) + '．';
    };

    NW.setFontSize = function (id, size) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        block.fontSize = parseFloat(size);
        var el = document.querySelector('[data-block-id="' + id + '"] [contenteditable]');
        if (el) el.style.fontSize = block.fontSize + 'px';
    };

    NW.setFontFamily = function (id, family) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        block.fontFamily = family;
        var el = document.querySelector('[data-block-id="' + id + '"] [contenteditable]');
        if (el) el.style.fontFamily = family || 'inherit';
    };

    NW.toggleBold = function (id) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        block.bold = !block.bold;
        NW.saveEditable();
        NW.render();
    };

    NW.setAlign = function (id, align) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        block.align = align;
        var el = document.querySelector('[data-block-id="' + id + '"] [contenteditable]');
        if (el) el.style.textAlign = align;
        // Update active state of align buttons
        var acts = document.querySelector('[data-block-id="' + id + '"] .nw-fmt-toolbar');
        if (acts) {
            acts.querySelectorAll('button[title*="揃え"], button[title="中央"]').forEach(function (btn) { btn.classList.remove('nw-active'); });
            var titles = { left: '左揃え', center: '中央', right: '右揃え' };
            var activeBtn = acts.querySelector('button[title="' + titles[align] + '"]');
            if (activeBtn) activeBtn.classList.add('nw-active');
        }
    };

    NW.setFloat = function (id, val) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block || block.type !== 'image') return;
        NW.saveEditable();
        block.float = val;
        NW.render();
    };

    NW.setWrapAlign = function (id, align) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block || block.type !== 'image') return;
        block.wrapAlign = align;
        var el = document.querySelector('[data-block-id="' + id + '"] .nw-float-text-side');
        if (el) el.style.textAlign = align;
        // Update active state of buttons
        var acts = document.querySelector('[data-block-id="' + id + '"] .nw-block-actions');
        if (acts) {
            acts.querySelectorAll('.nw-fmt-toolbar:nth-child(2) button').forEach(function (btn) { btn.classList.remove('nw-active'); });
            var titles = { left: '左揃え', center: '中央', right: '右揃え' };
            var activeBtn = acts.querySelector('.nw-fmt-toolbar:nth-child(2) button[title="' + titles[align] + '"]');
            if (activeBtn) activeBtn.classList.add('nw-active');
        }
    };

    NW.setWrapFontSize = function (id, size) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block || block.type !== 'image') return;
        block.wrapFontSize = parseFloat(size);
        var el = document.querySelector('[data-block-id="' + id + '"] .nw-float-text-side');
        if (el) el.style.fontSize = block.wrapFontSize + 'px';
    };

    NW.setWrapFontFamily = function (id, family) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block || block.type !== 'image') return;
        block.wrapFontFamily = family;
        var el = document.querySelector('[data-block-id="' + id + '"] .nw-float-text-side');
        if (el) el.style.fontFamily = family || 'inherit';
    };

    NW.toggleWrapBold = function (id) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block || block.type !== 'image') return;
        NW.saveEditable();
        block.wrapBold = !block.wrapBold;
        NW.render();
    };

    NW.setImageWidth = function (id, w) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block || block.type !== 'image') return;
        block.width = parseInt(w, 10);
        var el = document.querySelector('[data-block-id="' + id + '"] .nw-float-img-side');
        if (el) { el.style.width = block.width + '%'; return; }
        var img = document.querySelector('[data-block-id="' + id + '"] img');
        if (img) img.style.width = block.width + '%';
    };

    NW.toggleSchedOpt = function (id, key, val) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        block.options[key] = val;
        var el = document.querySelector('[data-block-id="' + id + '"] .nw-schedule-block');
        if (el) el.innerHTML = NW.renderScheduleHTML(block);
    };

    NW.setSchedHeaderColor = function (id, color) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        // null を渡すと既定の青に戻す（色ピッカーからは元の値へ戻しにくいため）
        block.options.headerColor = color || SCHED_HEADER_COLOR_DEFAULT;
        var el = document.querySelector('[data-block-id="' + id + '"] .nw-schedule-block');
        if (el) el.innerHTML = NW.renderScheduleHTML(block);
    };

    NW.setSchedDateSize = function (id, size) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        block.options.dateSize = size;
        var el = document.querySelector('[data-block-id="' + id + '"] .nw-schedule-block');
        if (el) el.innerHTML = NW.renderScheduleHTML(block);
    };

    NW.setSchedMode = function (id, mode) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        block.options.displayMode = mode;
        var el = document.querySelector('[data-block-id="' + id + '"] .nw-schedule-block');
        if (el) el.innerHTML = NW.renderScheduleHTML(block);
    };

    NW.toggleSchedPeriod = function (id, period, show) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        var hp = block.options.hiddenPeriods || [];
        if (show) {
            hp = hp.filter(function (p) { return p !== period; });
        } else {
            if (hp.indexOf(period) < 0) hp.push(period);
        }
        block.options.hiddenPeriods = hp;
        var el = document.querySelector('[data-block-id="' + id + '"] .nw-schedule-block');
        if (el) el.innerHTML = NW.renderScheduleHTML(block);
    };

    /** 時間割ブロックの表だけを描き直す（ブロックの選択やツールバーはそのまま） */
    NW.refreshSchedule_ = function (id) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        var el = document.querySelector('[data-block-id="' + id + '"] .nw-schedule-block');
        if (block && el) el.innerHTML = NW.renderScheduleHTML(block);
    };

    /**
     * 表の形を切り替える。学級通信の形にするときは、紙の通信で使っている
     * 行・大きさ・色をまとめて入れる（校時の出し分けと見出しの名前は残す）。
     */
    NW.setSchedStyle = function (id, style) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        NW.pushHistory();
        if (style === 'letter') {
            var d = schedLetterDefaults_();
            for (var k in d) block.options[k] = d[k];
        } else {
            block.options.tableStyle = 'app';
            block.options.dateSize = 'm';
            block.options.headerColor = SCHED_HEADER_COLOR_DEFAULT;
        }
        NW.refreshSchedule_(id);
    };

    /** 学級通信の形の文字の大きさ（pt）を変える。key は subject / sub / list / label */
    NW.setSchedSize = function (id, key, pt) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block || !SCHED_LETTER_SIZES.hasOwnProperty(key)) return;
        var v = parseFloat(pt);
        if (!isFinite(v) || v <= 0) return;
        NW.pushHistory();
        var sizes = {};
        for (var k in SCHED_LETTER_SIZES) sizes[k] = (block.options.sizes && block.options.sizes[k]) || SCHED_LETTER_SIZES[k];
        sizes[key] = v;
        block.options.sizes = sizes;
        NW.refreshSchedule_(id);
    };

    /** 校時・朝の行の高さ（mm）。0 は中身に合わせる */
    NW.setSchedRowHeight = function (id, mm) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        NW.pushHistory();
        block.options.rowHeight = Math.max(0, parseInt(mm, 10) || 0);
        NW.refreshSchedule_(id);
    };

    // 左の見出しの名前を変えられる行。キーは週案のデータの欄の名前
    var SCHED_RENAMEABLE_ROWS = [
        ['event', '行事'], ['morning', '朝'], ['recess1', '中休み'], ['recess2', '昼休み'],
        ['afterschool', '放課後'], ['homework', '宿題'], ['items', '持ち物']
    ];

    /** 先生が決めた見出しの名前を読む（次に作る表にも引きつぐため） */
    NW.loadSchedLabels_ = function () {
        try {
            var v = JSON.parse(localStorage.getItem('nw_sched_labels_v1') || '{}');
            return (v && typeof v === 'object') ? v : {};
        } catch (e) { return {}; }
    };

    /** 左の見出しの名前を変える（例: 宿題 → かだい）。空にすると既定の名前に戻る */
    NW.editSchedLabels = function (id) {
        var block = NW.blocks.find(function (b) { return b.id === id; });
        if (!block) return;
        var cur = block.options.rowLabels || {};
        var html = '<div style="text-align:left;font-size:0.85rem;">'
            + '<p style="color:var(--text-sub);margin:0 0 8px;">空のままにすると、ふだんの名前で出ます。ここで決めた名前は次に作る表にも使います。</p>';
        SCHED_RENAMEABLE_ROWS.forEach(function (kv) {
            html += '<label style="display:flex;align-items:center;gap:8px;margin:4px 0;">'
                + '<span style="width:5em;">' + escHtml(kv[1]) + '</span>'
                + '<input id="swalRowLabel_' + kv[0] + '" class="swal2-input" style="margin:0;flex:1;height:2.4em;" '
                + 'placeholder="' + escHtml(schedRowLabel_(kv[1])) + '" value="' + escHtml(cur[kv[0]] || '') + '"></label>';
        });
        html += '</div>';
        Swal.fire({
            title: '見出しの名前',
            html: html,
            showCancelButton: true,
            confirmButtonText: '決める',
            cancelButtonText: 'キャンセル',
            preConfirm: function () {
                var out = {};
                SCHED_RENAMEABLE_ROWS.forEach(function (kv) {

                    if (v) out[kv[0]] = v;
                });
                return out;
            }
        }).then(function (result) {
            if (!result.isConfirmed) return;
            NW.pushHistory();
