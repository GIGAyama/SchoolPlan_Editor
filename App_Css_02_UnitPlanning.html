<style>
    /* ===== 進捗つき単元ピッカー ===== */
    .up-picker {
        text-align: left;
    }

    .up-picker #upSearch {
        margin-bottom: 6px;
    }

    .up-count {
        font-size: 0.72rem;
        color: var(--text-sub);
        margin-bottom: 4px;
    }

    .up-list {
        max-height: 260px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
    }

    .up-list-done {
        margin-top: 4px;
    }

    .up-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.15s;
    }

    .up-item-body {
        flex: 1;
        min-width: 0;
    }

    .up-item:last-child {
        border-bottom: none;
    }

    .up-item:hover {
        background: var(--bg-hover, var(--surface-hover));
    }

    .up-item.up-hidden {
        display: none;
    }

    .up-item-done {
        opacity: 0.55;
    }

    .up-item-next {
        background: var(--primary-bg, rgba(26, 115, 232, 0.08));
    }

    .up-item-main {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }

    .up-item-sub {
        margin-top: 3px;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }

    .up-hours {
        color: var(--text-sub);
        font-size: 0.8rem;
    }

    .up-next-tag {
        background: var(--primary, #1a73e8);
        color: #fff;
        font-size: 0.66rem;
        padding: 1px 6px;
        border-radius: 10px;
    }

    .up-badge {
        font-size: 0.68rem;
        padding: 1px 6px;
        border-radius: 10px;
        border: 1px solid transparent;
    }

    .up-badge-done {
        background: var(--surface-hover, #eee);
        color: var(--text-sub);
    }

    .up-badge-progress {
        background: rgba(26, 115, 232, 0.12);
        color: var(--primary, #1a73e8);
    }

    .up-badge-new {
        background: rgba(52, 168, 83, 0.12);
        color: #1e8e3e;
    }

    /* 「指導しない（全0時間）」。指導し終えた単元と見分けがつくようにする。
       ダイアログの地は SweetAlert2 が常に白なので、白地で読める色を直に置く。 */
    .up-badge-skipped {
        background: rgba(128, 128, 128, 0.14);
        color: #5f6368;
        border-color: rgba(128, 128, 128, 0.35);
    }

    .up-note {
        font-size: 0.66rem;
        color: var(--warning, #e65100);
    }

    /* 「◯時間で終了」。行そのものをクリックすると単元を入力してしまうので、
       押し間違えないよう控えめな見た目にし、行の右端へ寄せる。
       ダイアログの地色は SweetAlert2 が持っていて表示テーマに追従しない。
       面の色を --surface で塗ると手動ダークで白地に黒のボタンになるため、
       ここは地を透かして文字色も継承する。 */
    .up-close-btn {
        margin-left: auto;
        font-size: 0.68rem;
        padding: 1px 8px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        opacity: 0.75;
        /* 指の入る大きさを確保する（タブレットで隣の行を押さないため） */
        min-height: 26px;
    }

    .up-close-btn:hover {
        opacity: 1;
        background: rgba(128, 128, 128, 0.12);
    }

    .up-close-note {
        margin-top: 8px;
        font-size: 0.8rem;
        color: inherit;
        opacity: 0.8;
        text-align: left;
        line-height: 1.6;
    }

    .up-close-list {
        text-align: left;
        margin: 0 0 4px;
        padding-left: 1.2em;
        font-size: 0.86rem;
        line-height: 1.8;
        /* 一度に何十単元も終了にできる。全部並べて画面からはみ出すより、
           畳んで中で送れるようにする。 */
        max-height: 220px;
        overflow-y: auto;
    }

    /* ===== まとめて終了にする ===== */
    .up-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }

    /* まとめ操作の入口。押すまでは一覧の邪魔をしないよう控えめに置く。 */
    .up-bulk-enter {
        background: transparent;
        color: inherit;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 10px;
        font-size: 0.72rem;
        cursor: pointer;
        /* 指の入る大きさを確保する（タブレットで検索欄を押さないため） */
        min-height: 30px;
        white-space: nowrap;
    }

    .up-bulk-enter:hover {
        background: rgba(128, 128, 128, 0.12);
    }

    /* まとめ操作に入ったら入口は用済み。「やめる」は下のバーにある。 */
    .up-bulk-on .up-bulk-enter {
        display: none;
    }

    /* 選択のしるし。まとめ操作に入るまでは場所を取らない。 */
    .up-check {
        display: none;
        flex: 0 0 auto;
        inline-size: 20px;
        block-size: 20px;
        margin-top: 2px;
        border: 2px solid var(--border);
        border-radius: 4px;
    }

    .up-bulk-on .up-check {
        display: block;
    }

    /* 指導済み・「指導しない」の行は選べない。空の枠を出すと押せそうに見える。 */
    .up-bulk-on .up-check-off {
        border-color: transparent;
    }

    .up-bulk-on .up-item:not([data-closable]) {
        cursor: default;
        opacity: 0.4;
    }

    /* まとめ操作の最中は行ごとの「◯時間で終了」を隠す。
       押すつもりの無い1件だけが終了になる事故を防ぐ。 */
    .up-bulk-on .up-close-btn {
        display: none;
    }

    .up-item-picked {
        background: rgba(26, 115, 232, 0.10);
    }

    .up-item-picked .up-check {
        background: var(--primary, #1a73e8);
        border-color: var(--primary, #1a73e8);
        /* ✓ は文字を置かずに枠線で描く（フォントに依らない） */
        position: relative;
    }

    .up-item-picked .up-check::after {
        content: '';
        position: absolute;
        inset-inline-start: 5px;
        inset-block-start: 1px;
        inline-size: 5px;
        block-size: 10px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    .up-bulk-hint,
    .up-bulkbar {
        display: none;
    }

    .up-bulk-on .up-bulk-hint {
        display: block;
        font-size: 0.74rem;
        line-height: 1.6;
        margin-bottom: 6px;
        color: inherit;
        opacity: 0.85;
    }

    .up-bulk-on .up-bulkbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
    }

    .up-bulk-sub {
        background: transparent;
        color: inherit;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 0.74rem;
        cursor: pointer;
        /* 指の入る大きさ。並んだボタンを押し間違えると全学級に効く操作になる。 */
        min-height: 44px;
    }

    .up-bulk-sub:hover {
        background: rgba(128, 128, 128, 0.12);
    }

    .up-bulk-run {
        flex: 1;
        min-width: 180px;
        min-height: 44px;
        background: var(--primary, #1a73e8);
        color: #fff;
        border: 1px solid var(--primary, #1a73e8);
        border-radius: 6px;
        padding: 4px 12px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
    }

    .up-bulk-run:disabled {
        background: #9aa0a6;
        border-color: #9aa0a6;
        cursor: not-allowed;
    }

    .up-toggle-done {
        margin-top: 6px;
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 0.74rem;
        cursor: pointer;
        color: var(--text-sub);
        width: 100%;
    }

    .up-empty,
    .up-orphan-note {
        font-size: 0.72rem;
        color: var(--text-hint);
        padding: 10px 4px;
    }

    .up-orphan-note {
        /* 面の色（--warning: #fbbc04）は白地で 2:1 しかなく、2行の説明文が読めなかった。
           ここでトークン（--warning-text）を使わないのは、SweetAlert2 のダイアログが
           `.swal2-popup{background:#fff}` で**表示テーマに関わらず常に白**だから。
           ダークのトークン（#fdd663）を持ってくると白地で読めなくなる。 */
        color: #a34700;
        text-align: left;
        line-height: 1.7;
    }

    /* ===== 単元マスタ整合性チェック ===== */
    .umc-wrap {
        text-align: left;
        font-size: 0.82rem;
    }

    .umc-ok {
        padding: 20px;
        text-align: center;
        color: var(--text-sub);
    }

    .umc-list {
        max-height: 320px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
    }

    .umc-item {
        display: flex;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        align-items: flex-start;
    }

    .umc-item:last-child {
        border-bottom: none;
    }

    .umc-item-body {
        display: flex;
        flex-direction: column;
        gap: 3px;
        flex: 1;
        min-width: 0;
    }

    .umc-item-title {
        font-weight: 600;
    }

    .umc-rows {
        font-weight: 400;
        color: var(--text-sub);
        font-size: 0.76rem;
    }

    .umc-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
    }

    .umc-badge {
        font-size: 0.68rem;
        padding: 1px 6px;
        border-radius: 10px;
        background: rgba(26, 115, 232, 0.12);
        color: var(--primary, #1a73e8);
    }

    .umc-badge-warn {
        background: rgba(230, 81, 0, 0.14);
        color: var(--warning, #e65100);
    }

    .umc-plan {
        font-size: 0.72rem;
        color: var(--text-sub);
    }

    .umc-totals,
    .umc-orphans {
        margin-bottom: 10px;
    }

    .umc-totals summary,
    .umc-orphans summary {
        cursor: pointer;
        font-size: 0.78rem;
        color: var(--text-sub);
        padding: 4px 0;
    }

    .umc-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.76rem;
        margin-top: 6px;
    }

    .umc-table th,
    .umc-table td {
        border: 1px solid var(--border);
        padding: 3px 6px;
    }

    .umc-table .umc-num {
        text-align: right;
    }

    .umc-over {
        color: var(--warning, #e65100);
    }

    .umc-under {
        color: var(--danger, #d93025);
    }

    .umc-hint {
        font-size: 0.72rem;
        color: var(--text-hint);
        margin: 6px 0 0;
    }

    /* ===== 単元の時数再構成（プレビューの拡張） ===== */
    .um-btn-ai {
        color: var(--primary, #1a73e8);
    }

    .pdf-unit-name-fixed {
        font-weight: 600;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .pdf-hour-locked {
        color: var(--text-hint);
    }

    .pdf-hour-readonly {
        background: var(--surface-hover, #f1f3f4);
        color: var(--text-sub);
        cursor: not-allowed;
    }

    /* ===== 年間再配分 ===== */
    .umr-wrap {
        text-align: left;
        font-size: 0.82rem;
    }

    .umr-summary {
        background: var(--surface-hover, #f1f3f4);
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 8px;
        line-height: 1.6;
    }

    .umr-warn {
        color: var(--warning, #e65100);
        font-size: 0.76rem;
        margin-bottom: 8px;
        line-height: 1.5;
    }

    .umr-source {
        font-size: 0.72rem;
        color: var(--text-hint);
        margin-bottom: 4px;
    }

    .umr-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.78rem;
    }

    .umr-table th,
    .umr-table td {
        border: 1px solid var(--border);
        padding: 4px 6px;
    }

    .umr-table .umr-num {
        text-align: right;
        white-space: nowrap;
    }

    .umr-table .umr-reason {
        color: var(--text-sub);
        font-size: 0.72rem;
    }

    .umr-changed {
        background: rgba(26, 115, 232, 0.06);
    }

    .umr-up {
        color: #1e8e3e;
    }

    .umr-down {
        color: var(--danger, #d93025);
    }

    .umr-note {
        font-size: 0.72rem;
        color: var(--text-hint);
        margin: 8px 0 0;
        line-height: 1.5;
    }

    .hours-realloc-btn {
        white-space: nowrap;
        padding: 2px 8px;
        font-size: 0.72rem;
    }
</style>
