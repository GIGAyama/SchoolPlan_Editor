<style>
    /* ===== 進捗つき単元ピッカー ===== */

    }

    }

    .up-count {

        gap: 6px;
        flex-wrap: wrap;
    }

    .up-item-sub {
        margin-top: 3px;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }

    .up-hours {
        color: var(--text-sub);
        font-size: 0.8rem;
    }

    .up-next-tag {
        background: var(--primary, #1a73e8);
        color: #fff;
        font-size: 0.66rem;
        padding: 1px 6px;
        border-radius: 10px;
    }

    .up-badge {
        font-size: 0.68rem;
        padding: 1px 6px;
        border-radius: 10px;
        border: 1px solid transparent;

        background: var(--surface-hover, #eee);
        color: var(--text-sub);
    }

    .up-badge-progress {
        background: rgba(26, 115, 232, 0.12);
        color: var(--primary, #1a73e8);
    }

    .up-badge-new {
        background: rgba(52, 168, 83, 0.12);
        color: #1e8e3e;
    }

    .up-note {
        font-size: 0.66rem;
        color: var(--warning, #e65100);
    }

    /* 「◯時間で終了」。行そのものをクリックすると単元を入力してしまうので、
       押し間違えないよう控えめな見た目にし、行の右端へ寄せる。
       ダイアログの地色は SweetAlert2 が持っていて表示テーマに追従しない。
       面の色を --surface で塗ると手動ダークで白地に黒のボタンになるため、
       ここは地を透かして文字色も継承する。 */
    .up-close-btn {
        margin-left: auto;
        font-size: 0.68rem;
        padding: 1px 8px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        opacity: 0.75;
        /* 指の入る大きさを確保する（タブレットで隣の行を押さないため） */
        min-height: 26px;
    }

    .up-close-btn:hover {
        opacity: 1;
        background: rgba(128, 128, 128, 0.12);
    }

    .up-close-note {
        margin-top: 8px;
        font-size: 0.8rem;
        color: inherit;
        opacity: 0.8;
        text-align: left;
        line-height: 1.6;
    }

    .up-toggle-done {
        margin-top: 6px;
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 0.74rem;
        cursor: pointer;
        color: var(--text-sub);
        width: 100%;
    }

    .up-empty,
    .up-orphan-note {
        font-size: 0.72rem;
        color: var(--text-hint);
        padding: 10px 4px;
    }

    .up-orphan-note {
        /* 面の色（--warning: #fbbc04）は白地で 2:1 しかなく、2行の説明文が読めなかった。
           ここでトークン（--warning-text）を使わないのは、SweetAlert2 のダイアログが
           `.swal2-popup{background:#fff}` で**表示テーマに関わらず常に白**だから。
           ダークのトークン（#fdd663）を持ってくると白地で読めなくなる。 */
        color: #a34700;
        text-align: left;
        line-height: 1.7;
    }

        flex-wrap: wrap;
        gap: 4px;
    }

    .umc-badge {
        font-size: 0.68rem;
        padding: 1px 6px;
        border-radius: 10px;
        background: rgba(26, 115, 232, 0.12);
        color: var(--primary, #1a73e8);
    }

    .umc-badge-warn {
        background: rgba(230, 81, 0, 0.14);
        color: var(--warning, #e65100);
    }

    .umc-plan {
        font-size: 0.72rem;
        color: var(--text-sub);
    }

    .umc-totals,
    .umc-orphans {

    .umc-totals summary,

        font-size: 0.78rem;
        color: var(--text-sub);

    }

        border-collapse: collapse;

    }

    .umc-table td {
        border: 1px solid var(--border);
        padding: 3px 6px;
    }

    }

    .umc-over {
        color: var(--warning, #e65100);

    .umc-under {

    }

    .umc-hint {
