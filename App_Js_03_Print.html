<script>
    'use strict';
    // ===== 週案印刷 (HTMLベース) =====
    function printWeeklyPlan() {
        if (!STATE.weekData || !STATE.weekData.days) {
            showToast('error', '週のデータが読み込まれていません');
            return;
        }

        // 前回選択したレイアウトを復元（standard: 従来の2ページ / compact: A4・1ページ）
        var storedLayout = 'standard';
        try { storedLayout = localStorage.getItem('weeklyPrintLayout') || 'standard'; } catch (e) { }
        // 「登校前」列を印刷に含めるかの前回選択を復元（デフォルトは含めない・旧キー互換）
        var storedPreclass = false;
        try { storedPreclass = localStorage.getItem('weeklyPrintPreclass') === '1'; } catch (e) { }
        // 印刷項目のチェック状態をすべて復元し、毎週の再設定を不要にする
        var storedOpts = {};
        try { storedOpts = JSON.parse(localStorage.getItem('weeklyPrintOpts') || '{}') || {}; } catch (e) { }
        var po_ = function (key, def) { return storedOpts[key] === undefined ? def : !!storedOpts[key]; };
        var storedFontSize = parseInt(storedOpts.fontSize, 10) || 10;
        var weekendNote = '土曜: ' + (STATE.showSat ? '含める' : '含めない') + ' ／ 日曜: ' + (STATE.showSun ? '含める' : '含めない');

        // 印刷ダイアログはブラウザ自身のもので、アプリからは大きさも位置も動かせない。
        // Chrome のそれには最低限の高さがあり、画面（＝ウィンドウ）がそれより低いと
        // 上端が画面の外へはみ出して、見出しやページ数が切れたまま出る。
        // 直せないので、代わりに「どうすれば収まるか」をここで先に伝える。
        // 端末の表示サイズを小さくすると、ブラウザのUIごと縮んで収まる。
        var shortScreenNote = '';
        try {
            var availH = (window.screen && window.screen.availHeight) || 0;
            if (availH > 0 && availH < PRINT_DIALOG_MIN_SCREEN_H) {
                shortScreenNote = '<div style="margin-top:10px;padding:8px 10px;border-radius:8px;'
                    + 'background:var(--warning-light);color:var(--text-main);font-size:0.78rem;line-height:1.5;">'
                    + '<b>このあと出るブラウザの印刷画面が、上で切れて見えることがあります。</b><br>'
                    + 'この端末の画面の高さ（' + availH + 'px）だと、Chrome の印刷ダイアログが入りきりません。'
                    + '切れて操作しづらいときは、<b>Ctrl と Shift と −（ハイフン）</b>を同時に押して端末の表示を'
                    + '1段小さくしてから印刷してください（戻すときは Ctrl と Shift と ＋）。'
                    + 'アプリ側からダイアログの大きさは変えられないため、この方法だけが有効です。'
                    + '</div>';
            }
        } catch (e) { /* screen を読めない環境では何も出さない */ }

        Swal.fire({
            title: '<span class="material-symbols-outlined">print</span> 印刷オプション',
            html: '<div style="text-align:left;font-size:0.85rem;">'
                + '<p style="color:var(--text-sub);margin-bottom:8px;">レイアウトを選択してください</p>'
                + '<label style="display:block;margin-bottom:4px;"><input type="radio" name="po_layout" value="standard"' + (storedLayout !== 'compact' ? ' checked' : '') + '> 標準（A4・2ページ）</label>'
                + '<label style="display:block;"><input type="radio" name="po_layout" value="compact"' + (storedLayout === 'compact' ? ' checked' : '') + '> コンパクト（A4・1ページ）</label>'
                + '<div style="font-size:0.75rem;color:var(--text-sub);margin:4px 0 0 20px;">※コンパクトは週案画面の土日列の表示設定を反映します（' + weekendNote + '）</div>'
                + '<hr style="margin:12px 0;">'
                + '<p style="color:var(--text-sub);margin-bottom:12px;">印刷に含める項目を選択してください</p>'
                + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;">'
                + '<label><input type="checkbox" id="po_event"' + (po_('event', true) ? ' checked' : '') + '> 行事</label>'
                + '<label><input type="checkbox" id="po_preclass"' + (po_('preclass', storedPreclass) ? ' checked' : '') + '> 登校前</label>'
                + '<label><input type="checkbox" id="po_morning"' + (po_('morning', true) ? ' checked' : '') + '> 朝学習</label>'
                + '<label><input type="checkbox" id="po_recess1"' + (po_('recess1', true) ? ' checked' : '') + '> 中休み</label>'
                + '<label><input type="checkbox" id="po_recess2"' + (po_('recess2', true) ? ' checked' : '') + '> 昼休み</label>'
                + '<label><input type="checkbox" id="po_afterschool"' + (po_('afterschool', true) ? ' checked' : '') + '> 放課後</label>'
                + '<label><input type="checkbox" id="po_stats"' + (po_('stats', true) ? ' checked' : '') + '> 教科時数表</label>'
                + '<label><input type="checkbox" id="po_summary"' + (po_('summary', true) ? ' checked' : '') + '> 週のまとめ</label>'
                + '<label><input type="checkbox" id="po_todo"' + (po_('todo', true) ? ' checked' : '') + '> Todoリスト</label>'
                + '</div>'
                + '<div style="font-size:0.75rem;color:var(--text-sub);margin:4px 0 0 2px;">※週のまとめは標準ではフリースペース（時数表と検印欄の間）、コンパクトでは週案表の下に印刷されます<br>※Todoリスト・教科時数表は標準レイアウト（2ページ目）にのみ印刷されます</div>'
                + '<hr style="margin:12px 0;">'
                + '<label style="display:block;"><input type="checkbox" id="po_autoFit"' + (po_('autoFit', true) ? ' checked' : '') + '> 用紙に合わせて文字サイズを自動調整</label>'
                + '<div style="font-size:0.75rem;color:var(--text-sub);margin:4px 0 10px 20px;">※その週の分量に合わせて、A4に収まる範囲でいちばん大きい文字サイズが自動で選ばれます</div>'
                + '<label style="display:flex;align-items:center;gap:8px;" id="po_fontRow">'
                + 'フォントサイズ: <input type="range" id="po_fontSize" min="8" max="14" value="' + storedFontSize + '" style="flex:1;">'
                + '<span id="po_fontLabel">' + storedFontSize + 'px</span>'
                + '</label>'
                + shortScreenNote
                + '</div>',
            width: 420,
            confirmButtonText: '印刷する',
            confirmButtonColor: '#1a73e8',
            showCancelButton: true,
            cancelButtonText: 'キャンセル',
            didOpen: function () {
                var slider = document.getElementById('po_fontSize');
                var label = document.getElementById('po_fontLabel');
                slider.addEventListener('input', function () { label.textContent = slider.value + 'px'; });
                // 自動調整中は手動サイズが結果に効かない。動かせるまま残すと
                // 「動かしたのに変わらない」になるので、見た目でも無効だと分かるようにする
                var auto = document.getElementById('po_autoFit');
                var fontRow = document.getElementById('po_fontRow');
                var syncAutoFit = function () {
                    slider.disabled = auto.checked;
                    fontRow.style.opacity = auto.checked ? '0.45' : '';
                };
                auto.addEventListener('change', syncAutoFit);
                syncAutoFit();
            }
        }).then(function (result) {
            if (!result.isConfirmed) return;
            var layoutEl = document.querySelector('input[name="po_layout"]:checked');
            var layout = layoutEl ? layoutEl.value : 'standard';
            try { localStorage.setItem('weeklyPrintLayout', layout); } catch (e) { }
            var preclassChecked = document.getElementById('po_preclass').checked;
            try { localStorage.setItem('weeklyPrintPreclass', preclassChecked ? '1' : '0'); } catch (e) { }
            var opts = {
                layout: layout,
                event: document.getElementById('po_event').checked,
                preclass: preclassChecked,
                morning: document.getElementById('po_morning').checked,
                recess1: document.getElementById('po_recess1').checked,
                recess2: document.getElementById('po_recess2').checked,
                afterschool: document.getElementById('po_afterschool').checked,
                stats: document.getElementById('po_stats').checked,
                summary: document.getElementById('po_summary').checked,
                todo: document.getElementById('po_todo').checked,
                fontSize: parseInt(document.getElementById('po_fontSize').value),
                autoFit: document.getElementById('po_autoFit').checked
            };
            // 次回のためにチェック状態を保存する(復元は po_ 経由)
            try { localStorage.setItem('weeklyPrintOpts', JSON.stringify(opts)); } catch (e) { }
            printWeeklyPlanExec(opts);
        });
    }

    // Chrome の印刷ダイアログが収まる画面の高さの目安。実測ではないので厳密な境界ではなく、
    // 「この辺から下は切れることがある」という案内を出すためのしきい値。
    // GIGA 端末に多い 768px の Chromebook が案内の対象に入るように取ってある。
    var PRINT_DIALOG_MIN_SCREEN_H = 800;

    // 自動調整時の基準フォントサイズ。実際に紙へ出る大きさは
    // 「基準サイズ × pickFitScale_ が選んだ倍率」で決まるので、ここは固定でよい。
    // スライダーの前回位置を基準にすると、同じ週でも前回の操作で仕上がりが変わってしまう。
    var AUTOFIT_BASE_FONT_SIZE = 10;

    // 自動調整で拡大してよい上限。予定がほとんど無い週で文字だけが極端に大きくなるのを防ぐ。
    var AUTOFIT_MAX_SCALE = 2;
    // 縮小側の下限。「どんな分量でも紙に収める」という従来の保証を壊さないよう、
    // 現実には決して当たらない値にしてある（当たると溢れた行が切り落とされる）。
    // 探索を有限区間に閉じ込めるための安全弁であって、意図した縮小限度ではない。
    var AUTOFIT_MIN_SCALE = 0.05;

    // 紙の下端に残す安全余白。測ったレイアウトと実際に刷られるレイアウトは、
    // フォントの効き方や端末差でわずかにズレる。ぴったり 100% を狙うと、その差の分だけ
    // 最下段（時数表の下の行や検印欄）が黙って切り落とされるので、ここだけは削らない。
    var AUTOFIT_SAFETY_MM = 2;
    // スマホ・タブレットでは、印刷のラスタライズ段でレイアウトが DOM より
    // 約2%高くなる（実機の PDF で実測: DOM が 1033.4px と申告したページの文字が、
    // 実際には 1055.3px まで描かれていた）。アプリからは検知できないので、
    // 余白で吸収するしかない。8mm は用紙の約2.9%で、実測のズレ2.1%を覆う。
    var AUTOFIT_SAFETY_MM_MOBILE = 8;
    var MM_TO_PX = 96 / 25.4;

    // 差し替えたタブの題を、念のため戻すまでの時間。印刷ダイアログを閉じたら
    // afterprint で戻すので、ここに当たるのは afterprint が来ない環境だけ。
    // ファイル名は印刷プレビューが開いた時点で決まっているので、
    // ダイアログを開いたまま時間切れになっても、出てくる名前は変わらない。
    var HOST_TITLE_RESTORE_MS = 60000;

    // 測る前に「実際に効かせておく」書体。書体は自己ホスト(App_Fonts.html)なので
    // 外へ取りにはいかないが、使われるまで読み込みは始まらないので名指しで要求する。
    var PRINT_FONT_FAMILY = 'Zen Maru Gothic';

    /**
     * 要素の「中身が実際にどこまで伸びているか」を、要素の上端からの px で返す。
     *
     * scrollHeight ではなく子孫の実座標を見るのは、印刷CSSに overflow:hidden の箱が
     * 何段も入っているため（th,td / .page2-right / .summary-box / .todo-box / .free-box …）。
     * その内側で溢れた分は外側の scrollHeight に伝わらないので、scrollHeight だけを信じると
     * 「溢れていない」と誤判定して縮小しそこなう。getBoundingClientRect() は祖先の
     * overflow:hidden に関係なく本来のレイアウト位置を返すので、切り落とされている溢れも拾える。
     *
     * getBoundingClientRect() は変換後の座標を返すのに対し scrollHeight は変換前のレイアウト値
     * なので、el に transform が掛かっている状態で呼ぶときは、その倍率を appliedScale に渡して
     * 単位を揃えること（揃えないと縮小時に scrollHeight 側が過大に効いて縮めすぎる）。
     *
     * @param {Element} el 対象要素
     * @param {number=} appliedScale el に今掛かっている transform の倍率（無いときは 1）
     * @return {number} 上端から中身の最下端までの px（測れないときは 0）
     */
    function contentBottomPx_(el, appliedScale) {
        if (!el) return 0;
        var sc = (typeof appliedScale === 'number' && isFinite(appliedScale) && appliedScale > 0) ? appliedScale : 1;
        var top = 0;
        try { top = el.getBoundingClientRect().top; } catch (e) { return (el.scrollHeight || 0) * sc; }
        var bottom = top + (el.scrollHeight || 0) * sc;
        var kids = el.querySelectorAll ? el.querySelectorAll('*') : [];
        for (var i = 0; i < kids.length; i++) {
            var r;
            try { r = kids[i].getBoundingClientRect(); } catch (e) { continue; }
            // 非表示要素は 0 の矩形を返す。下端の判定には使わない
            if (!r || (r.width === 0 && r.height === 0)) continue;
            if (r.bottom > bottom) bottom = r.bottom;
        }
        return bottom - top;
    }

    /**
     * 用紙の高さいっぱいまで使える倍率を二分探索で決める純粋関数。
     *
     * ページの中身は「幅を 100/s % にしてから scale(s)」で拡縮する。幅が変われば
     * 折り返しが変わって高さも変わるので、幅100%で測った高さから割り算一発で出した倍率は当たらない。
     * 測ったときの幅と、当てたあとの幅が違うからだ。従来の縮小はこのズレの分だけ縮めすぎていて、
     * 「文字が思ったより小さいのに紙の下は余っている」という出方の原因になっていた。
     *
     * measure(s) は「倍率 s のときのレイアウト幅で測った自然な高さ」を返すこと。
     * s を上げるとレイアウト幅は狭まるので measure(s) は単調非減少、したがって実効高さ
     * measure(s) * s は s について単調増加になり、二分探索が使える。
     *
     * @param {function(number): number} measure 倍率を渡すと自然な高さ(px)を返す関数
     * @param {number} avail 収めたい高さ(px)
     * @param {number} minScale 探索の下限
     * @param {number} maxScale 探索の上限
     * @return {number} avail に収まる最大の倍率。測定できないときは 1（＝素通し）
     */
    function pickFitScale_(measure, avail, minScale, maxScale) {
        if (!isFinite(avail) || avail <= 0) return 1;

        var fitsAt = function (s) {
            var h = measure(s);
            if (!isFinite(h) || h <= 0) return null; // 測定不能
            return h * s <= avail;
        };

        // 上限でも収まるなら探索する必要はない（内容が少ない週はここで即決まる）
        var top = fitsAt(maxScale);
        if (top === null) return 1;
        if (top) return maxScale;

        var bottom = fitsAt(minScale);
        if (bottom === null) return 1;
        // 下限でも収まらないほど内容が多いときは、下限で妥協する（安全弁）
        if (!bottom) return minScale;

        var lo = minScale, hi = maxScale;
        for (var i = 0; i < 12; i++) {
            var mid = (lo + hi) / 2;
            if (fitsAt(mid) === true) lo = mid; else hi = mid;
        }
        return lo; // 必ず「収まる側」を返す
    }

    /**
     * 刷るあいだの題を、入口ページ（giga-school.com のシェル）へ知らせる。
     *
     * ⚠️ ファイル名になるのは、刷る文書の題ではなく **いちばん外側のページの題**。
     * このアプリは入口ページ → GAS → アプリ本体、と iframe が三重になっていて、
     * いちばん外側は別のドメインなので、こちらから直に書き替えることはできない。
     * 便りを送って、あちら（docs/app-url.js）に当ててもらう。
     * これをしないと、どの週を刷っても入口ページの題のまま
     * 「週案エディタ - School Plan Note.pdf」で保存される。
     *
     * 宛先は、シェルからの応答（shellAck）で分かった相手だけを名指しする
     * （App.html が window.__shellOrigin に控える）。分からないうちは送らない。
     * 宛先を '*' にすると、このアプリを埋めこんだ相手が誰であっても届いてしまう。
     * シェルの外（GAS の URL を直に開いたとき）では、そもそも控えが無いので何もしない。
     *
     * @param {?string} title 刷るあいだの題。元に戻すときは null
     */
    function postShellTitle_(title) {
        var origin = window.__shellOrigin;
        if (typeof origin !== 'string' || origin.indexOf('https://') !== 0) return;
        try {
            window.top.postMessage({ type: 'schoolPlanNote:printTitle', title: title }, origin);
        } catch (e) { /* 届かない置き方なら諦める */ }
    }

    /**
     * 画面のタブに出ている題を、刷るあいだだけ差し替える。戻す関数を返す。
     *
     * 自分の document.title と、入口ページの題の両方に当てる。ブラウザによって
     * ファイル名の出どころが違い（刷る文書の題／いちばん外側のページの題）、
     * どちらが読まれても週の名前が付くようにするため。
     * 印刷が終わったら必ず元に戻す（戻し忘れるとタブの名前が変わったままになる）。
     *
     * @param {string} newTitle 刷るあいだだけ入れておく題
     * @return {function()} 元に戻す関数。二度呼んでも戻すのは一度だけ
     */
    function swapHostTitle_(newTitle) {
        var prev;
        try { prev = document.title; } catch (e) { prev = null; }
        var done = false;
        var restore = function () {
            if (done) return;
            done = true;
            if (prev !== null) {
                try { document.title = prev; } catch (e) { /* 戻せなくても印刷そのものは済んでいる */ }
            }
            postShellTitle_(null);
        };
        if (prev !== null) {
            try { document.title = newTitle; } catch (e) { /* 当てられなくても入口ページ側に賭ける */ }
        }
        postShellTitle_(newTitle);
        setTimeout(restore, HOST_TITLE_RESTORE_MS);
        return restore;
    }

    /**
     * 印刷文書の題（＝「PDFに保存」したときにブラウザが出してくる既定のファイル名）を作る。
     *
     * 週案は毎週刷るものなので、名前が同じだと保存先で「(1)」「(2)」が並び、
     * 開くまでどの週か分からない。名前だけで「いつの週か」が分かるようにする。
     *
     * ⚠️ 日付の区切りに「/」は使えない。ブラウザは題をそのままファイル名にするとき、
     * ファイル名に使えない文字（/ ? : * " < > |）を機械的に置き換えるので、
     * 「8/31-9/6」と書いても保存されるのは「8-31-9-6」のような読めないものになる。
     * 「8月31日-9月6日」なら、どの OS でもそのまま残る。同じ理由で、週番号が
     * 取れなかったとき（'?'）は「第?週」を出さずに落とす。
     *
     * @param {number|string} weekNum 週番号（不明なときは '?' や空が来る）
     * @param {Array<Object>} days 月曜から日曜までの日データ（date は 'yyyy/MM/dd'）
     * @return {string} 例: 週案第23週(8月31日-9月6日)
     */
    function buildPrintDocTitle_(weekNum, days) {
        var monthDay = function (d) {
            if (!d || typeof d.date !== 'string') return '';
            var p = d.date.split('/');
            if (p.length < 3) return '';
            var m = parseInt(p[1], 10);
            var day = parseInt(p[2], 10);
            if (!isFinite(m) || !isFinite(day) || m < 1 || day < 1) return '';
            return m + '月' + day + '日';
        };
        var list = (days && days.length) ? days : [];
        var first = '';
        var last = '';
        for (var i = 0; i < list.length; i++) {
            var md = monthDay(list[i]);
            if (!md) continue;
            if (!first) first = md;
            last = md;
        }
        var title = '週案';
        var wn = (weekNum === 0 || weekNum) ? String(weekNum) : '';
        if (wn && wn !== '?') title += '第' + wn + '週';
        if (first) title += '(' + first + ((last && last !== first) ? '-' + last : '') + ')';
        return title;
    }

    /**
     * 週案印刷用の <style> 内CSS文字列を生成する純粋関数。
     * 副作用なし。opts.fontSize と opts.autoFit のみを参照する（printWeeklyPlanExec から抽出）。
     */
    function buildPrintStyles_(opts) {
        // 自動調整では倍率が実効サイズを決めるので、基準は固定値にしておく
        var baseFontSize = opts.autoFit ? AUTOFIT_BASE_FONT_SIZE : opts.fontSize;
        var html = '<style>';
        // 書体は親ページに埋めこんである自己ホストの CSS をそのまま持っていく。
        // 以前はここから Google Fonts を @import していたが、学校のフィルタが
        // 塞ぐと印刷プレビューが開かないまま止まる。
        html += (window.getSelfHostedFontCss ? window.getSelfHostedFontCss() : '');
        // スマホ/タブレットの Chrome は、viewport 指定の無い文書を「PC向け」とみなして
        // 文字を自動拡大する（text autosizing）。拡大率はレンダリング面の幅で決まるため、
        // 画面外 iframe で測ったときと実際に刷るときで別の倍率が掛かり、

        // 紙に合わせるのは @page と自動調整の役目なので、ここでは自動拡大を切る。
        html += 'html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }';

        html += '.page { width: 100%; height: 277mm; box-sizing: border-box; page-break-after: always; display: flex; flex-direction: column; overflow: hidden; }';
        html += '.page:last-child { page-break-after: auto; }';
        // 内容がページ高さを超える場合に比例縮小して全行を収めるためのラッパー
        html += '.page-fit { width: 100%; height: 100%; transform-origin: top left; }';
        // 不具合調査用の診断行。診断ONのときだけ中身が入る（OFFなら要素自体を作らない）
        html += '.page { position: relative; }';
        html += 'table { border-collapse: collapse; width: 100%; table-layout: fixed; margin-bottom: 0; }';
        html += 'th, td { border: 1px solid #333; padding: 3px; vertical-align: top; word-wrap: break-word; overflow: hidden; }';

        // フォントサイズはスライダー(body font-size)に追従するよう em 指定にする（固定px だとスライダーが効かない）
        html += '.subject { font-weight: bold; font-size: 1em; background-color: #dcedc8; padding: 2px; text-align: left; border-bottom: 1px solid #ccc; margin: -3px -3px 2px -3px; }';
        html += '.unit { font-size: 0.9em; color: #555; margin-bottom: 2px; }';
        html += '.content { font-size: 0.9em; line-height: 1.4; }';
        // 空きコマ（別教員担当）: 教科名の帯だけ色を変えて「自分の授業ではない」ことを示す。
        // 狭いセルで行が増えるため、紙では「空き」の文字バッジは足さない。
        // 白黒印刷でも見分けられるよう、通常の帯 #dcedc8（グレー値228）から十分に離れた
        // #b0bec5（同187）を選んである。土日・祝日・休み時間の有彩色とも意味が衝突しない。
        html += '.subject.subject-free { background-color: #b0bec5; }';
        // 空き時間のタスク欄（画面の .period-freetask と同じ見せ方）。

        html += '.freetask { font-size: 0.85em; line-height: 1.35; color: #444; margin-top: 2px; padding-top: 2px; border-top: 1px dashed #999; }';
        html += '.freetask-label { font-weight: bold; font-size: 0.8em; color: #455a64; margin-right: 3px; }';
        html += '.row-header { width: 35px; text-align: center; vertical-align: middle; padding: 2px; }';
        html += '.recess-row td { height: 16px; background-color: #ffe0b2; }';
        html += '.recess-row td:first-child { text-align: center; font-weight: bold; padding: 0; vertical-align: middle;}';

        // Header specific
        html += '.doc-title { text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 8px; position: relative; }';
        html += '.doc-week { position: absolute; right: 0; top: 0; font-size: 12px; font-weight: normal; }';

        // Page 1 specific

        html += '.event-cell { height: 70px; }';
        html += '.afterschool-cell { height: 45px; }';

        // Page 2 specific
        html += '.page2-layout { display: flex; gap: 8px; height: 100%; align-items: stretch; }';
        html += '.page2-left { flex: 0 0 45%; }';
        html += '.page2-right { flex: 0 0 53%; display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; }';
        html += '.sat-col { background-color: #bbdefb; width: 40%; }';
        html += '.sun-col { background-color: #ffcdd2; width: 40%; }';

        // 祝日: 列ヘッダーを赤系で強調し、祝日名を明示する（印刷でも一目でわかるように）
        html += '.holiday-print { font-size: 0.82em; font-weight: bold; color: #c62828; margin-top: 1px; line-height: 1.15; }';
        html += 'th.holiday-head { background-color: #ffd6da; }';
        html += '.holiday-cell { background-color: #fdecef; }';

        html += '.stats-table th, .stats-table td { font-size: 8px; text-align: center; padding: 2px; border: 1px solid #333; }';
        html += '.stats-table th { background-color: #e0e0e0; }';
        html += '.stats-table { width: 100%; border: 1.5px solid #333; }';
        html += '.fraction-text { font-size: 8px; }';

        // 検印枠（page2-rightの最下部に配置）
        html += '.seal-table { width: 40%; margin-left: auto; margin-top: auto; border: 1.5px solid #333; background-color: #fff; flex-shrink: 0; }';
        html += '.seal-table th, .seal-table td { font-size: 8px; text-align: center; padding: 2px; border: 1px solid #333; }';
        html += '.seal-header { background-color: #dcedc8; }';

        html += '.todo-box { border: 1.5px solid #333; padding: 6px 8px; background-color: #dcedc8; border-radius: 4px; display: flex; flex-direction: column; flex: 0 1 auto; max-height: 45%; overflow: hidden; }';
        html += '.todo-title { font-weight: bold; margin-bottom: 4px; font-size: 10px; }';
        html += '.todo-item { border: 1px solid #333; background-color: #fff; margin-bottom: 2px; padding: 2px 3px; font-size: 8px; line-height: 1.3; break-inside: avoid; display: flex; align-items: baseline; gap: 2px; }';
        html += '.todo-due { margin-left: auto; font-size: 7px; color: #888; white-space: nowrap; flex-shrink: 0; }';
        html += '.todo-done { color: #4caf50; font-size: 7px; flex-shrink: 0; }';
        html += '.todo-pending { font-size: 7px; color: #999; flex-shrink: 0; }';
        html += '.todo-list-wrap { columns: 2; column-gap: 6px; overflow: hidden; }';

        html += '.free-box { flex: 1; display: block; padding-top: 5px; overflow: hidden; border: 1px solid #e0e0e0; border-radius: 4px; min-height: 0; }';
        html += '.line-row { border-bottom: 1px dashed #ccc; height: 6mm; width: 100%; }';

        // 週のまとめ（フリースペース: 時数表〜検印欄の間に配置）
        html += '.summary-box { border: 1.5px solid #333; border-radius: 4px; padding: 6px 8px; background-color: #fff; flex: 0 1 auto; overflow: hidden; }';
        html += '.summary-title { font-weight: bold; font-size: 10px; margin-bottom: 4px; padding-bottom: 2px; border-bottom: 1px solid #999; }';
        html += '.summary-text { font-size: 9px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }';

        // コンパクト（A4・1ページ）レイアウト

        html += '.compact-grid .event-cell { height: 55px; }';
        html += '.compact-grid .afterschool-cell { height: 40px; }';
        html += '.compact-grid th.sat-head { background-color: #bbdefb; }';
        html += '.compact-grid th.sun-head { background-color: #ffcdd2; }';
        html += '.compact-bottom { display: flex; gap: 8px; margin-top: 8px; align-items: stretch; }';
        html += '.compact-bottom .stats-table { width: auto; flex: 1 1 0; }';
        html += '.compact-bottom .seal-table { width: 180px; margin: 0 0 0 auto; flex: 0 0 auto; }';
        html += '.compact-summary { margin-top: 8px; flex: 0 1 auto; }';
        html += '</style>';
        return html;
    }

    /**
     * コンパクト（A4・1ページ）レイアウトのページHTMLを生成する。
     * 週案編集画面の土日列の表示設定（STATE.showSat / STATE.showSun）を反映し、
     * 非表示の列は印刷にも含めない。
     */
    function buildCompactPageHtml_(opts, days, weekNum, renderDateHeader, renderPeriod) {
        var visIdx = [0, 1, 2, 3, 4];
        if (STATE.showSat) visIdx.push(5);
        if (STATE.showSun) visIdx.push(6);

        var html = '<div class="page page-grow">';
        html += '<div class="doc-title">週間指導計画簿<div class="doc-week">第' + weekNum + '週</div></div>';
        html += '<table class="grid1 compact-grid">';

        // ヘッダー行
        html += '<tr><th class="row-header">日付<br>曜日</th>';
        visIdx.forEach(function (i) {
            var classes = [];
            if (i === 5) classes.push('sat-head');
            else if (i === 6) classes.push('sun-head');
            if (days[i] && days[i].holiday) classes.push('holiday-head');
            var cls = classes.length ? ' class="' + classes.join(' ') + '"' : '';
            html += '<th' + cls + '>' + renderDateHeader(days[i]) + '</th>';
        });
        html += '</tr>';

        var textRow = function (key, label, cellClass) {
            var isRecess = (key === 'recess1' || key === 'recess2');
            var h = '<tr' + (isRecess ? ' class="recess-row"' : '') + '><td class="row-header">' + label + '</td>';
            visIdx.forEach(function (i) {
                var v = (days[i] && days[i][key]) ? escHtml(days[i][key]).replace(/\n/g, '<br>') : '';
                h += '<td' + (cellClass ? ' class="' + cellClass + '"' : '') + '>' + v + '</td>';
            });
            return h + '</tr>';
        };
        var periodRow = function (pIdx, label) {
            var h = '<tr><td class="row-header">' + label + '</td>';
            visIdx.forEach(function (i) {
                h += '<td>' + ((days[i] && days[i].periods) ? renderPeriod(days[i].periods[pIdx]) : '') + '</td>';
            });
            return h + '</tr>';
        };

        if (opts.event) html += textRow('event', '時程<br>行事', 'event-cell');
        if (opts.preclass) html += textRow('preclass', '登校前');
        if (opts.morning) html += textRow('morning', '朝学習');
        html += periodRow(0, '1校時');
        html += periodRow(1, '2校時');
        if (opts.recess1) html += textRow('recess1', '中休');
        html += periodRow(2, '3校時');
        html += periodRow(3, '4校時');
        if (opts.recess2) html += textRow('recess2', '昼休');
        html += periodRow(4, '5校時');
        html += periodRow(5, '6校時');
        if (opts.afterschool) html += textRow('afterschool', '放課後');
        html += '</table>';

        // 週のまとめ（表と下段（時数表・検印枠）の間に全幅で印刷）
        var weekSummaryText = (STATE.weekData && STATE.weekData.weekSummary) ? STATE.weekData.weekSummary : '';
        if (opts.summary && weekSummaryText) {
            html += '<div class="summary-box compact-summary">';
            html += '<div class="summary-title">今週のまとめ（報告）</div>';
            html += '<div class="summary-text">' + escHtml(weekSummaryText) + '</div>';
            html += '</div>';
        }

        // 下段: 教科時数表（選択時） + 検印枠
        html += '<div class="compact-bottom">';
        if (opts.stats) {
            var summary = STATE.hoursSummaryData || [];
            var activeSubjects = summary.filter(function (s) { return s && s.subject; });
            var minRows = activeSubjects.length > 0 ? 0 : 5;
            var half = Math.max(Math.ceil(activeSubjects.length / 2), minRows);
            var total = activeSubjects.length > 0 ? activeSubjects.length : half * 2;
            var buildStats = function (from, to) {
                var t = '<table class="stats-table"><tr><th></th><th>週時数</th><th>累計</th><th>年間進捗</th></tr>';
                for (var i = from; i < to; i++) {
                    var s = activeSubjects[i] || { subject: ' ', weekly: '', cumulative: '', percent: '' };
                    t += '<tr>';
                    t += '<td style="background-color:#dcedc8;">' + (escHtml(s.subject) || ' ') + '</td>';
                    t += '<td>' + formatFraction(s.weekly) + '</td>';
                    t += '<td>' + formatFraction(s.cumulative) + '</td>';
                    t += '<td>' + (s.percent !== undefined && s.percent !== '' ? s.percent + '%' : '&nbsp;') + '</td>';
                    t += '</tr>';
                }
                return t + '</table>';
            };
            html += buildStats(0, half);
            html += buildStats(half, total);
        }
        // 検印枠
        html += '<table class="seal-table">';
        html += '<tr><td rowspan="2" class="seal-header" style="width:20px; font-weight:bold; vertical-align:middle; font-size:12px;">検<br><br>印</td><td class="seal-header">校長</td><td class="seal-header">副校長</td><td class="seal-header">担当者</td></tr>';
        html += '<tr><td style="height:40px;"></td><td></td><td></td></tr>';
        html += '</table>';
        html += '</div>'; // end compact-bottom

        html += '</div>'; // end page
        return html;
    }

    function printWeeklyPlanExec(opts) {
        var btn = document.getElementById('printBtn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined fs-6">hourglass_empty</span> 準備中...';
        }

        // display:none だと要素がレイアウトを持たず高さ測定(scrollHeight)が0になり自動縮小が効かない。
        // レイアウトを保ったまま画面から隠す必要がある。横幅は印刷可能領域(A4縦, 左右10mm余白)に合わせる。
        //
        // 以前は iframe 自身を left:-9999px に飛ばしていた。position:fixed の箱を画面の外へ置くと、
        // 実装によってはスクロールできる範囲がそこまで広がる。印刷ダイアログを開いた拍子に
        // 画面が横へ飛び、ダイアログの下でアプリが切れて見える原因になる。
        // 代わりに「大きさ0・overflow:hidden の入れ物」に入れ、画面の左上で切り落とす。
        // iframe の中のレイアウトは外側の切り落としに左右されないので、実測はそのまま効く。
        var printHost = document.getElementById('printFrameHost');
        if (!printHost) {
            printHost = document.createElement('div');
            printHost.id = 'printFrameHost';
            document.body.appendChild(printHost);
        }
        var printFrame = document.getElementById('printFrame');
        if (!printFrame) {
            printFrame = document.createElement('iframe');
            printFrame.id = 'printFrame';
        }
        if (printFrame.parentNode !== printHost) printHost.appendChild(printFrame);
        printHost.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;'
            + 'overflow:hidden;border:0;pointer-events:none;z-index:-1;';
        printFrame.style.cssText = 'display:block;width:190mm;height:600mm;border:0;';

        var doc = printFrame.contentWindow.document;
        doc.open();

        var weekNum = STATE.weekData.weekNum !== undefined && STATE.weekData.weekNum !== null ? STATE.weekData.weekNum : '?';
        var days = STATE.weekData.days || [];

        // 題は「PDFに保存」の既定のファイル名になる。どの週のものかが名前で分かるようにする
        var docTitle = buildPrintDocTitle_(weekNum, days);

        var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + escHtml(docTitle) + '</title>';
        // viewport が無いと、スマホの Chrome がこの文書を「PC向けページ」と誤認して
        // 文字を自動拡大する。測るときと刷るときでレイアウトを揃えるために必ず入れる。
        html += '<meta name="viewport" content="width=device-width, initial-scale=1">';
        html += buildPrintStyles_(opts);
        html += '</head><body>';

        var renderDateHeader = function (d) {
            if (!d) return "";
            var p = d.date.split("/");
            var html = p[1] + "/" + p[2] + "<br>" + d.dayLabel;
            if (d.holiday) {
                html += '<div class="holiday-print">' + escHtml(d.holiday) + '</div>';
            }
            return html;
        };

        // 空き時間（別教員担当）は、教科名の帯の色だけを変えて示す。
        // 画面(renderPeriodView)と同じ整形にそろえ、区切りマーカーは紙に出さない。
        var renderPeriod = function (p) {
            if (!p) return "";
            var free = isFreeContent(p.content);
            var content = "";
            // 教科名が無い空きコマでも帯は出す。色が唯一の手がかりになるため
            // （空の div は行ボックスが作られず高さ0になるので &nbsp; を入れる）。
            if (p.subject || free) {
                content += '<div class="subject' + (free ? ' subject-free' : '') + '">'
                    + (p.subject ? escHtml(p.subject) : '&nbsp;') + '</div>';
            }
            if (p.unit) content += '<div class="unit">' + escHtml(p.unit) + '</div>';
            if (p.content) {
                if (free) {
                    var parts = splitFreeContent(p.content);
                    if (parts.subjectPart.trim()) {
                        content += '<div class="content">' + escHtml(parts.subjectPart.trim()).replace(/\n/g, '<br>') + '</div>';
                    }
                    // 画面はタスクの入力口なので空でも枠を出すが、紙では場所を取るだけなので出さない
                    if (parts.taskPart.trim()) {
                        content += '<div class="freetask"><span class="freetask-label">タスク</span>'
                            + escHtml(parts.taskPart.trim()).replace(/\n/g, '<br>') + '</div>';
                    }
                } else {
                    content += '<div class="content">' + escHtml(p.content).replace(/\n/g, '<br>') + '</div>';
                }
            }
            return content;
        };

        if (opts.layout === 'compact') {
            // ====== コンパクト（A4・1ページ）レイアウト ======
            html += buildCompactPageHtml_(opts, days, weekNum, renderDateHeader, renderPeriod);
        } else {

        // ====== 1ページ目 ======
        html += '<div class="page page-grow">';
        html += '<div class="doc-title">週間指導計画簿<div class="doc-week">第' + weekNum + '週</div></div>';
        html += '<table class="grid1">';

        // ヘッダー行
        html += '<tr><th class="row-header">日付<br>曜日</th>';
        for (var i = 0; i < 5; i++) {
            var thCls = (days[i] && days[i].holiday) ? ' class="holiday-head"' : '';
            html += '<th' + thCls + '>' + renderDateHeader(days[i]) + '</th>';
        }
        html += '</tr>';

        // 行事
        if (opts.event) {
            html += '<tr><td class="row-header">時程<br>行事</td>';
            for (var i = 0; i < 5; i++) {
                var evtCls = 'event-cell' + ((days[i] && days[i].holiday) ? ' holiday-cell' : '');
                html += '<td class="' + evtCls + '">' + ((days[i] && days[i].event) ? escHtml(days[i].event).replace(/\n/g, '<br>') : '') + '</td>';
            }
            html += '</tr>';
        }

        // 登校前
        if (opts.preclass) {
            html += '<tr><td class="row-header">登校前</td>';
            for (var i = 0; i < 5; i++) { html += '<td>' + ((days[i] && days[i].preclass) ? escHtml(days[i].preclass).replace(/\n/g, '<br>') : '') + '</td>'; }
            html += '</tr>';
        }

        // 朝学習
        if (opts.morning) {
            html += '<tr><td class="row-header">朝学習</td>';
            for (var i = 0; i < 5; i++) { html += '<td>' + ((days[i] && days[i].morning) ? escHtml(days[i].morning).replace(/\n/g, '<br>') : '') + '</td>'; }
            html += '</tr>';
        }

        // 1校時
        html += '<tr><td class="row-header">1校時</td>';
        for (var i = 0; i < 5; i++) { html += '<td>' + ((days[i] && days[i].periods) ? renderPeriod(days[i].periods[0]) : '') + '</td>'; }
        html += '</tr>';

        // 2校時
        html += '<tr><td class="row-header">2校時</td>';
        for (var i = 0; i < 5; i++) { html += '<td>' + ((days[i] && days[i].periods) ? renderPeriod(days[i].periods[1]) : '') + '</td>'; }
        html += '</tr>';

        // 中休み
        if (opts.recess1) {
            html += '<tr class="recess-row"><td class="row-header">中休</td>';
            for (var i = 0; i < 5; i++) { html += '<td>' + ((days[i] && days[i].recess1) ? escHtml(days[i].recess1).replace(/\n/g, '<br>') : '') + '</td>'; }
            html += '</tr>';
        }

        // 3校時
        html += '<tr><td class="row-header">3校時</td>';
        for (var i = 0; i < 5; i++) { html += '<td>' + ((days[i] && days[i].periods) ? renderPeriod(days[i].periods[2]) : '') + '</td>'; }
        html += '</tr>';

        // 4校時
        html += '<tr><td class="row-header">4校時</td>';
        for (var i = 0; i < 5; i++) { html += '<td>' + ((days[i] && days[i].periods) ? renderPeriod(days[i].periods[3]) : '') + '</td>'; }
        html += '</tr>';

        // 昼休み
        if (opts.recess2) {
            html += '<tr class="recess-row"><td class="row-header">昼休</td>';
            for (var i = 0; i < 5; i++) { html += '<td>' + ((days[i] && days[i].recess2) ? escHtml(days[i].recess2).replace(/\n/g, '<br>') : '') + '</td>'; }
            html += '</tr>';
        }

        // 5校時
        html += '<tr><td class="row-header">5校時</td>';
        for (var i = 0; i < 5; i++) { html += '<td>' + ((days[i] && days[i].periods) ? renderPeriod(days[i].periods[4]) : '') + '</td>'; }
        html += '</tr>';

        // 6校時
        html += '<tr><td class="row-header">6校時</td>';
        for (var i = 0; i < 5; i++) { html += '<td>' + ((days[i] && days[i].periods) ? renderPeriod(days[i].periods[5]) : '') + '</td>'; }
        html += '</tr>';

        // 放課後
        if (opts.afterschool) {
            html += '<tr><td class="row-header">放課後</td>';
            for (var i = 0; i < 5; i++) { html += '<td class="afterschool-cell">' + ((days[i] && days[i].afterschool) ? escHtml(days[i].afterschool).replace(/\n/g, '<br>') : '') + '</td>'; }
            html += '</tr>';
        }

        html += '</table>';
        html += '</div>';

        // ====== 2ページ目 ======
        html += '<div class="page">';
        html += '<div class="page2-layout">';

        // 週末（左ペイン）
        html += '<div class="page2-left">';
        html += '<table class="grid1">';

        html += '<tr><th class="row-header">日付<br>曜日</th>';
        html += '<th class="sat-col">' + renderDateHeader(days[5]) + '</th>';
        html += '<th class="sun-col">' + renderDateHeader(days[6]) + '</th></tr>';

        var renderWeekendContent = function (key, idx, p_idx) {
            var d = days[idx] || {};
            if (p_idx !== undefined) {
                return d.periods ? renderPeriod(d.periods[p_idx]) : '';
            }
            return d[key] ? escHtml(d[key]).replace(/\n/g, '<br>') : '';
        };

        // 行事
        if (opts.event) {
            html += '<tr><td class="row-header">時程<br>行事</td>';
            html += '<td class="event-cell">' + renderWeekendContent("event", 5) + '</td>';
            html += '<td class="event-cell">' + renderWeekendContent("event", 6) + '</td>';
            html += '</tr>';
        }

        // 登校前
        if (opts.preclass) {
            html += '<tr><td class="row-header">登校前</td>';
            html += '<td>' + renderWeekendContent("preclass", 5) + '</td>';
            html += '<td>' + renderWeekendContent("preclass", 6) + '</td>';
            html += '</tr>';
        }

        // 朝学習
        if (opts.morning) {
            html += '<tr><td class="row-header">朝学習</td>';
            html += '<td>' + renderWeekendContent("morning", 5) + '</td>';
            html += '<td>' + renderWeekendContent("morning", 6) + '</td>';
            html += '</tr>';
        }

        // 1校時
        html += '<tr><td class="row-header">1校時</td>';
        html += '<td>' + renderWeekendContent("", 5, 0) + '</td>';
        html += '<td>' + renderWeekendContent("", 6, 0) + '</td>';
        html += '</tr>';

        // 2校時
        html += '<tr><td class="row-header">2校時</td>';
        html += '<td>' + renderWeekendContent("", 5, 1) + '</td>';
        html += '<td>' + renderWeekendContent("", 6, 1) + '</td>';
        html += '</tr>';

        // 中休み
        if (opts.recess1) { html += '<tr class="recess-row"><td class="row-header">中休</td><td>' + renderWeekendContent("recess1", 5) + '</td><td>' + renderWeekendContent("recess1", 6) + '</td></tr>'; }

        // 3校時
        html += '<tr><td class="row-header">3校時</td>';
        html += '<td>' + renderWeekendContent("", 5, 2) + '</td>';
        html += '<td>' + renderWeekendContent("", 6, 2) + '</td>';
        html += '</tr>';

        // 4校時
        html += '<tr><td class="row-header">4校時</td>';
        html += '<td>' + renderWeekendContent("", 5, 3) + '</td>';
        html += '<td>' + renderWeekendContent("", 6, 3) + '</td>';
        html += '</tr>';

        // 昼休み
        if (opts.recess2) { html += '<tr class="recess-row"><td class="row-header">昼休</td><td>' + renderWeekendContent("recess2", 5) + '</td><td>' + renderWeekendContent("recess2", 6) + '</td></tr>'; }

        // 5校時
        html += '<tr><td class="row-header">5校時</td>';
        html += '<td>' + renderWeekendContent("", 5, 4) + '</td>';
        html += '<td>' + renderWeekendContent("", 6, 4) + '</td>';
        html += '</tr>';

        // 6校時
        html += '<tr><td class="row-header">6校時</td>';
        html += '<td>' + renderWeekendContent("", 5, 5) + '</td>';
        html += '<td>' + renderWeekendContent("", 6, 5) + '</td>';
        html += '</tr>';

        // 放課後
        if (opts.afterschool) {
            html += '<tr><td class="row-header">放課後</td>';
            html += '<td class="afterschool-cell">' + renderWeekendContent("afterschool", 5) + '</td>';
            html += '<td class="afterschool-cell">' + renderWeekendContent("afterschool", 6) + '</td>';
            html += '</tr>';
        }

        html += '</table>';
        html += '</div>';

        // 右ペイン
        html += '<div class="page2-right">';

        // 時数集計表
        if (opts.stats) {
            var summary = STATE.hoursSummaryData || [];
            // アクティブな教科のみ表示（学年設定に応じた教科数）
            var activeSubjects = summary.filter(function (s) { return s && s.subject; });
            // データ未取得時は空行で表の構造を維持（左右各5行）
            var minRows = activeSubjects.length > 0 ? 0 : 5;
            var half = Math.max(Math.ceil(activeSubjects.length / 2), minRows);
            html += '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">';

            // 1列目
            html += '<table class="stats-table" style="width:48%;">';
            html += '<tr><th></th><th>週時数</th><th>累計</th><th>年間進捗</th></tr>';
            for (var i = 0; i < half; i++) {
                var s = activeSubjects[i] || { subject: " ", weekly: "", cumulative: "", percent: "" };
                html += '<tr>';
                html += '<td style="background-color:#dcedc8;">' + (escHtml(s.subject) || " ") + '</td>';
                html += '<td>' + formatFraction(s.weekly) + '</td>';
                html += '<td>' + formatFraction(s.cumulative) + '</td>';
                html += '<td>' + (s.percent !== undefined && s.percent !== "" ? s.percent + "%" : "&nbsp;") + '</td>';
                html += '</tr>';
            }
            html += '</table>';

            // 2列目
            var half2 = activeSubjects.length > 0 ? activeSubjects.length : half * 2;
            html += '<table class="stats-table" style="width:48%;">';
            html += '<tr><th></th><th>週時数</th><th>累計</th><th>年間進捗</th></tr>';
            for (var i = half; i < half2; i++) {
                var s = activeSubjects[i] || { subject: " ", weekly: "", cumulative: "", percent: "" };
                html += '<tr>';
                html += '<td style="background-color:#dcedc8;">' + (escHtml(s.subject) || " ") + '</td>';
                html += '<td>' + formatFraction(s.weekly) + '</td>';
                html += '<td>' + formatFraction(s.cumulative) + '</td>';
                html += '<td>' + (s.percent !== undefined && s.percent !== "" ? s.percent + "%" : "&nbsp;") + '</td>';
                html += '</tr>';
            }
            html += '</table>';
            html += '</div>';
        } // end if (opts.stats)

        // Todoリスト(週データが不完全な場合は日付計算ができないため出力しない)
        if (opts.todo !== false && days && days[0] && days[0].date && days[6] && days[6].date) {
        html += '<div class="todo-box">';
        html += '<div class="todo-title">Todoリスト</div>';
        html += '<div class="todo-list-wrap">';
        var tasks = STATE.tasks || [];
        // 当該週の次の週末日（日曜日）を算出 → 印刷対象の期日上限
        var currentSunStr = days[6].date; // "yyyy/MM/dd"
        var sunParts = currentSunStr.split('/');
        var nextWeekSun = new Date(+sunParts[0], +sunParts[1] - 1, +sunParts[2]);
        nextWeekSun.setDate(nextWeekSun.getDate() + 7);
        var nextWeekEndStr = nextWeekSun.getFullYear() + '-'
            + String(nextWeekSun.getMonth() + 1).padStart(2, '0') + '-'
            + String(nextWeekSun.getDate()).padStart(2, '0');
        // 表示中の週の月曜日を YYYY-MM-DD 形式で取得
        var monParts = days[0].date.split('/');
        var mondayIsoStr = monParts[0] + '-' + String(parseInt(monParts[1])).padStart(2, '0') + '-' + String(parseInt(monParts[2])).padStart(2, '0');
        // フィルタ: 完了タスクは表示中週の月曜日より前の期日なら非表示、それ以外は次週末以前を表示
        var printTasks = tasks.filter(function (t) {
            if (!t.dueDate) return true;        // 期日未設定は常に表示
            // 完了タスクは、期日が表示中週の月曜日より前なら非表示
            if (t.status === '完了' && t.dueDate < mondayIsoStr) return false;
            return t.dueDate <= nextWeekEndStr;  // 次週末日以前のタスクを表示
        });
        // ソート: 未完了→完了の順、同グループ内は期日昇順（未設定は最後）
        printTasks.sort(function (a, b) {
            var aComp = (a.status === '完了') ? 1 : 0;
            var bComp = (b.status === '完了') ? 1 : 0;
            if (aComp !== bComp) return aComp - bComp;
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate);
        });
        // 表示（2カラムレイアウトで省スペース化、最低3行確保）
        // .todo-box は overflow:hidden のため、上限を超えた分は黙って切れる。
        // 上限で打ち切り「…他N件」を明示して、印刷されなかったタスクの存在を伝える。
        var TODO_PRINT_MAX = 14;
        var todoOverflow = Math.max(0, printTasks.length - TODO_PRINT_MAX);
        var displayCount = Math.max(3, Math.min(printTasks.length, TODO_PRINT_MAX));
        for (var i = 0; i < displayCount; i++) {
            if (printTasks[i] && printTasks[i].content) {
                var duePart = '';
                if (printTasks[i].dueDate) {
                    var dp = printTasks[i].dueDate.split('-');
                    duePart = '<span class="todo-due">' + parseInt(dp[1]) + '/' + parseInt(dp[2]) + '</span>';
                }
                var statusMark = printTasks[i].status === '完了' ? '<span class="todo-done">✔</span>'
                    : (printTasks[i].status === '進行中' ? '<span class="todo-pending">◐</span>' : '<span class="todo-pending">□</span>');
                html += '<div class="todo-item">' + statusMark + ' ' + escHtml(printTasks[i].content) + duePart + '</div>';
            } else {
                html += '<div class="todo-item">&nbsp;</div>';
            }
        }
        if (todoOverflow > 0) {
            html += '<div class="todo-item" style="color:#888;">…他' + todoOverflow + '件（タスクタブを確認）</div>';
        }
        html += '</div>';
        html += '</div>';
        } // end Todoリスト

        // 週のまとめ（時数表と検印欄の間のフリースペースに印刷）
        var weekSummaryText = (STATE.weekData && STATE.weekData.weekSummary) ? STATE.weekData.weekSummary : '';
        if (opts.summary && weekSummaryText) {
            html += '<div class="summary-box">';
            html += '<div class="summary-title">今週のまとめ（報告）</div>';
            html += '<div class="summary-text">' + escHtml(weekSummaryText) + '</div>';
            html += '</div>';
        }

        // フリー枠（残りスペースを最大限使用）
        html += '<div class="free-box">';
        for (var i = 0; i < 30; i++) {
            html += '<div class="line-row"></div>';
        }
        html += '</div>';

        // 検印枠（2ページ目最下部に固定）
        html += '<table class="seal-table">';
        html += '<tr><td rowspan="2" class="seal-header" style="width:20px; font-weight:bold; vertical-align:middle; font-size:12px;">検<br><br>印</td><td class="seal-header">校長</td><td class="seal-header">副校長</td><td class="seal-header">担当者</td></tr>';
        html += '<tr><td style="height:50px;"></td><td></td><td></td></tr>';
        html += '</table>';

        html += '</div>'; // end page2-right
        html += '</div>'; // end page2-layout
        html += '</div>'; // end page

        } // end 標準（2ページ）レイアウト

        html += '</body></html>';

        doc.write(html);
        doc.close();

        // 各ページの内容をラッパーで包み、印刷領域を使い切る倍率まで拡大／縮小する。
        // 拡大してよいのは .page-grow を付けたページだけ。標準2ページ目はフリースペース
        // (.free-box) が余った高さを引き受ける設計なので、拡大せず縮小のみに留める。
        // スマホ・タブレットかどうか。userAgentData.mobile は Chromium が持つ真偽値で、
        // Chromebook は false になる（CrOS はモバイル扱いではない）。未対応環境は UA 文字列で見る。
        var isMobilePrint = (function () {
            try {
                var uad = navigator.userAgentData;
                if (uad && typeof uad.mobile === 'boolean') return uad.mobile;
            } catch (e) { /* 参照できない環境は下の判定に任せる */ }
            return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
        })();

        var fitPagesToPrintArea = function () {
            var fdoc = printFrame.contentWindow.document;
            var pages = fdoc.querySelectorAll('.page');
            for (var pi = 0; pi < pages.length; pi++) {
                var page = pages[pi];
                if (!page.querySelector('.page-fit')) {
                    var inner = fdoc.createElement('div');
                    inner.className = 'page-fit';
                    while (page.firstChild) { inner.appendChild(page.firstChild); }
                    page.appendChild(inner);
                }
                var fit = page.querySelector('.page-fit');
                var canGrow = page.className.indexOf('page-grow') !== -1;
                // height:100% のままだと scrollHeight が最低でもページ高さを返してしまい、
                // 「あとどれだけ余っているか」を測れない。拡大するページだけ auto にする。
                fit.style.height = canGrow ? 'auto' : '100%';
                var avail = page.clientHeight;
                // 高さが測れないページには触らない。ここで無理に倍率を出すと、
                // 検算が 0 を目標にしてページを極端に縮めてしまう
                if (!(avail > 0)) continue;
                // 紙の下端ぎりぎりを狙わず、安全余白の分だけ内側に収める
                var safety = (isMobilePrint ? AUTOFIT_SAFETY_MM_MOBILE : AUTOFIT_SAFETY_MM) * MM_TO_PX;
                var target = Math.max(avail - safety, avail * 0.5);

                var applyScale = function (s) {
                    fit.style.transform = '';
                    fit.style.width = (Math.abs(s - 1) > 0.005) ? (100 / s) + '%' : '100%';
                    if (Math.abs(s - 1) > 0.005) {
                        // 拡縮しても横はページ幅いっぱいを保つよう、先に幅を逆補正してから比例拡縮
                        fit.style.transform = 'scale(' + s + ')';
                    }
                };
                // 当てる幅と測る幅を必ず一致させる（ここがズレると縮めすぎ・広げすぎになる）
                var measureAt = function (s) {
                    fit.style.transform = '';
                    fit.style.width = (100 / s) + '%';
                    return contentBottomPx_(fit);
                };
                var scale = pickFitScale_(measureAt, target, AUTOFIT_MIN_SCALE,
                    canGrow ? AUTOFIT_MAX_SCALE : 1);
                applyScale(scale);

                // 検算: 変換を当てた「実際の状態」で最下端を測り直す。まだ紙を超えていれば
                // その比だけ縮めて当て直す。measureAt の読みが何らかの理由で外れていても、
                // 最後はここで必ず収まる側に寄せられる。
                for (var k = 0; k < 3; k++) {
                    var actual = contentBottomPx_(fit, scale);
                    if (!isFinite(actual) || actual <= target || actual <= 0) break;
                    scale = scale * (target / actual);
                    if (scale < AUTOFIT_MIN_SCALE) { scale = AUTOFIT_MIN_SCALE; applyScale(scale); break; }
                    applyScale(scale);
                }

            }
        };

        var printed = false;
        var restoreHostTitle = function () { };
        var doPrint = function () {
            if (printed) return;
            printed = true;
            try { fitPagesToPrintArea(); } catch (e) { /* 測定失敗時はそのまま印刷 */ }
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined fs-6">print</span> 印刷';
            }
            // ファイル名の出どころはブラウザによって違う。刷る文書（iframe）の <title> を
            // 見るものと、いちばん外側のページの題を見るもの（Chrome はこちら）がある。
            // 外側の題は画面のタブに出ているものなので、刷るあいだだけ差し替えて必ず戻す。
            restoreHostTitle = swapHostTitle_(docTitle);
            printFrame.contentWindow.focus();
            printFrame.contentWindow.print();
        };

        // 印刷直前にもう一度合わせ直す。フォントが遅れて効いた場合など、測ったあとに
        // レイアウトが変わっていても、刷られる直前の状態で収め直せる
        try {
            printFrame.contentWindow.onbeforeprint = function () {
                try { fitPagesToPrintArea(); } catch (e) { /* 失敗時はそのまま印刷 */ }
            };
            // 刷り終わったら入れ物ごと畳む。次に刷るときは冒頭で組み立て直すので、
            // 測り終えた枠を画面に残す理由は無い。print() がダイアログを待たずに返る
            // 環境があるので、畳むのは afterprint だけに任せる（早く畳むとプレビューが空になる）。
            printFrame.contentWindow.onafterprint = function () {
                try { printHost.style.display = 'none'; } catch (e) { /* 実害は無い */ }
                restoreHostTitle();
            };
        } catch (e) { /* onbeforeprint 非対応環境は素通し */ }

        // 高さはフォントに依存するので、書体が実際に効いてから測る。
        // 書体は自己ホストで @font-face も印刷文書の <style> に入っているが、
        // 実際に使われるまで読み込みは始まらない。fonts.ready だけに任せると
        // 「まだ要求していない＝待つものが無い」として即座に解決し、代替書体のまま
        // 測ってしまうので、fonts.load() で名指しで要求してから ready を待つ。
        var fdocReady = printFrame.contentWindow.document;
        var waitForFonts = function () {
            var q = '"' + PRINT_FONT_FAMILY + '"';
            return Promise.all([
                fdocReady.fonts.load('400 ' + AUTOFIT_BASE_FONT_SIZE + 'px ' + q),
                fdocReady.fonts.load('700 16px ' + q)
            ]).catch(function () { /* 読めなくても代替書体で進む */ })
                .then(function () { return fdocReady.fonts.ready; });
        };
        if (fdocReady.fonts && typeof fdocReady.fonts.load === 'function' && typeof Promise !== 'undefined') {
            waitForFonts().then(function () { setTimeout(doPrint, 150); },
                function () { setTimeout(doPrint, 150); });
            // フォント待ちが解決しない環境向けのフォールバック
            setTimeout(doPrint, 1500);
        } else {
            setTimeout(doPrint, 500);
        }
    }

</script>
