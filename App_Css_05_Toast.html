<style>
    /* ===== トースト =====
       SweetAlert2 のトーストは、モーダルと同じ1枠（globalState.currentInstance）を
       奪い合う。トーストが出た瞬間に開いているダイアログが破棄され、その .then() に
       isDismissed が返るため、入力途中のピッカーが黙って閉じていた。
       そこでトーストだけ SweetAlert2 から切り離し、ここで自前に持つ。
       ダイアログ（.swal2-container: z-index 10000）より前に出す。 */

    #toastStack {
        position: fixed;
        top: calc(var(--header-h, 60px) + 8px);
        right: 12px;
        z-index: 10001;
        display: flex;
        flex-direction: column;
        gap: 8px;
        /* 重なった場所のクリックを塞がない。トースト自身だけ受け取る。 */
        pointer-events: none;
        max-width: min(360px, calc(100vw - 24px));
    }

    .toast-item {
        pointer-events: auto;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 10px 12px;
        background: var(--surface);
        color: var(--text-main);
        border: 1px solid var(--border);
        border-left: 4px solid var(--text-sub);
        border-radius: var(--radius-sm, 8px);
        box-shadow: var(--shadow-md);
        font-size: 0.85rem;
        line-height: 1.5;
        cursor: pointer;
        opacity: 1;
        transform: translateX(0);
        transition: opacity .18s ease, transform .18s ease;
    }

    /* 出入りの動き。減速を好まない環境では下の prefers-reduced-motion で止める。 */
    .toast-item.toast-enter,
    .toast-item.toast-leave {
        opacity: 0;
        transform: translateX(12px);
    }

    .toast-icon {
        font-size: 1.15rem;
        line-height: 1.3;
        flex-shrink: 0;
    }

    .toast-text {
        /* 長いエラー文でも折り返して読めるようにする */
        overflow-wrap: anywhere;
    }

    .toast-success {
        border-left-color: var(--secondary);
    }

    .toast-success .toast-icon {
        color: var(--secondary-text);
    }

    .toast-error {
        border-left-color: var(--danger);
    }

    .toast-error .toast-icon {
        color: var(--danger-text);
    }

    .toast-warning {
        border-left-color: var(--warning);
    }

    .toast-warning .toast-icon {
        color: var(--warning-text);
    }

    .toast-info {
        border-left-color: var(--primary);
    }

    .toast-info .toast-icon {
        color: var(--primary-text);
    }

    /* 画面の狭い端末では、右上に寄せず横いっぱいに置く（本文に被らせない） */
    @media (max-width: 576px) {
        #toastStack {
            left: 12px;
            right: 12px;
            max-width: none;
        }
    }

    @media (prefers-reduced-motion: reduce) {

        .toast-item,
        .toast-item.toast-enter,
        .toast-item.toast-leave {
            transition: none;
            transform: none;
        }
    }
</style>
