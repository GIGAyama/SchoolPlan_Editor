<script>
    'use strict';
    // ===================================================
    // ===== 進捗つき単元ピッカー =====
    // 単元マスタの一覧に「指導済み / 指導中 / 未指導」を重ねて表示し、
    // 指導が終わった単元を畳んで下に送る。次に指導する単元を先頭で示す。
    //
    // 進捗の判定はサーバー側（14_UnitProgress.gs）が 04_AutoFill.gs の
    // 既存ロジックで行う。ここは表示と絞り込みだけを担当する。
    // ===================================================

    /** 進捗インデックスを取得して STATE にキャッシュする。取得済みなら何もしない。 */
    function loadUnitProgress(onDone, forceRefresh) {
        if (!forceRefresh && STATE.unitProgress) { onDone(STATE.unitProgress); return; }
        if (STATE.unitProgressLoading) {
            // 取得中なら完了までポーリングして待つ（二重リクエストを避ける）
            var waited = 0;
            var timer = setInterval(function () {
                waited += 100;
                if (STATE.unitProgress || !STATE.unitProgressLoading || waited > 15000) {
                    clearInterval(timer);
                    onDone(STATE.unitProgress);
                }
            }, 100);
            return;
        }
        STATE.unitProgressLoading = true;
        google.script.run
            .withSuccessHandler(function (res) {
                STATE.unitProgressLoading = false;
                STATE.unitProgress = (res && res.success) ? res : null;
                onDone(STATE.unitProgress);
            })
            .withFailureHandler(function () {
                STATE.unitProgressLoading = false;
                STATE.unitProgress = null;
                onDone(null);
            })
            .getUnitProgressIndexFromWeb(!!forceRefresh);
    }

    /** 編集モードに入ったときの先読み。失敗しても何も表示しない。 */
    function prefetchUnitProgress() {
        if (STATE.unitProgress || STATE.unitProgressLoading) return;
        loadUnitProgress(function () { });
    }

    /** 進捗インデックスから、表記ゆれを吸収して該当教科のエントリを取得する。 */
    function findProgressSubject(progress, subject) {
        if (!progress || !progress.subjects) return null;
        var key = normalizeSubjectName(subject);
        if (progress.subjects[key]) return progress.subjects[key];
        for (var k in progress.subjects) {
            if (normalizeSubjectName(k) === key) return progress.subjects[k];
        }
        return null;
    }

    // ===================================================
    // ===== 保存前の入力を進捗へ重ねる（サーバ通信なし） =====
    // サーバの進捗インデックスは編集モードに入った最初の1回しか取りに行かないため、
    // 保存を挟まずに続けて入力すると2コマ目以降も同じ時間目が案内されてしまう。
    // ピッカーを開く直前にグリッドの現在値を重ねて、その場で次の時間目へ進める。
    // ===================================================

    /**
     * 表示中の週のグリッドから、単元セルの入力を拾います。
     * 保存に使うのと同じ collectCurrentEditData() を通すため、ピッカー経由の入力も、
     * 手入力も、ドラッグ＆ドロップや自動入力の結果も同じように拾えます
     * （編集モードでなければ STATE.weekData.days の保存済みの値がそのまま返ります）。
     *
     * 単元セルの書式 "単元名 n/N" の解析は 04_AutoFill.gs の parseUnitProgress_ と同じです。
     *
     * @returns {Array<Object>} [{ subject, unitName, hour, cellTotal, isPast }]
     */
    function collectWeekUnitEntries() {
        if (typeof collectCurrentEditData !== 'function') return [];
        var days = collectCurrentEditData();
        if (!days || !days.length) return [];

        var todayStr = formatDateLocal(new Date());
        var entries = [];
        days.forEach(function (day) {
            if (!day || !day.periods) return;
            // 日付はサーバもクライアントも "yyyy/MM/dd" のゼロ埋めなので文字列のまま比較できる。
            // 当日は「実施済み」に含める（サーバの upTomorrowMidnight_ と同じ締切）。
            var isPast = !!day.date && String(day.date) <= todayStr;
            day.periods.forEach(function (p) {
                if (!p || !p.subject || !p.unit) return;
                var m = String(p.unit).match(/(.+?)\s*(\d+)\/(\d+)/);
                if (!m) return;
                entries.push({
                    // 分け合いのセル（"国語2/3 行事1/3"）も、単元マスタのある教科の進捗として数える
                    subject: resolveMasterSubject(STATE.masterData && STATE.masterData.masterMap, p.subject),
                    unitName: m[1].trim(),
                    hour: parseInt(m[2], 10),
                    cellTotal: parseInt(m[3], 10),
                    isPast: isPast
                });
            });
        });
        return entries;
    }

    /**
     * 1教科分の派生値を、plannedHour / taughtHour / effectiveTotal から引き直します。
     *
     * ここでの決め方は 14_UnitProgress.gs の buildUnitProgressPayload_ と同じ規則です。
     * 片方だけ直すと保存前と保存後で案内が変わってしまうため、必ず対で直してください。
     */
    function refreshProgressSubject(sp) {
        if (!sp || !sp.units) return;

        sp.units.forEach(function (u) {
            // 「指導しない（全0時間）」は1時間も入っていなくても終了扱い
            // （サーバの isMasterUnitSkipped_ と対）。
            var done = u.skipped || (u.effectiveTotal > 0 && u.plannedHour >= u.effectiveTotal);
            // 指導済みの単元には次の時間が存在しないため、総時数を超えないよう丸める
            // （丸めないとピッカーがマスタに無い時数をセルへ書き込んでしまう）。
            u.nextHour = done
                ? Math.max(Math.min(u.plannedHour, u.effectiveTotal), 1)
                : u.plannedHour + 1;
            u.status = done ? 'done' : (u.plannedHour > 0 ? 'inProgress' : 'untaught');
            // 実効時数と同じく、単元マスタの総時数を正とする（14_UnitProgress.gs と対）
            var masterTotal = u.skipped ? 0 : ((u.declaredTotal || 0) || (u.masterRowHours || 0));
            u.overTaught = !!(masterTotal && u.plannedHour > masterTotal);
            u.isNext = false;
        });

        // 「次に指導する単元」= マスタ順で最初の未消化単元。着手済みがあればそちらを優先する。
        var nextUnit = null;
        for (var i = 0; i < sp.units.length; i++) {
            if (sp.units[i].status !== 'done') { nextUnit = sp.units[i]; break; }
        }
        for (var j = 0; j < sp.units.length; j++) {
            if (sp.units[j].status === 'inProgress') { nextUnit = sp.units[j]; break; }
        }
        sp.nextUnitName = nextUnit ? nextUnit.unitName : null;
        sp.units.forEach(function (u) { u.isNext = (u.unitName === sp.nextUnitName); });
    }

    /**
     * グリッドから拾った入力を進捗インデックスへ重ねます（破壊的更新）。
     * 合成は max だけなので、同じ週の保存済みの行と二重に数えず、
     * 何度通しても結果が変わりません。
     *
     * 未保存のまま入力を消した場合に進捗が下がらないのは承知のうえです。
     * 保存すれば STATE.unitProgress が捨てられてサーバの計算で正しい値に戻るため、
     * ずれるのは未保存の間だけで、そのために通信を増やすことはしません。
     */
    function applyWeekUnitEntries(progress, entries) {
        if (!progress || !progress.subjects || !entries || !entries.length) return progress;

        var touched = [];
        entries.forEach(function (e) {
            var sp = findProgressSubject(progress, e.subject);
            if (!sp || !sp.units) return;

            // 突き合わせは正規化して行う（週案側の表記がゆれていても同じ単元とみなす）
            var nameKey = normalizeUnitName(e.unitName);
            var unit = null;
            for (var i = 0; i < sp.units.length; i++) {
                if (normalizeUnitName(sp.units[i].unitName) === nameKey) { unit = sp.units[i]; break; }
            }

            if (!unit) {
                // 単元マスタに無い単元（改名・自由入力で発生する）は孤立として扱う。
                if (!sp.orphans) sp.orphans = [];
                var orphan = null;
                for (var j = 0; j < sp.orphans.length; j++) {
                    if (normalizeUnitName(sp.orphans[j].unitName) === nameKey) { orphan = sp.orphans[j]; break; }
                }
                if (orphan) orphan.plannedHour = Math.max(orphan.plannedHour || 0, e.hour);
                else sp.orphans.push({ unitName: e.unitName, plannedHour: e.hour });
                return;
            }

            if (touched.indexOf(sp) === -1) touched.push(sp);
            unit.plannedHour = Math.max(unit.plannedHour || 0, e.hour);
            if (e.isPast) unit.taughtHour = Math.max(unit.taughtHour || 0, e.hour);

            // 実効時数の決め方は 04_AutoFill.gs の effectiveTotal と同じ規則にする。
            // 単元マスタの総時数を正とし、セルの分母（n/N の N）はマスタに総時数が
            // 無いときの穴埋めにとどめる。ここで分母を max に混ぜていると、
            // 「ここまでで終了」で総時数を減らしても週案の古い分母に押し戻される。
            if (unit.skipped) {
                // 「指導しない」単元は総時数 0 が正。週案の分母で埋め戻すと、
                // 終了にしたはずの単元がまた全N時間に戻ってしまう。
                unit.effectiveTotal = unit.plannedHour;
            } else {
                var masterTotal = (unit.declaredTotal || 0) || (unit.masterRowHours || 0);
                var total = masterTotal || Math.max(unit.effectiveTotal || 0, e.cellTotal || 0);
                unit.effectiveTotal = Math.max(total, unit.plannedHour);
            }
        });

        touched.forEach(refreshProgressSubject);
        return progress;
    }

    /**
     * ピッカーを開く直前に、グリッドの現在値を進捗へ重ねます。サーバへは行きません。
     * 重ね合わせに失敗しても、サーバ由来の進捗だけで従来どおり動かします。
     */
    function syncUnitProgressWithGrid(progress) {
        try {
            return applyWeekUnitEntries(progress, collectWeekUnitEntries());
        } catch (e) {
            return progress;
        }
    }

    /**
     * 単元マスタピッカー（進捗つき）。
     * 進捗が取れなかった場合は従来の openUnitPickerBasic にフォールバックする。
     */
    function openUnitPicker(dayIdx, pIdx) {
        var subjectEl = document.querySelector('[data-field="subject"][data-day="' + dayIdx + '"][data-period="' + pIdx + '"]');
        var subject = subjectEl ? subjectEl.value.trim() : '';
        var contentEl = document.querySelector('[data-field="content"][data-day="' + dayIdx + '"][data-period="' + pIdx + '"]');
        // 教科名が空の時間・空き時間（別教員担当）は、従来どおりタスク選択モーダルへ
        if (!subject || (contentEl && isFreeContent(contentEl.value))) {
            openTaskPickerForContent(dayIdx, pIdx);
            return;
        }

        // 教科セルは "国語2/3 行事1/3" のように1コマを分け合って書けるので、
        // マスタに載っている側の教科（分数の大きいほうを優先）へ寄せてから引く
        var masterMap = STATE.masterData ? STATE.masterData.masterMap : null;
        var masterSubject = resolveMasterSubject(masterMap, subject);
        var units = lookupMasterMapUnits(masterMap, masterSubject);
        if (!units || units.length === 0) {
            showToast('warning', '「' + subject + '」の単元マスタデータが見つかりません。');
            return;
        }
        subject = masterSubject;

        loadUnitProgress(function (progress) {
            // 保存前の入力もその場で進捗へ反映する（サーバ通信は増えない）
            var sp = findProgressSubject(syncUnitProgressWithGrid(progress), subject);
            if (!sp || !sp.units || sp.units.length === 0) {
                // 進捗が取れないときは機能を落として基本版で続行する
                openUnitPickerBasic(dayIdx, pIdx);
                return;
            }
            showUnitPickerModal(dayIdx, pIdx, subject, sp);
        });
    }

    /**
     * 「まとめて終了にする」で選べる単元かどうか。
     * 指導済み・「指導しない」は用が無いので選べない。
     */
    function isClosableUnit(u) {
        return !!u && u.status !== 'done';
    }

    /** 「終了にする」と何時間になるか。1時間も入っていなければ 0（＝指導しない）。 */
    function closureHoursOf(u) {
        return Math.max(0, u.plannedHour || 0);
    }

    /** 単元1件分の行HTMLを組み立てる。 */
    function buildUnitPickerItem(u, idx) {
        var statusLabel, statusClass;
        if (u.skipped) {
            // 総時数 0＝「今年は指導しない」。指導し終えた単元とは見分けられるようにする。
            statusLabel = '指導しない';
            statusClass = 'up-badge-skipped';
        } else if (u.status === 'done') {
            statusLabel = '指導済み';
            statusClass = 'up-badge-done';
        } else if (u.status === 'inProgress') {
            statusLabel = u.taughtHour > 0
                ? u.taughtHour + '時間目まで実施済み'
                : u.plannedHour + '時間目まで入力済み';
            statusClass = 'up-badge-progress';
        } else {
            statusLabel = '未指導';
            statusClass = 'up-badge-new';
        }

        var notes = '';
        if (u.overTaught) notes += '<span class="up-note">総時数を超えて指導済み</span>';
        if (u.totalMismatch) notes += '<span class="up-note">総時数のぶんだけ行がありません</span>';

        // まだ終わっていない単元にだけ「終了」を出す。指導し終えた単元にはもう用が無い。
        // 1時間も入っていない単元は「指導しない」（総時数 0）になる。
        var closeBtn = '';
        if (isClosableUnit(u)) {
            var hours = closureHoursOf(u);
            closeBtn = '<button type="button" class="up-close-btn" data-close-idx="' + idx + '">'
                + (hours > 0 ? hours + '時間で終了' : '指導しない')
                + '</button>';
        }

        // 選択のしるしは、まとめ操作に入るまで場所を取らない（既定は非表示）。
        var check = isClosableUnit(u)
            ? '<span class="up-check" aria-hidden="true"></span>'
            : '<span class="up-check up-check-off" aria-hidden="true"></span>';

        return '<div class="up-item' + (u.isNext ? ' up-item-next' : '') + (u.status === 'done' ? ' up-item-done' : '') + '" '
            + 'data-idx="' + idx + '" data-name="' + escAttr(u.unitName.toLowerCase()) + '" data-status="' + escAttr(u.status) + '"'
            + (isClosableUnit(u) ? ' data-closable="1"' : '') + '>'
            + check
            + '<div class="up-item-body">'
            + '<div class="up-item-main">'
            + (u.isNext ? '<span class="up-next-tag">次はここから</span>' : '')
            + '<strong>' + escHtml(u.unitName) + '</strong>'
            + '<span class="up-hours">（' + (u.skipped ? '全0時間' : '全' + u.effectiveTotal + '時間') + '）</span>'
            + '</div>'
            + '<div class="up-item-sub"><span class="up-badge ' + statusClass + '">' + escHtml(statusLabel) + '</span>' + notes + closeBtn + '</div>'
            + '</div>'
            + '</div>';
    }

    /** ピッカー本体。検索・指導済みの折りたたみ・まとめて終了つき。 */
    function showUnitPickerModal(dayIdx, pIdx, subject, sp) {
        // 表示順: 次に指導する単元 → 未指導/指導中（マスタ順） → 指導済み（マスタ順）
        var active = sp.units.filter(function (u) { return u.status !== 'done'; });
        var done = sp.units.filter(function (u) { return u.status === 'done'; });
        active.sort(function (a, b) {
            if (a.isNext !== b.isNext) return a.isNext ? -1 : 1;
            return a.order - b.order;
        });
        var ordered = active.concat(done);
        var closable = ordered.filter(isClosableUnit);

        // マスタに無い単元は、進捗が別々に数えられてしまう。空白や記号のゆれは
        // 自動で吸収するので、ここに出るのは本当に別の名前で書かれたもの。
        var orphanNote = (sp.orphans && sp.orphans.length)
            ? '<div class="up-orphan-note">週案にこの名前で書かれていますが、単元マスタにはありません: '
              + sp.orphans.map(function (o) { return escHtml(o.unitName) + '（' + o.plannedHour + '時間目まで）'; }).join('、')
              + '<br>この分は上の一覧の進捗に数えられていません。週案のセルを単元マスタの名前に直すと、まとめて数えられるようになります。'
              + '</div>'
            : '';

        // まとめ操作に入る入口。終了にできる単元が2つ以上あるときだけ出す
        // （1つしかないなら行の「◯時間で終了」のほうが早い）。
        var bulkEntry = (closable.length >= 2)
            ? '<button type="button" class="up-bulk-enter" id="upBulkEnter">まとめて終了にする</button>'
            : '';

        var html =
            '<div class="up-picker" id="upPicker">'
            + '<input type="text" id="upSearch" class="form-control form-control-sm" placeholder="単元名で検索...">'
            + '<div class="up-head"><div class="up-count" id="upCount"></div>' + bulkEntry + '</div>'
            + '<div class="up-bulk-hint" id="upBulkHint">終了にする単元をえらんでください。'
            + '週案に入っていない単元は「全0時間（指導しない）」になります。</div>'
            + '<div class="up-list" id="upList">'
            + active.map(function (u) { return buildUnitPickerItem(u, ordered.indexOf(u)); }).join('')
            + '</div>'
            + (done.length
                ? '<button type="button" class="up-toggle-done" id="upToggleDone">指導済み ' + done.length + '件を表示</button>'
                  + '<div class="up-list up-list-done" id="upDoneList" style="display:none;">'
                  + done.map(function (u) { return buildUnitPickerItem(u, ordered.indexOf(u)); }).join('')
                  + '</div>'
                : '')
            + '<div class="up-empty" id="upEmpty" style="display:none;">該当する単元がありません</div>'
            + '<div class="up-bulkbar" id="upBulkBar">'
            + '<button type="button" class="up-bulk-sub" id="upSelectAll">表示中をすべて選ぶ</button>'
            + '<button type="button" class="up-bulk-sub" id="upSelectNone">選択を消す</button>'
            + '<button type="button" class="up-bulk-run" id="upBulkRun" disabled>選んだ単元を終了にする</button>'
            + '<button type="button" class="up-bulk-sub" id="upBulkCancel">やめる</button>'
            + '</div>'
            + orphanNote
            + '</div>';

        Swal.fire({
            title: '「' + subject + '」の単元を選択',
            html: html,
            width: 560,
            showConfirmButton: false,
            showCancelButton: true,
            cancelButtonText: '閉じる',
            didOpen: function () {
                var container = Swal.getHtmlContainer();
                var picker = container.querySelector('#upPicker');
                var searchEl = container.querySelector('#upSearch');
                var countEl = container.querySelector('#upCount');
                var emptyEl = container.querySelector('#upEmpty');
                var doneToggle = container.querySelector('#upToggleDone');
                var doneList = container.querySelector('#upDoneList');
                var bulkEnter = container.querySelector('#upBulkEnter');
                var bulkRun = container.querySelector('#upBulkRun');
                var bulkMode = false;
                // 選んだ単元は ordered の添字で覚える（検索で行が隠れても消えない）
                var selected = {};

                function visibleItems() {
                    return container.querySelectorAll('.up-item:not(.up-hidden)');
                }
                function refreshCount() {
                    var shown = 0;
                    container.querySelectorAll('.up-item').forEach(function (el) {
                        // 折りたたまれている指導済みは件数に数えない
                        if (el.classList.contains('up-hidden')) return;
                        if (doneList && doneList.contains(el) && doneList.style.display === 'none') return;
                        shown++;
                    });
                    countEl.textContent = shown + ' / ' + sp.units.length + ' 単元';
                    emptyEl.style.display = (visibleItems().length === 0) ? '' : 'none';
                }

                function selectedUnits() {
                    return Object.keys(selected)
                        .filter(function (k) { return selected[k]; })
                        .map(function (k) { return ordered[parseInt(k, 10)]; })
                        .filter(isClosableUnit);
                }

                function refreshSelection() {
                    container.querySelectorAll('.up-item').forEach(function (el) {
                        el.classList.toggle('up-item-picked', !!selected[el.dataset.idx]);
                    });
                    var n = selectedUnits().length;
                    bulkRun.disabled = (n === 0);
                    bulkRun.textContent = n > 0
                        ? '選んだ' + n + '単元を終了にする'
                        : '選んだ単元を終了にする';
                }

                function setBulkMode(on) {
                    bulkMode = on;
                    picker.classList.toggle('up-bulk-on', on);
                    if (!on) selected = {};
                    refreshSelection();
                }

                function applyFilter() {
                    var q = (searchEl.value || '').trim().toLowerCase();
                    container.querySelectorAll('.up-item').forEach(function (el) {
                        var hit = !q || el.dataset.name.indexOf(q) !== -1;
                        el.classList.toggle('up-hidden', !hit);
                    });
                    // 検索中は指導済みも自動で開く（探しているものが隠れないように）
                    if (q && doneList && doneList.style.display === 'none') {
                        doneList.style.display = '';
                        if (doneToggle) doneToggle.textContent = '指導済みを隠す';
                    }
                    refreshCount();
                }

                searchEl.addEventListener('input', applyFilter);
                if (doneToggle) {
                    doneToggle.addEventListener('click', function () {
                        var hidden = doneList.style.display === 'none';
                        doneList.style.display = hidden ? '' : 'none';
                        doneToggle.textContent = hidden ? '指導済みを隠す' : '指導済み ' + sp.units.filter(function (u) { return u.status === 'done'; }).length + '件を表示';
                        refreshCount();
                    });
                }

                if (bulkEnter) {
                    bulkEnter.addEventListener('click', function () { setBulkMode(true); });
                }
                container.querySelector('#upBulkCancel').addEventListener('click', function () {
                    setBulkMode(false);
                });
                container.querySelector('#upSelectAll').addEventListener('click', function () {
                    // 「表示中」だけを選ぶ。検索で絞ってから全部、という使い方ができる。
                    visibleItems().forEach(function (el) {
                        if (el.dataset.closable) selected[el.dataset.idx] = true;
                    });
                    refreshSelection();
                });
                container.querySelector('#upSelectNone').addEventListener('click', function () {
                    selected = {};
                    refreshSelection();
                });
                bulkRun.addEventListener('click', function () {
                    var units = selectedUnits();
                    if (units.length === 0) return;
                    Swal.close();
                    confirmCloseUnits(dayIdx, pIdx, subject, units);
                });

                container.querySelectorAll('.up-close-btn').forEach(function (btn) {
                    btn.addEventListener('click', function (ev) {
                        // 行クリック（＝その単元を入力する）へ伝えない
                        ev.stopPropagation();
                        var u = ordered[parseInt(btn.dataset.closeIdx, 10)];
                        if (!u) return;
                        Swal.close();
                        confirmCloseUnits(dayIdx, pIdx, subject, [u]);
                    });
                });

                container.querySelectorAll('.up-item').forEach(function (item) {
                    item.addEventListener('click', function () {
                        var u = ordered[parseInt(item.dataset.idx, 10)];
                        if (!u) return;
                        if (bulkMode) {
                            // まとめ操作の最中は、行クリックは選択の切り替えにあてる
                            if (!item.dataset.closable) return;
                            selected[item.dataset.idx] = !selected[item.dataset.idx];
                            refreshSelection();
                            return;
                        }
                        if (u.skipped) {
                            // 総時数 0 のままでは時間目を選べない。先に指導を再開する。
                            Swal.close();
                            confirmReopenUnit(dayIdx, pIdx, subject, u);
                            return;
                        }
                        Swal.close();
                        openHourPicker(dayIdx, pIdx, subject, u.unitName, u.effectiveTotal, u.nextHour);
                    });
                });

                refreshCount();
                refreshSelection();
                searchEl.focus();
            }
        });
    }

    /**
     * 「この単元は終了」の確認と実行（1件でもまとめてでも同じ道を通る）。
     *
     * 単元マスタの総時数を、週案に入っている時数へ合わせます。1時間も入っていない
     * 単元は全0時間＝「指導しない」になります。行は消さないので、余った時間の
     * 学習活動は残ります。単元マスタは全学級で共通なので、その旨を確認画面に必ず書きます。
     */
    function confirmCloseUnits(dayIdx, pIdx, subject, units) {
        if (!units || units.length === 0) return;

        var rows = units.map(function (u) {
            var hours = closureHoursOf(u);
            var after = hours > 0 ? '全' + hours + '時間' : '全0時間（指導しない）';
            return '<li><strong>' + escHtml(u.unitName) + '</strong>: 全' + u.effectiveTotal + '時間 → ' + after + '</li>';
        }).join('');
        // 学習活動が残る単元が1つでもあれば、消えないことを書く（消したと思わせない）
        var keepsRows = units.some(function (u) { return u.effectiveTotal > closureHoursOf(u); });

        Swal.fire({
            title: units.length === 1
                ? '「' + units[0].unitName + '」を終了にしますか？'
                : '選んだ' + units.length + '単元を終了にしますか？',
            html: '<ul class="up-close-list">' + rows + '</ul>'
                + '<div class="up-close-note">'
                + unsavedClosureNote()
                + (keepsRows ? '残りの時間ぶんの学習活動は消さずに残します（来年また使えます）。<br>' : '')
                + '単元マスタは全学級で共通のため、この変更は<strong>すべての学級</strong>に反映されます。<br>'
                + '実行前の状態は復元ポイントとして保存されます。'
                + '</div>',
            icon: 'question',
            width: 560,
            showCancelButton: true,
            confirmButtonText: hasUnsavedWeekInput() ? '保存して終了にする' : '終了にする',
            cancelButtonText: 'やめる'
        }).then(function (result) {
            if (!result.isConfirmed) return;
            runUnitClosure(dayIdx, pIdx, subject, units, 'close');
        });
    }

    /** 「指導しない」にした単元を、また指導する状態へ戻す確認と実行。 */
    function confirmReopenUnit(dayIdx, pIdx, subject, u) {
        var hours = Math.max(u.masterRowHours || 0, u.plannedHour || 0, 1);
        Swal.fire({
            title: '「' + u.unitName + '」の指導を再開しますか？',
            html: 'この単元は「指導しない（全0時間）」になっています。'
                + '単元マスタの総時数を <strong>全' + hours + '時間</strong> に戻してから、時間目を選べるようにします。'
                + '<div class="up-close-note">'
                + unsavedClosureNote()
                + '単元マスタは全学級で共通のため、この変更は<strong>すべての学級</strong>に反映されます。<br>'
                + '実行前の状態は復元ポイントとして保存されます。'
                + '</div>',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: hasUnsavedWeekInput() ? '保存して再開する' : '指導を再開する',
            cancelButtonText: 'やめる'
        }).then(function (result) {
            if (!result.isConfirmed) return;
            runUnitClosure(dayIdx, pIdx, subject, [u], 'reopen');
        });
    }

    /**
     * いま画面に、まだ保存していない入力があるか。
     *
     * サーバは何時間目まで入っているかを**保存済みの週案**から数え直します
     * （クライアントの言い値を使わないため）。いま打ったばかりの時間はサーバに
     * まだ無いので、そのまま実行すると画面の「3時間で終了」に対して全0時間
     * （＝指導しない）が書かれる、という食い違いが起こります。
     */
    function hasUnsavedWeekInput() {
        return typeof hasUnsavedChanges === 'function' && hasUnsavedChanges();
    }

    /** 確認画面に添える「先に保存します」の一言。保存済みなら何も出さない。 */
    function unsavedClosureNote() {
        return hasUnsavedWeekInput()
            ? '未保存の入力があります。時数は<strong>保存済みの週案</strong>から数え直すため、'
              + '先にこの週を保存してから実行します。<br>'
            : '';
    }

    /**
     * 終了・再開の前に、編集中の入力を保存します。
     * 一括自動入力・コマ移動と同じ「保存して実行」の流儀に揃えています。
     * 確認画面で保存することは伝えてあるので、ここでもう一度は尋ねません。
     *
     * @returns {Promise<boolean>} 続けてよければ true
     */
    function saveBeforeClosure() {
        if (!hasUnsavedWeekInput()) return Promise.resolve(true);
        if (typeof saveCurrentWeekOnce !== 'function') return Promise.resolve(true);
        return saveCurrentWeekOnce('close-units');
    }

    /** 終了・再開をサーバへ投げ、単元マスタと進捗を取り直してピッカーを開き直す。 */
    function runUnitClosure(dayIdx, pIdx, subject, units, mode) {
        saveBeforeClosure().then(function (ok) {
            // 保存に失敗したら単元マスタには触らない（数え直す元が古いままになる）
            if (!ok) return;
            postUnitClosure(dayIdx, pIdx, subject, units, mode);
        });
    }

    function postUnitClosure(dayIdx, pIdx, subject, units, mode) {
        var names = units.map(function (u) { return u.unitName; });
        var failLabel = (mode === 'reopen') ? '指導を再開できませんでした: ' : '終了にできませんでした: ';
        var runner = google.script.run
            .withSuccessHandler(function (res) {
                if (!res || !res.success) {
                    showToast('error', failLabel + ((res && res.error) || '不明なエラー'));
                    return;
                }
                // 単元マスタが変わったので、マスタと進捗のキャッシュを捨てて取り直す
                if (typeof invalidateMasterData === 'function') invalidateMasterData();
                else { STATE.unitProgress = null; STATE.unitProgressLoading = false; }
                // 総時数の変更は画面のどこにも出ないので、これは知らせる必要がある。
                // 1件も変わらなかったとき（すでに終了・単元が見つからない）は
                // 成功の緑にしない。何が起きたかは res.message が持っている。
                showToast(res.changedCount > 0 ? 'success' : 'info', res.message);
                // 保存して実行したときは編集モードを抜けている。セルの入力欄がもう無いので
                // 開き直すとタスク選択のほうへ落ちてしまう。編集中のときだけ開き直す。
                if (STATE.editMode) openUnitPicker(dayIdx, pIdx);
            })
            .withFailureHandler(function (e) {
                showToast('error', failLabel + (e && e.message ? e.message : e));
            });
        if (mode === 'reopen') runner.reopenClosedUnits(subject, names);
        else runner.closeUnitsAtTaughtHours(subject, names);
    }
</script>
