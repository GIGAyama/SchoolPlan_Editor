<script>
    'use strict';
    // ===== 固定時間割エディタ =====
    var DAY_NAMES = ['月', '火', '水', '木', '金'];

    function loadTimetableEditor() {
        google.script.run
            .withSuccessHandler(function (res) {
                if (res.success) {
                    renderTimetableEditor(res.data);
                    STATE.timetableLoaded = true;
                } else {
                    showToast('error', 'エラー: ' + (res.error || ''));
                }
            })
            .withFailureHandler(_onCommError)
            .getTimetableForEditor();
    }

    /**
     * 固定時間割エディタに未保存の変更があるか。
     *
     * 転記（今の週に展開／年間一括転記）が書き込むのは「保存済みの固定時間割」であって、
     * エディタに表示中の内容ではない。保存し忘れたまま転記すると1つ前の時間割が入るため、
     * 転記の前にこれで検出して知らせる。
     * @returns {boolean} エディタ未読込・未描画なら false
     */
    function hasUnsavedTimetableChanges() {
        if (!STATE.timetableLoaded || STATE.timetableSaved === null) return false;
        if (!document.getElementById('tt_0_time')) return false;
        return JSON.stringify(gatherTimetableData()) !== STATE.timetableSaved;
    }

    function renderTimetableEditor(data) {
        var tbody = document.getElementById('timetableBody');
        tbody.innerHTML = '';
        // 描画直後 = サーバーの保存済み内容。以後の未保存判定はこれと比べる
        STATE.timetableSaved = null;
        data.forEach(function (dayData, dayIndex) {
            var tr = document.createElement('tr');
            // 曜日ラベル
            var tdLabel = document.createElement('td');
            tdLabel.textContent = DAY_NAMES[dayIndex];
            tr.appendChild(tdLabel);
            // 時程
            tr.appendChild(makeEditorCell('tt_' + dayIndex + '_time', dayData.time || ''));
            // 朝学習
            tr.appendChild(makeEditorCell('tt_' + dayIndex + '_morning', dayData.morning || ''));
            // 1〜6校時
            for (var p = 0; p < 6; p++) {
                tr.appendChild(makeEditorCell('tt_' + dayIndex + '_p' + p, (dayData.periods && dayData.periods[p]) || '', true));
            }
            tbody.appendChild(tr);
        });
        STATE.timetableSaved = JSON.stringify(gatherTimetableData());
    }

    function makeEditorCell(id, value, isSubjectCell) {
        var td = document.createElement('td');
        var input = document.createElement('input');
        input.type = 'text';
        input.id = id;
        input.value = value;
        if (isSubjectCell) {
            // 教科セルは「教科名+分数（合計1）」形式の検証をリアルタイムに行う
            input.addEventListener('input', function () { updateSubjectInputValidity(input); });
            updateSubjectInputValidity(input);
        }
        td.appendChild(input);
        return td;
    }

    function gatherTimetableData() {
        var data = [];
        for (var d = 0; d < 5; d++) {
            var periods = [];
            for (var p = 0; p < 6; p++) {
                var el = document.getElementById('tt_' + d + '_p' + p);
                periods.push(el ? el.value : '');
            }
            data.push({
                day: d,
                time: (document.getElementById('tt_' + d + '_time') || {}).value || '',
                morning: (document.getElementById('tt_' + d + '_morning') || {}).value || '',
                periods: periods
            });
        }
        return data;
    }

    /** 教科セルの検証: 「教科名+分数」形式は分数の合計が必ず1。 */
    function validateTimetableData(data) {
        var errors = [];
        data.forEach(function (dayData, d) {
            dayData.periods.forEach(function (value, p) {
                if (!value) return;
                var check = validateSubjectCellValue(value);
                if (!check.valid) {
                    errors.push(DAY_NAMES[d] + '曜 ' + (p + 1) + '校時「' + value + '」: ' + check.message);
                }
            });
        });
        return errors;
    }

    /**
     * エディタの内容を1回だけ保存し、成否を Promise で返します。
     * 「保存してから転記する」経路から完了を待つために使います。
     * @returns {Promise<boolean>}
     */
    function saveTimetableOnce() {
        return new Promise(function (resolve) {
            var data = gatherTimetableData();
            var errors = validateTimetableData(data);
            if (errors.length > 0) {
                showToast('error', '教科名の入力に誤りがあります: ' + errors[0]
                    + (errors.length > 1 ? '（他' + (errors.length - 1) + '件）' : ''));
                resolve(false);
                return;
            }

            showToast('info', '保存中...');
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        // 保存が通った時点の内容が新しい基準になる
                        STATE.timetableSaved = JSON.stringify(data);
                        showToast('success', '' + res.message);
                        resolve(true);
                    } else {
                        showToast('error', 'エラー: ' + res.error);
                        resolve(false);
                    }
                })
                .withFailureHandler(function (e) { _onCommError(e); resolve(false); })
                .saveTimetableFromEditor(data);
        });
    }

    function saveTimetable() {
        saveTimetableOnce();
    }

    /**
     * 「再読み込み」ボタン。サーバーの保存済み内容で編集中の表を置き換えます。
     * 未保存の入力があるときは黙って捨てず、先に確認します。
     */
    async function reloadTimetableEditor() {
        if (hasUnsavedTimetableChanges()) {
            var ask = await Swal.fire({
                icon: 'warning',
                title: '未保存の変更を破棄しますか？',
                text: '編集中の内容を捨てて、保存済みの固定時間割を読み直します。',
                showCancelButton: true,
                confirmButtonText: '破棄して読み直す',
                cancelButtonText: 'キャンセル',
                confirmButtonColor: '#ea4335'
            });
            if (!ask.isConfirmed) return;
        }
        loadTimetableEditor();
    }

    // ===== 転記の前に「実際に書き込まれる時間割」を確かめる =====
    // 転記が書き込むのは保存済みの固定時間割で、エディタに表示中の内容ではない。
    // 週案タブの「入力支援」から転記するときはエディタが見えないため、
    // 保存し忘れ・別端末での変更に気づけず「前の時間割が入った」となりやすい。
    // 実行前に必ずサーバーから取り直し、中身を見せてから転記する。

    /** 保存済みの固定時間割をサーバーから取得します（失敗時は null）。 */
    function fetchSavedTimetable() {
        return new Promise(function (resolve) {
            google.script.run
                .withSuccessHandler(function (res) { resolve(res && res.success ? res.data : null); })
                .withFailureHandler(function () { resolve(null); })
                .getTimetableForEditor();
        });
    }

    /** 固定時間割が全欄空かどうか（空のまま転記すると対象週の教科が消える）。 */
    function isTimetableEmpty(timetable) {
        return (timetable || []).every(function (d) {
            var periods = (d && d.periods) || [];
            return !String((d && d.time) || '').trim()
                && !String((d && d.morning) || '').trim()
                && periods.every(function (p) { return !String(p || '').trim(); });
        });
    }

    /** 確認ダイアログ用に、書き込まれる固定時間割を表形式で組み立てます。 */
    function renderTimetablePreviewHtml(timetable) {
        var headers = ['', '時程', '朝', '1', '2', '3', '4', '5', '6'];
        var cellCss = 'border:1px solid var(--border);padding:3px 5px;white-space:nowrap;';
        var headCss = cellCss + 'background:var(--surface-hover);font-weight:600;text-align:center;';
        var html = '<div style="overflow-x:auto;margin-top:10px;">'
            + '<table style="width:100%;border-collapse:collapse;font-size:0.76rem;"><tbody>'
            + '<tr>' + headers.map(function (h) {
                return '<th style="' + headCss + '">' + escHtml(h) + '</th>';
            }).join('') + '</tr>';
        (timetable || []).forEach(function (d, i) {
            var periods = (d && d.periods) || [];
            var cells = [(d && d.time) || '', (d && d.morning) || ''].concat(
                [0, 1, 2, 3, 4, 5].map(function (p) { return periods[p] || ''; }));
            html += '<tr><th style="' + headCss + '">' + escHtml(DAY_NAMES[i] || '') + '</th>'
                + cells.map(function (v) { return '<td style="' + cellCss + '">' + escHtml(v) + '</td>'; }).join('')
                + '</tr>';
        });
        return html + '</tbody></table>'
            + '<p style="margin:6px 0 0;font-size:0.74rem;color:var(--text-sub);">'
            + '↑ これが実際に書き込まれる「保存済みの固定時間割」です。</p></div>';
    }

    /**
     * 転記の前に、未保存の変更を知らせて保存させ、書き込まれる時間割を確認させます。
     * @param {string} title 確認ダイアログの見出し
     * @param {string} descriptionHtml 何が起こるかの説明（HTML）
     * @returns {Promise<?Array>} 転記してよければ保存済み時間割、中止なら null
     */
    async function confirmTimetableBeforeTransfer(title, descriptionHtml) {
        if (hasUnsavedTimetableChanges()) {
            var ask = await Swal.fire({
                icon: 'warning',
                title: '固定時間割が未保存です',
                html: '<div style="text-align:left;font-size:0.88rem;">'
                    + 'エディタの変更がまだ保存されていません。このまま転記すると、'
                    + '<b>保存済みの（変更前の）固定時間割</b>が書き込まれます。</div>',
                showCancelButton: true,
                showDenyButton: true,
                confirmButtonText: '保存してから転記',
                denyButtonText: '保存せずに転記',
                cancelButtonText: 'キャンセル',
                confirmButtonColor: '#1a73e8',
                denyButtonColor: '#f9ab00'
            });
            if (ask.isConfirmed) {
                var saved = await saveTimetableOnce();
                if (!saved) return null;
            } else if (!ask.isDenied) {
                return null;
            }
        }

        var timetable = await fetchSavedTimetable();
        if (!timetable) {
            showToast('error', '固定時間割を取得できませんでした。通信状況を確かめて、もう一度お試しください。');
            return null;
        }

        var empty = isTimetableEmpty(timetable);
        var warning = empty
            ? '<div style="margin-top:10px;padding:8px;border-radius:6px;background:var(--surface-hover);'
              + 'font-size:0.84rem;">⚠ 固定時間割が空です。このまま転記すると、対象週の'
              + '<b>時程・朝学習・各校時がすべて空になります</b>。<br>'
              + '設定タブの「固定時間割エディタ」で入力し、<b>保存</b>してから転記してください。</div>'
            : '';

        var result = await Swal.fire({
            title: title,
            width: 620,
            icon: empty ? 'warning' : 'question',
            html: '<div style="text-align:left;font-size:0.88rem;">' + descriptionHtml + '</div>'
                + warning + renderTimetablePreviewHtml(timetable),
            showCancelButton: true,
            confirmButtonText: '転記する',
            cancelButtonText: 'キャンセル',
            confirmButtonColor: empty ? '#ea4335' : '#1a73e8'
        });
        return result.isConfirmed ? timetable : null;
    }

    async function applyTimetableToCurrentWeek() {
        if (!STATE.mondayStr) {
            showToast('error', '表示中の週が設定されていません。');
            return;
        }
        var timetable = await confirmTimetableBeforeTransfer(
            '時間割の転記',
            '<p style="margin:0;">' + escHtml(STATE.mondayStr) + ' 週の月〜金に、保存済みの固定時間割を転記します。'
            + '対象の時程・朝学習・各校時は上書きされます。</p>');
        if (!timetable) return;

        showToast('info', '転記中...');
        google.script.run
            .withSuccessHandler(function (res) {
                if (res.success) {
                    showToast('success', '' + res.message);
                    STATE.editMode = false;
                    updateEditUI();
                    // 転記でサーバーの週が書き換わったので、転記前の週キャッシュを必ず捨てる。
                    // 残したままだと doLoadWeeklyPlan() が転記前の内容を先に描いてしまい、
                    // それを保存すると転記した時間割が古い内容で上書きされて消える。
                    p2InvalidateWeekCache();
                    doLoadWeeklyPlan(); // 転記後、週案を再読み込み（自動保存をスキップ）
                } else {
                    showToast('error', 'エラー: ' + res.error);
                }
            })
            .withFailureHandler(_onCommError)
            .applyTimetableToWeek(STATE.mondayStr);
    }

    // ===== 長期休業期間設定 & 年間一括転記 =====

    function loadVacationDates() {
        google.script.run
            .withSuccessHandler(function (res) {
                if (res) {
                    document.getElementById('vacSummerStart').value = res.summerStart || '';
                    document.getElementById('vacSummerEnd').value = res.summerEnd || '';
                    document.getElementById('vacWinterStart').value = res.winterStart || '';
                    document.getElementById('vacWinterEnd').value = res.winterEnd || '';
                    document.getElementById('vacSpringStart').value = res.springStart || '';
                    document.getElementById('vacSpringEnd').value = res.springEnd || '';
                    STATE.vacationDatesLoaded = true;
                }
            })
            .withFailureHandler(function (e) {
                showToast('error', '休業日データの取得に失敗: ' + e.message);
            })
            .getDefaultExclusionDates();
    }

    async function runBulkTransfer() {
        var dates = {
            summerStart: document.getElementById('vacSummerStart').value,
            summerEnd: document.getElementById('vacSummerEnd').value,
            winterStart: document.getElementById('vacWinterStart').value,
            winterEnd: document.getElementById('vacWinterEnd').value,
            springStart: document.getElementById('vacSpringStart').value,
            springEnd: document.getElementById('vacSpringEnd').value
        };

        var timetable = await confirmTimetableBeforeTransfer(
            '年間一括転記',
            '<p style="margin:0;">長期休業期間を除外し、来週以降のすべての週に保存済みの固定時間割を転記します。'
            + '対象週の時程・朝学習・各校時は上書きされます。</p>');
        if (!timetable) return;

        var statusEl = document.getElementById('bulkTransferStatus');
        statusEl.textContent = '一括転記を実行中...（数分かかることがあります）';
        showToast('info', '年間一括転記を実行中...');

        google.script.run
            .withSuccessHandler(function (msg) {
                statusEl.textContent = '';
                showToast('success', '' + (msg || '一括転記が完了しました。'));
                // 多数の週を書き換えるため、手元の週キャッシュを全て捨てて表示中の週も読み直す
                p2InvalidateWeekCache(true);
            })
            .withFailureHandler(function (e) {
                statusEl.textContent = '';
                showToast('error', 'エラー: ' + e.message);
            })
            .processBulkTransferWithExclusion(dates);
    }

    // ===== 教科別標準時数エディタ =====

    function loadStandardHours() {
        google.script.run
            .withSuccessHandler(function (res) {
                if (res.success) {
                    STATE.stdHoursData = res.data;
                    renderStdHoursEditor(res.data);
                    STATE.stdHoursLoaded = true;
                } else {
                    showToast('error', 'エラー: ' + (res.error || ''));
                }
            })
            .withFailureHandler(_onCommError)
            .getStandardHours();
    }

    function renderStdHoursEditor(data) {
        var container = document.getElementById('standardHoursEditor');
        container.innerHTML = '';
        data.forEach(function (item, i) {
            var div = document.createElement('div');
            div.className = 'std-hours-item';
            div.innerHTML =
                '<label>' + escHtml(item.subject) + '</label>' +
                '<input type="number" id="stdH_' + i + '" value="' + (item.hours || 0) + '" min="0">';
            container.appendChild(div);
        });
    }

    function saveStdHours() {
        var data = [];
        var container = document.getElementById('standardHoursEditor');
        var items = container.querySelectorAll('.std-hours-item');
        items.forEach(function (item, i) {
            var label = item.querySelector('label').textContent;
            var input = item.querySelector('input');
            data.push({ subject: label, hours: parseInt(input.value) || 0 });
        });
        showToast('info', '保存中...');
        google.script.run
            .withSuccessHandler(function (res) {
                if (res.success) {
                    showToast('success', '' + res.message);
                    STATE.stdHoursData = data;
                } else {
                    showToast('error', 'エラー: ' + res.error);
                }
            })
            .withFailureHandler(_onCommError)
            .saveStandardHours(data);
    }

    // ===== 時数集計ダッシュボード =====
    function loadHoursSummary() {
        if (!STATE.mondayStr) return;
        google.script.run
            .withSuccessHandler(function (res) {
                if (res.success) {
                    STATE.hoursSummaryData = res.data;
                    renderHoursSummary(res.data);
                } else {
                    showToast('error', '時数集計エラー: ' + (res.error || ''));
                }
            })
            .withFailureHandler(_onCommError)
            .getHoursSummary(STATE.mondayStr);
    }

    function renderHoursSummary(data) {
        var container = document.getElementById('hoursSummaryContent');
        if (!data || data.length === 0) {
            container.innerHTML = '<p style="text-align:center;color:var(--text-sub);padding:16px;font-size:0.82rem;">データがありません</p>';
            return;
        }
        var html = '<table class="hours-summary-table"><thead><tr>' +
            '<th>教科</th><th>当週</th><th>累計</th><th>標準</th><th style="width:40%">進捗</th><th>%</th>' +
            '</tr></thead><tbody>';
        data.forEach(function (row) {
            var pct = Math.min(row.percent, 150);
            var overClass = row.percent > 100 ? ' over' : '';
            html += '<tr>' +
                '<td style="font-weight:600;">' + escHtml(row.subject) + '</td>' +
                '<td>' + formatFraction(row.weekly) + '</td>' +
                '<td>' + formatFraction(row.cumulative) + '</td>' +
                '<td>' + row.standard + '</td>' +
                '<td><div class="progress-bar-wrap"><div class="progress-bar-fill' + overClass + '" style="width:' + Math.min(pct, 100) + '%"></div></div></td>' +
                '<td class="pct-label">' + row.percent + '%</td>' +
                '</tr>';
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    // ===== システム設定 =====

    /**
     * Gemini APIから利用可能なモデル一覧を取得し、プルダウンに反映する。
     * @param {boolean} forceReload キャッシュを無視して再取得するか
     */
    function loadGeminiModels(forceReload) {
        if (STATE.geminiModelsCache && !forceReload) {
            populateGeminiModelSelect(STATE.geminiModelsCache);
            return;
        }
        var select = document.getElementById('sysGeminiModelName');
        select.innerHTML = '<option value="">読み込み中...</option>';
        select.disabled = true;
        var warningDiv = document.getElementById('geminiModelWarning');
        warningDiv.style.display = 'none';

        google.script.run
            .withSuccessHandler(function (result) {
                select.disabled = false;
                if (result.success && result.models.length > 0) {
                    STATE.geminiModelsCache = result.models;
                    populateGeminiModelSelect(result.models);
                } else {
                    // API取得失敗時はフォールバック（手入力可能にはしない）
                    select.innerHTML = '<option value="gemini-2.5-flash">gemini-2.5-flash</option>';
                    if (result.error) {
                        warningDiv.textContent = 'モデル一覧の自動取得に失敗しました: ' + result.error;
                        warningDiv.style.display = 'block';
                    }
                    applyCurrentModelSelection();
                }
            })
            .withFailureHandler(function (e) {
                select.disabled = false;
                select.innerHTML = '<option value="gemini-2.5-flash">gemini-2.5-flash</option>';
                var warningDiv = document.getElementById('geminiModelWarning');
                warningDiv.textContent = 'モデル一覧の取得中にエラーが発生しました: ' + e.message;
                warningDiv.style.display = 'block';
                applyCurrentModelSelection();
            })
            .getAvailableGeminiModels();
    }

    /**
     * モデル一覧をセレクトボックスに反映する。
     * @param {Array} models モデル配列 [{name, displayName}]
     */
    function populateGeminiModelSelect(models) {
        var select = document.getElementById('sysGeminiModelName');
        var currentValue = select.dataset.pendingValue || select.value || '';
        select.innerHTML = '';

        models.forEach(function (m) {
            var opt = document.createElement('option');
            opt.value = m.name;
            opt.textContent = m.name + (m.displayName !== m.name ? ' (' + m.displayName + ')' : '');
            select.appendChild(opt);
        });

        applyCurrentModelSelection();
    }

    /**
     * 現在保存されているモデル名をセレクトに反映し、利用不可の場合は警告を表示する。
     */
    function applyCurrentModelSelection() {
        var select = document.getElementById('sysGeminiModelName');
        var savedModel = select.dataset.pendingValue || '';
        var warningDiv = document.getElementById('geminiModelWarning');

        if (!savedModel) return;

        // 保存されているモデルがリストにあるか確認
        var found = false;
        for (var i = 0; i < select.options.length; i++) {
            if (select.options[i].value === savedModel) {
                found = true;
                break;
            }
        }

        if (found) {
            select.value = savedModel;
            warningDiv.style.display = 'none';
        } else {
            // リストにない場合：選択肢の先頭に追加し警告を表示
            var opt = document.createElement('option');
            opt.value = savedModel;
            opt.textContent = savedModel + ' (利用不可)';
            opt.style.color = '#dc3545';
            select.insertBefore(opt, select.firstChild);
            select.value = savedModel;
            warningDiv.innerHTML = '<strong>⚠ 注意:</strong> 現在設定されているモデル「' + savedModel + '」は利用可能なモデル一覧に含まれていません。モデルが廃止された可能性があります。別のモデルを選択してください。';
            warningDiv.style.display = 'block';
        }
        delete select.dataset.pendingValue;
    }

    function loadSystemSettings(opts) {
        if (STATE.isSystemSettingsLoaded) return;
        // 保存直後の再取得では「保存しました」の直後に「読み込み中...」が出て
        // 保存に失敗したように見えるため、silent 指定でトーストを抑止する
        if (!opts || !opts.silent) showToast('info', 'システム設定を読み込み中...');
        google.script.run
            .withSuccessHandler(function (res) {
                document.getElementById('sysCourseName').value = res.courseName || '';
                document.getElementById('sysPostHour').value = res.postHour || '';
                // Geminiモデル名を保留値として保存し、モデル一覧取得後に反映する
                var modelSelect = document.getElementById('sysGeminiModelName');
                modelSelect.dataset.pendingValue = res.geminiModelName || 'gemini-2.5-flash';
                loadGeminiModels(false);

                // 担当学年の反映
                var gradeSelect = document.getElementById('sysGradeSelect');
                if (gradeSelect) {
                    gradeSelect.value = res.grade || '3';
                    // 学年変更イベントの登録
                    gradeSelect.onchange = function () {
                        var newGrade = this.value;
                        showToast('info', '学年設定を変更中...');
                        google.script.run
                            .withSuccessHandler(function (r) {
                                if (r.success) {
                                    STATE.grade = parseInt(newGrade, 10) || 3;
                                    showToast('success', r.message);
                                    // 標準時数エディタの内容も再描画する
                                    STATE.stdHoursData = r.data;
                                    renderStdHoursEditor(r.data);
                                } else {
                                    showToast('error', 'エラー: ' + r.error);
                                }
                            })
                            .withFailureHandler(_onCommError)
                            .saveGrade(newGrade);
                    };
                }

                // APIキー（マスク表示対応）
                document.getElementById('sysGeminiApiKey').value = res.geminiApiKey || '';

                // モジュール学習
                document.getElementById('sysModuleEnabled').checked = !!res.moduleEnabled;

                STATE.isSystemSettingsLoaded = true;

                // 自動実行（トリガー）の状況もあわせて読み直す
                loadMyTriggers();
            })
            .withFailureHandler(function (e) {
                showToast('error', '設定の読み込みに失敗しました: ' + e.message);
            })
            .getAppSettings();
    }

    // ===== 自動実行（トリガー）の状況 =====
    //
    // script.scriptapp で作られたトリガーは Google アカウント側に残るのに、
    // これまでアプリ内から確認する手段がなかった。「何が登録されているか分からない」
    // 状態を作らないため、一覧と解除をここに置く。

    /**
     * このアカウントに登録されている自動実行を読み込み、一覧を描画します。
     */
    function loadMyTriggers() {
        var box = document.getElementById('triggerList');
        if (!box) return;
        box.innerHTML = '<span style="color:var(--text-sub);">読み込み中...</span>';

        google.script.run
            .withSuccessHandler(function (res) {
                if (!res || !res.success) {
                    box.innerHTML = '<span style="color:#c5221f;">'
                        + escHtml((res && res.error) || '取得に失敗しました') + '</span>';
                    return;
                }
                renderMyTriggers(res.triggers || []);
            })
            .withFailureHandler(function (e) {
                box.innerHTML = '<span style="color:#c5221f;">取得に失敗しました: '
                    + escHtml(e.message) + '</span>';
            })
            .getMyTriggersForWebApp();
    }

    /**
     * 自動実行の一覧を描画します。
     * @param {Object[]} triggers getMyTriggersForWebApp() の戻り値
     */
    function renderMyTriggers(triggers) {
        var box = document.getElementById('triggerList');
        if (!box) return;

        if (!triggers.length) {
            box.innerHTML = '<span style="color:var(--text-sub);">'
                + '現在、登録されている自動実行はありません。</span>';
            return;
        }

        box.innerHTML = triggers.map(function (t) {
            var meta = [t.schedule, t.detail].filter(Boolean).join(' / ');
            return '<div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;'
                + ' padding:8px 0; border-bottom:1px solid var(--border);">'
                + '<div><div style="font-weight:600;">' + escHtml(t.label) + '</div>'
                + (meta ? '<div style="font-size:0.78rem; color:var(--text-sub);">' + escHtml(meta) + '</div>' : '')
                + '</div>'
                + '<button class="btn btn-outline" style="flex:none; font-size:0.78rem; padding:4px 10px;"'
                + ' onclick="deleteMyTrigger(\'' + escAttr(t.id) + '\')">解除</button>'
                + '</div>';
        }).join('');
    }

    /**
     * 自動実行を1件解除します。
     * @param {string} triggerId トリガーの一意 ID
     */
    async function deleteMyTrigger(triggerId) {
        var ask = await Swal.fire({
            icon: 'warning',
            title: 'この自動実行を解除しますか？',
            text: '解除すると、この自動実行は動かなくなります。設定画面からいつでも登録し直せます。',
            showCancelButton: true,
            confirmButtonText: '解除する',
            cancelButtonText: 'キャンセル',
            confirmButtonColor: '#ea4335'
        });
        if (!ask.isConfirmed) return;

        google.script.run
            .withSuccessHandler(function (res) {
                if (res && res.success) {
                    showToast('success', res.message || '解除しました');
                } else {
                    showToast('error', 'エラー: ' + ((res && res.error) || '解除に失敗しました'));
                }
                loadMyTriggers();
            })
            .withFailureHandler(function (e) {
                showToast('error', '解除に失敗しました: ' + e.message);
            })
            .deleteMyTriggerForWebApp(triggerId);
    }

    function saveSystemSettings() {
        var settings = {
            courseName: document.getElementById('sysCourseName').value,
            postHour: document.getElementById('sysPostHour').value,
            geminiApiKey: document.getElementById('sysGeminiApiKey').value,
            geminiModelName: document.getElementById('sysGeminiModelName').value,
            moduleEnabled: document.getElementById('sysModuleEnabled').checked
        };

        showToast('info', 'システム設定を保存中...');
        google.script.run
            .withSuccessHandler(function (res) {
                if (res.success) {
                    showToast('success', res.message);
                    // 保存後、念のため再取得してリフレッシュ
                    STATE.isSystemSettingsLoaded = false;
                    loadSystemSettings({ silent: true });
                } else {
                    showToast('error', 'エラー: ' + res.error);
                }
            })
            .withFailureHandler(function (e) {
                showToast('error', '設定の保存に失敗しました: ' + e.message);
            })
            .saveAppSettings(settings);
    }

    function fetchSettingCourseList(inputBtn) {
        inputBtn.disabled = true;
        inputBtn.textContent = '取得中...';

        google.script.run
            .withSuccessHandler(function (courses) {
                inputBtn.disabled = false;
                inputBtn.textContent = '一覧取得';
                if (!courses || courses.length === 0) {
                    showToast('error', '有効なクラスが見つかりません');
                    return;
                }
                var select = document.getElementById('sysCourseSelect');
                select.innerHTML = '<option value="">-- 一覧から選択するか直打ちしてください --</option>';
                courses.forEach(function (c) {
                    var opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    select.appendChild(opt);
                });
                select.style.display = 'block';
                showToast('success', 'コース一覧を取得しました');
            })
            .withFailureHandler(function (e) {
                inputBtn.disabled = false;
                inputBtn.textContent = '一覧取得';
                showToast('error', 'コース取得エラー: ' + e.message);
            })
            .getCourseListForDashboard();
    }

    async function confirmGenerateCalendar() {
        var year = document.getElementById('sysCalYear').value;
        var startMondayStr = document.getElementById('sysCalStartMonday').value;

        if (!year || !startMondayStr) {
            showToast('error', '対象年度と第1週目の月曜日を入力してください。');
            return;
        }

        var swalResult = await Swal.fire({
            title: 'カレンダー再生成',
            html: year + '年度のカレンダー（起点: ' + startMondayStr + '）をデータベースに展開します。<br><small>既存の行事や週案データは消えません</small>',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: '再生成する',
            cancelButtonText: 'キャンセル',
            confirmButtonColor: '#b45309'
        });
        if (!swalResult.isConfirmed) return;

        showToast('info', 'カレンダー生成中...（数秒〜十数秒かかります）');
        google.script.run
            .withSuccessHandler(function (res) {
                if (res.success) {
                    showToast('success', res.message);
                } else {
                    showToast('error', 'エラー: ' + res.error);
                }
            })
            .withFailureHandler(function (e) {
                showToast('error', '致命的なエラー: ' + e.message);
            })
            .generateAnnualCalendar(year, startMondayStr);
    }

    // ===================================================
    // ===== 使用中のデータベース（マルチテナント設定） =====
    // ===================================================

    /**
     * 設定タブの「使用中のデータベース」セクションに現在のテナント状態を表示します。
     * getTenantStatus()（11_Tenant.gs）の結果を用いてDB名・ID・ログインメールを描画し、
     * テンプレート未設定時は「新規作成」ボタンを無効化します。
     */
    function loadTenantInfo() {
        google.script.run
            .withSuccessHandler(function (status) {
                if (!status || !status.success) {
                    // 後方互換: getTenantStatus 非対応の旧バックエンドでは何も壊さない
                    var nameEl0 = document.getElementById('tenantDbName');
                    if (nameEl0) nameEl0.textContent = '（状態を取得できません）';
                    return;
                }
                var nameEl = document.getElementById('tenantDbName');
                var idEl = document.getElementById('tenantDbId');
                var emailEl = document.getElementById('tenantDbEmail');
                var openWrap = document.getElementById('tenantDbOpenWrap');
                var openLink = document.getElementById('tenantDbOpenLink');
                var createBtn = document.getElementById('tenantCreateBtn');

                if (nameEl) nameEl.textContent = status.linked ? (status.spreadsheetName || '(名称不明)') : '未紐付け';
                if (idEl) idEl.textContent = status.spreadsheetId || '-';
                if (emailEl) emailEl.textContent = status.email || '-';

                if (openWrap && openLink) {
                    if (status.linked && status.spreadsheetId) {
                        openLink.href = 'https://docs.google.com/spreadsheets/d/' + status.spreadsheetId + '/edit';
                        openWrap.style.display = 'block';
                    } else {
                        openWrap.style.display = 'none';
                    }
                }
                if (createBtn) {
                    createBtn.disabled = !status.canCreate;
                    createBtn.title = status.canCreate ? '' : '配布元がテンプレートを設定するまで新規作成は利用できません';
                }
            })
            .withFailureHandler(_onCommError)
            .getTenantStatus();
    }

    // ===== データベースの選び方（drive.file スコープ運用） =====
    //
    // アプリが要求するのは drive.file だけなので、触れるのは
    //   1. アプリ自身が作ったスプレッドシート
    //   2. 利用者が Google ピッカーで明示的に選んだスプレッドシート
    // の2つに限られる。URL や ID を打ち込む方法は 1 にしか使えないため、
    // 既存のシートを紐付けるときはピッカーを主な導線にする。
    // オンボーディング（App_Js_01_Core.html）と設定タブの両方から使う。

    /**
     * 紐付けるスプレッドシートを選んでもらい、URL か ID を返します。
     * @returns {Promise<string|null>} 選ばれなければ null
     */
    async function chooseDatabaseSource_() {
        var choice = await Swal.fire({
            title: 'どのシートを使いますか',
            html: '<div style="text-align:left; font-size:0.9rem; line-height:1.8;">'
                + 'このアプリは、<strong>あなたが選んだファイルだけ</strong>にアクセスできます'
                + '（ドライブ全体は見られません）。<br>'
                + 'すでにあるシートを使うときは、<strong>ドライブから選んで</strong>ください。'
                + '</div>',
            width: 560,
            showDenyButton: true,
            showCancelButton: true,
            confirmButtonText: 'ドライブから選ぶ',
            denyButtonText: 'URL / ID を入力',
            cancelButtonText: 'キャンセル',
            confirmButtonColor: '#1a73e8',
            allowOutsideClick: false
        });

        if (choice.isConfirmed) return await pickDatabaseFromDrive_();
        if (!choice.isDenied) return null;

        var typed = await Swal.fire({
            title: 'URL / ID を入力',
            input: 'text',
            inputLabel: 'スプレッドシートの URL または ID',
            inputPlaceholder: 'https://docs.google.com/spreadsheets/d/..../edit',
            html: '<div style="text-align:left; font-size:0.82rem; color:var(--text-sub); line-height:1.7;">'
                + 'このアプリが作ったシートなら、この方法でも切り替えられます。<br>'
                + 'それ以外のシートは「ドライブから選ぶ」を使ってください。'
                + '</div>',
            width: 560,
            showCancelButton: true,
            cancelButtonText: 'キャンセル',
            confirmButtonText: '決定',
            confirmButtonColor: '#1a73e8',
            allowOutsideClick: false,
            inputValidator: function (v) { if (!v) return 'URL または ID を入力してください。'; }
        });
        return typed.isConfirmed ? (typed.value || '') : null;
    }

    /**
     * Google ピッカーでスプレッドシートを1つ選ばせ、そのIDを返します。
     * ここで選ぶと、そのファイルにだけアプリのアクセス権（per-file）が付きます。
     * @returns {Promise<string|null>}
     */
    function pickDatabaseFromDrive_() {
        return new Promise(function (resolve) {
            showToast('info', 'Google ドライブに接続中...');
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success || !res.token) {
                        showToast('error', '認証情報の取得に失敗しました: ' + ((res && res.error) || ''));
                        resolve(null);
                        return;
                    }
                    // 学校のネットワークで apis.google.com が塞がれていると gapi が無い。
                    // 黙って固まらないよう、何が起きたかを伝える。
                    if (typeof gapi === 'undefined' || !gapi.load) {
                        showToast('error', 'Googleドライブの選択画面（apis.google.com）に接続できませんでした。学校のネットワーク制限が原因のことがあります。');
                        resolve(null);
                        return;
                    }
                    var open = function () { showDatabasePicker_(res.token, resolve); };
                    if (!STATE.pickerApiLoaded) {
                        gapi.load('picker', {
                            callback: function () { STATE.pickerApiLoaded = true; open(); }
                        });
                    } else {
                        open();
                    }
                })
                .withFailureHandler(function (e) {
                    showToast('error', '通信エラー: ' + (e && e.message ? e.message : String(e)));
                    resolve(null);
                })
                .getPickerAuthInfo();
        });
    }

    /**
     * スプレッドシートだけを出すピッカーを開きます。
     * @param {string} oauthToken
     * @param {function(string|null)} resolve
     */
    function showDatabasePicker_(oauthToken, resolve) {
        var view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS);
        view.setMimeTypes('application/vnd.google-apps.spreadsheet');
        var picker = new google.picker.PickerBuilder()
            .addView(view)
            // resolvePickerOrigin_ は App_Js_08_Events.html で定義している共通処理
            .setOAuthToken(oauthToken)
            .setCallback(function (data) {
                if (data.action === google.picker.Action.PICKED) {
                    var doc = (data.docs || [])[0];
                    resolve(doc ? doc.id : null);
                } else if (data.action === google.picker.Action.CANCEL) {
                    resolve(null);
                }
            })
            .setOrigin(resolvePickerOrigin_())
            .setTitle('週案データベースにするスプレッドシートを選択')
            .build();
        picker.setVisible(true);
    }

    /** 別の既存スプレッドシートを自分のDBとして紐付け直します（linkMyDatabase）。 */
    async function switchMyDatabaseUI() {
        var source = await chooseDatabaseSource_();
        if (!source) return;

        Swal.fire({
            title: '確認中...',
            html: 'スプレッドシートを確認しています。',
            allowOutsideClick: false,
            allowEscapeKey: false,
            didOpen: function () { Swal.showLoading(); }
        });

        google.script.run
            .withSuccessHandler(function (r) {
                if (r && r.success) {
                    var proceed = function () { reloadApp(); };
                    if (r.warning) {
                        Swal.fire({
                            icon: 'warning',
                            title: '切り替えました（注意）',
                            html: escHtml(r.warning) + '<br>このまま再読み込みします。',
                            confirmButtonColor: '#1a73e8',
                            allowOutsideClick: false
                        }).then(proceed);
                    } else {
                        Swal.fire({
                            icon: 'success',
                            title: '切り替えました',
                            html: '「' + escHtml(r.spreadsheetName || '') + '」に切り替えました。',
                            confirmButtonColor: '#1a73e8',
                            allowOutsideClick: false
                        }).then(proceed);
                    }
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: '切替に失敗しました',
                        html: escHtml((r && r.error) || '不明なエラーが発生しました。'),
                        confirmButtonColor: '#1a73e8'
                    });
                }
            })
            .withFailureHandler(function (e) {
                Swal.fire({ icon: 'error', title: '通信エラー', html: escHtml(e && e.message ? e.message : String(e)), confirmButtonColor: '#1a73e8' });
            })
            .linkMyDatabase(source);
    }

    /** テンプレートを複製して自分専用のDBを新規作成し、切り替えます（createMyDatabase）。 */
    async function createMyDatabaseUI() {
        var input = await Swal.fire({
            title: '新しいデータベースを作成',
            input: 'text',
            inputLabel: 'ファイル名（空欄なら自動で名前を付けます）',
            inputPlaceholder: '例）週案データベース 2026',
            width: 520,
            showCancelButton: true,
            cancelButtonText: 'キャンセル',
            confirmButtonText: '作成して切替',
            confirmButtonColor: '#1a73e8'
        });
        if (!input.isConfirmed) return;

        Swal.fire({
            title: '作成中...',
            html: 'あなた専用のデータベースを作成しています。しばらくお待ちください。',
            allowOutsideClick: false,
            allowEscapeKey: false,
            didOpen: function () { Swal.showLoading(); }
        });

        google.script.run
            .withSuccessHandler(function (r) {
                if (r && r.success) {
                    Swal.fire({
                        icon: 'success',
                        title: '作成しました',
                        html: '新しいデータベースを作成し、切り替えました。',
                        confirmButtonColor: '#1a73e8',
                        allowOutsideClick: false
                    }).then(function () { reloadApp(); });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: '作成に失敗しました',
                        html: escHtml((r && r.error) || '不明なエラーが発生しました。'),
                        confirmButtonColor: '#1a73e8'
                    });
                }
            })
            .withFailureHandler(function (e) {
                Swal.fire({ icon: 'error', title: '通信エラー', html: escHtml(e && e.message ? e.message : String(e)), confirmButtonColor: '#1a73e8' });
            })
            .createMyDatabase(input.value || '');
    }

    /** 現在のDB紐付けを解除します（スプレッドシート自体は削除しません／unlinkMyDatabase）。 */
    async function unlinkMyDatabaseUI() {
        var res = await Swal.fire({
            title: '紐付けを解除しますか？',
            html: 'このアプリと現在のデータベースの紐付けを解除します。<br>'
                + '<strong>スプレッドシート自体（データ）は削除されません。</strong><br>'
                + '解除後は初期設定（作成／紐付け）の画面に戻ります。',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: '解除する',
            cancelButtonText: 'キャンセル',
            confirmButtonColor: 'var(--danger, #d33)'
        });
        if (!res.isConfirmed) return;

        google.script.run
            .withSuccessHandler(function (r) {
                if (r && r.success) {
                    Swal.fire({
                        icon: 'success',
                        title: '解除しました',
                        html: '紐付けを解除しました。初期設定の画面に戻ります。',
                        confirmButtonColor: '#1a73e8',
                        allowOutsideClick: false
                    }).then(function () { reloadApp(); });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: '解除に失敗しました',
                        html: escHtml((r && r.error) || '不明なエラーが発生しました。'),
                        confirmButtonColor: '#1a73e8'
                    });
                }
            })
            .withFailureHandler(function (e) {
                Swal.fire({ icon: 'error', title: '通信エラー', html: escHtml(e && e.message ? e.message : String(e)), confirmButtonColor: '#1a73e8' });
            })
            .unlinkMyDatabase();
    }

</script>
